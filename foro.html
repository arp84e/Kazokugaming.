<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro y Comunidad | KazokuGaming</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <meta name="description" content="Únete al Muro de KazokuGaming. Debate sobre hardware, juegos y noticias con total privacidad.">
    <meta property="og:title" content="Foro de la Comunidad | KazokuGaming">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full flex flex-col lg:flex-row gap-8">
        
        <div class="lg:w-2/3 flex flex-col h-[80vh]">
            <div class="mb-6">
                <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center">
                    <span class="text-amber-400 mr-3">💬</span> Muro de Kazoku
                </h1>
                <p class="text-slate-400 mt-2 text-sm">Comparte descubrimientos o pide consejo.</p>
            </div>

            <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 mb-6 shadow-lg backdrop-blur-sm">
                <textarea id="mensajeInput" rows="3" disabled class="w-full bg-slate-950/50 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500/50 resize-none transition-all disabled:opacity-50" placeholder="Debes iniciar sesión para escribir en el muro..."></textarea>
                <div class="flex justify-between items-center mt-3">
                    <span class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Respeta las normas</span>
                    <button id="btnPublicar" disabled class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-6 py-2 rounded-lg transition shadow-md shadow-cyan-900/20 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                        Publicar
                    </button>
                </div>
            </div>

            <div id="muroMensajes" class="flex-grow overflow-y-auto space-y-4 pr-2">
                <p class="text-slate-500 text-sm text-center py-10 animate-pulse">Sincronizando con el satélite de comunicaciones...</p>
            </div>
        </div>

        <div class="lg:w-1/3">
            <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 lg:p-8 sticky top-24 backdrop-blur-md shadow-2xl" id="panelIdentidad">
                
                <div id="loginFormContainer">
                    <div class="text-center mb-6">
                        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 mb-4 border border-emerald-500/20">🔒</div>
                        <h2 class="text-xl font-bold text-white tracking-tight">Acceso Privado</h2>
                        <p class="text-[11px] text-slate-400 mt-2 leading-relaxed">Crea tu identidad sin dar tu correo. Si pierdes tu contraseña, perderás la cuenta.</p>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tu Apodo</label>
                            <input type="text" id="apodoInput" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:border-cyan-500 focus:outline-none transition" placeholder="Ej. CyberNinja99">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Contraseña (Secreta)</label>
                            <input type="password" id="passInput" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:border-cyan-500 focus:outline-none transition" placeholder="••••••••">
                        </div>
                        
                        <div class="pt-2 flex flex-col space-y-3">
                            <button id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm py-2.5 rounded-lg transition shadow-md cursor-pointer">
                                Entrar al Muro
                            </button>
                            <button id="btnRegistro" class="w-full bg-transparent border border-slate-700 hover:border-slate-500 text-slate-300 font-bold text-sm py-2.5 rounded-lg transition cursor-pointer">
                                Crear Nueva Identidad
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="header.js"></script>
    
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // 🔴 RECUERDA PONER TUS LLAVES DE SUPABASE AQUÍ:
        const supabaseUrl = 'https://gufppojjzrmvgrigblge.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1ZnBwb2pqenJtdmdyaWdibGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNjE4NDAsImV4cCI6MjA5NjkzNzg0MH0.RnYhd4pahFjWpEWZOp4I78HpxBaUeihp6FcntJeYZyU';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // LA LISTA NEGRA (El escudo está activado)
        const blacklist = ['kazokuadmin', 'gameranon22'];

        const muroMensajes = document.getElementById('muroMensajes');
        const loginFormContainer = document.getElementById('loginFormContainer');
        const apodoInput = document.getElementById('apodoInput');
        const passInput = document.getElementById('passInput');
        const btnLogin = document.getElementById('btnLogin');
        const btnRegistro = document.getElementById('btnRegistro');
        const mensajeInput = document.getElementById('mensajeInput');
        const btnPublicar = document.getElementById('btnPublicar');

        async function cifrarPassword(pass) {
            const encoder = new TextEncoder();
            const data = encoder.encode(pass);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // --- SISTEMA DE SESIONES ---
        let usuarioActual = localStorage.getItem('kazoku_usuario');

        function revisarSesion() {
            if (usuarioActual) {
                loginFormContainer.innerHTML = `
                    <div class="text-center space-y-4 animate-fade-in">
                        <div class="mx-auto w-16 h-16 rounded-full flex items-center justify-center font-extrabold text-2xl border-2 shadow-lg shadow-cyan-900/20 ${blacklist.includes(usuarioActual.toLowerCase()) ? 'bg-gradient-to-br from-indigo-500 to-cyan-500 text-white border-cyan-400' : 'bg-slate-800 text-slate-300 border-slate-700'}">
                            ${usuarioActual.charAt(0).toUpperCase()}
                        </div>
                        <h3 class="text-xl font-bold text-white tracking-tight">¡Hola, ${usuarioActual}!</h3>
                        <p class="text-xs text-slate-400">Estás conectado en la red segura.</p>
                        <button id="btnCerrarSesion" class="mt-4 w-full bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 font-bold text-sm py-2 rounded-lg transition cursor-pointer">
                            Desconectar
                        </button>
                    </div>
                `;
                document.getElementById('btnCerrarSesion').addEventListener('click', () => {
                    localStorage.removeItem('kazoku_usuario');
                    window.location.reload();
                });
                
                mensajeInput.disabled = false;
                mensajeInput.placeholder = "Escribe tu mensaje en el muro...";
                btnPublicar.disabled = false;
            }
        }

        // --- REGISTRO DE IDENTIDAD ---
        btnRegistro.addEventListener('click', async () => {
            const apodo = apodoInput.value.trim();
            const pass = passInput.value.trim();

            if(apodo.length < 3 || pass.length < 4) return alert('El apodo debe tener mínimo 3 letras y la contraseña 4.');
            
            // EL ESCUDO ESTÁ ACTIVO AQUÍ:
            if(blacklist.includes(apodo.toLowerCase())) return alert('⚠️ Error: Este apodo es exclusivo del Staff.');

            btnRegistro.innerText = 'Creando...';
            const hash = await cifrarPassword(pass);

            const { error } = await supabase.from('usuarios').insert([{ apodo: apodo, password: hash }]);

            if (error) {
                if(error.code === '23505') alert('Este apodo ya está siendo usado por otro jugador. Elige otro.');
                else alert('Error: ' + error.message);
            } else {
                alert('¡Identidad creada! Haz clic en "Entrar al Muro" para conectarte.');
            }
            btnRegistro.innerText = 'Crear Nueva Identidad';
        });

        // --- INICIAR SESIÓN ---
        btnLogin.addEventListener('click', async () => {
            const apodo = apodoInput.value.trim();
            const pass = passInput.value.trim();
            if(!apodo || !pass) return alert('Completa los datos.');

            btnLogin.innerText = 'Verificando...';
            const hash = await cifrarPassword(pass);

            const { data, error } = await supabase.from('usuarios').select('*').eq('apodo', apodo).eq('password', hash);

            if (error || data.length === 0) {
                alert('Apodo o contraseña incorrectos.');
            } else {
                localStorage.setItem('kazoku_usuario', apodo);
                window.location.reload();
            }
            btnLogin.innerText = 'Entrar al Muro';
        });

        // --- PUBLICAR MENSAJE ---
        btnPublicar.addEventListener('click', async () => {
            const texto = mensajeInput.value.trim();
            if(!texto) return;

            btnPublicar.disabled = true;
            btnPublicar.innerText = 'Enviando...';

            const { error } = await supabase.from('mensajes').insert([{ autor_apodo: usuarioActual, contenido: texto }]);

            btnPublicar.disabled = false;
            btnPublicar.innerText = 'Publicar';

            if(error) {
                alert('Error al publicar: ' + error.message);
            } else {
                mensajeInput.value = '';
                cargarMensajes();
            }
        });

        // --- FUNCIÓN DEL MODERADOR (Borrar Mensajes) ---
        window.borrarMensaje = async function(id) {
            if(!confirm('🚨 ¿Estás seguro de que deseas eliminar este mensaje del muro?')) return;
            
            const { error } = await supabase.from('mensajes').delete().eq('id', id);
            
            if(error) {
                alert('Error al borrar el mensaje: ' + error.message);
            } else {
                cargarMensajes(); // Recarga el muro automáticamente tras borrar
            }
        };

        // --- CARGAR EL MURO EN TIEMPO REAL ---
        async function cargarMensajes() {
            const { data, error } = await supabase.from('mensajes').select('*').order('created_at', { ascending: false }).limit(50);

            if(error) {
                muroMensajes.innerHTML = '<p class="text-red-400 text-sm py-4 text-center">⚠️ No se pudo contactar con la base de datos.</p>';
                return;
            }

            muroMensajes.innerHTML = '';
            if(data.length === 0) {
                muroMensajes.innerHTML = '<p class="text-slate-500 text-sm text-center py-10">El muro está vacío. ¡Sé el primero en iniciar la conversación!</p>';
                return;
            }

            data.forEach(msg => {
                const inicial = msg.autor_apodo.charAt(0).toUpperCase();
                const esAdminPosteando = blacklist.includes(msg.autor_apodo.toLowerCase());
                const soyAdminViendo = usuarioActual && blacklist.includes(usuarioActual.toLowerCase());
                
                // Si es un admin el que posteó, le damos colores y estética especial
                const colorAvatar = esAdminPosteando ? 'bg-gradient-to-br from-indigo-500 to-cyan-500 text-white shadow-lg' : 'bg-slate-800 text-slate-400 border border-slate-700';
                const colorNombre = esAdminPosteando ? 'text-cyan-400 font-extrabold' : 'text-white font-bold';
                const etiquetaAdmin = esAdminPosteando ? '<span class="px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 text-[9px] uppercase tracking-widest border border-indigo-500/30 ml-2">Staff</span>' : '';
                
                // Botón de moderación exclusivo si el que está viendo la pantalla es un Admin
                let botonBorrarHTML = '';
                if (soyAdminViendo) {
                    botonBorrarHTML = `<button onclick="borrarMensaje('${msg.id}')" class="ml-auto text-[10px] font-bold uppercase tracking-widest bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/30 px-2 py-1 rounded transition cursor-pointer">Eliminar</button>`;
                }
                
                // Formateamos la hora
                const fecha = new Date(msg.created_at).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });

                const div = document.createElement('div');
                div.className = 'bg-slate-900/30 border border-slate-800/50 rounded-xl p-5 flex space-x-4 shrink-0 transition hover:bg-slate-900/50 group';
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold shrink-0 ${colorAvatar}">${inicial}</div>
                    <div class="flex-grow">
                        <div class="flex items-center mb-1 w-full">
                            <span class="text-sm ${colorNombre}">${msg.autor_apodo}</span>
                            ${etiquetaAdmin}
                            <span class="text-[10px] text-slate-500 ml-3">· ${fecha}</span>
                            ${botonBorrarHTML}
                        </div>
                        <p class="text-sm text-slate-300 leading-relaxed">${msg.contenido}</p>
                    </div>
                `;
                muroMensajes.appendChild(div);
            });
        }

        // Ejecutar funciones al arrancar la página
        revisarSesion();
        cargarMensajes();
    </script>
</body>
</html>
