<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro y Comunidad | KazokuGaming</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    </style>
</head>
<body class="text-slate-200 h-screen flex flex-col">

    <div id="header-container"></div>

    <main class="flex-grow max-w-4xl mx-auto px-4 w-full flex flex-col py-6 overflow-hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl flex-grow flex flex-col overflow-hidden shadow-2xl relative">
            
            <div id="muro-mensajes" class="flex-grow overflow-y-auto p-4 md:p-6 space-y-4">
                </div>

            <div class="bg-slate-950 p-4 border-t border-slate-800">
                <div id="panel-login" class="flex flex-col md:flex-row gap-3">
                    <input type="text" id="inputApodo" placeholder="Tu Apodo (Solo para Registro)" class="bg-slate-900 border border-slate-700 text-sm rounded-lg px-4 py-2 focus:border-cyan-500 outline-none text-white">
                    <input type="email" id="inputEmail" placeholder="Tu Email" class="bg-slate-900 border border-slate-700 text-sm rounded-lg px-4 py-2 focus:border-cyan-500 outline-none text-white">
                    <input type="password" id="inputPass" placeholder="Contraseña" class="bg-slate-900 border border-slate-700 text-sm rounded-lg px-4 py-2 focus:border-cyan-500 outline-none text-white">
                    <div class="flex gap-2">
                        <button onclick="intentarRegistro()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-4 rounded-lg text-sm transition">Registrar</button>
                        <button onclick="intentarLogin()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded-lg text-sm transition">Entrar</button>
                    </div>
                </div>

                <div id="panel-chat" class="hidden flex gap-3">
                    <input type="text" id="inputMensaje" placeholder="Escribe tu mensaje..." class="flex-grow bg-slate-900 border border-slate-700 text-sm rounded-lg px-4 py-3 focus:border-cyan-500 outline-none text-white" onkeypress="if(event.key === 'Enter') enviarMensaje()">
                    <button onclick="enviarMensaje()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-2 px-6 rounded-lg transition shadow-[0_0_15px_rgba(6,182,212,0.4)]">ENVIAR</button>
                    <button onclick="cerrarSesion()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 font-bold py-2 px-4 rounded-lg text-sm transition">Salir</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../header.js"></script>
    <script>
        // CONFIGURACIÓN DE SUPABASE
        const supabaseUrl = 'https://gufppojjzrmvgrigblge.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1ZnBwb2pqenJtdmdyaWdibGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNjE4NDAsImV4cCI6MjA5NjkzNzg0MH0.RnYhd4pahFjWpEWZOp4I78HpxBaUeihp6FcntJeYZyU';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let usuarioActual = null;

        // Validar sesión al entrar
        async function revisarSesion() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                usuarioActual = session.user;
                document.getElementById('panel-login').classList.add('hidden');
                document.getElementById('panel-chat').classList.remove('hidden');
            } else {
                document.getElementById('panel-login').classList.remove('hidden');
                document.getElementById('panel-chat').classList.add('hidden');
            }
        }

        // [SEGURIDAD] Cifrado y registro delegado a Supabase
        async function intentarRegistro() {
            const email = document.getElementById('inputEmail').value.trim();
            const pass = document.getElementById('inputPass').value;
            const apodo = document.getElementById('inputApodo').value.trim();

            if(!email || !pass || !apodo) { alert("Completa todos los campos"); return; }

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: pass,
                options: { data: { apodo: apodo } }
            });

            if (error) alert("Error: " + error.message);
            else alert("¡Registro exitoso! Ya puedes iniciar sesión.");
        }

        // [SEGURIDAD] Inicio de sesión protegido por Tokens
        async function intentarLogin() {
            const email = document.getElementById('inputEmail').value.trim();
            const pass = document.getElementById('inputPass').value;

            if(!email || !pass) { alert("Ingresa tu correo y contraseña"); return; }

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: pass
            });

            if (error) { alert("Credenciales incorrectas."); return; }
            window.location.reload(); 
        }

        async function cerrarSesion() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        async function cargarMensajes() {
            const { data: mensajes, error } = await supabase
                .from('mensajes')
                .select('*')
                .order('created_at', { ascending: true })
                .limit(50);

            if (error) return console.error(error);

            const muro = document.getElementById('muro-mensajes');
            muro.innerHTML = '';

            mensajes.forEach(msg => {
                const fecha = new Date(msg.created_at).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
                const inicial = msg.autor_apodo ? msg.autor_apodo.charAt(0).toUpperCase() : 'U';
                
                let botonBorrarHTML = '';
                // Mostrar botón solo si el mensaje es del usuario (La validación real ocurre en el backend RLS)
                if(usuarioActual && usuarioActual.id === msg.user_id) {
                    botonBorrarHTML = `<button onclick="borrarMensaje('${msg.id}')" class="ml-auto text-[10px] text-red-500 hover:text-red-400 cursor-pointer transition">Eliminar</button>`;
                }

                const div = document.createElement('div');
                div.className = 'bg-slate-900/30 border border-slate-800/50 rounded-xl p-4 flex space-x-4 shrink-0 transition hover:bg-slate-900/50';
                div.innerHTML = `
                    <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold shrink-0 text-sm bg-cyan-500/20 text-cyan-400">${inicial}</div>
                    <div class="flex-grow min-w-0">
                        <div class="flex items-center mb-1 w-full">
                            <span class="text-sm font-bold text-white truncate">${msg.autor_apodo}</span>
                            <span class="text-[10px] text-slate-500 ml-3 shrink-0">${fecha}</span>
                            ${botonBorrarHTML}
                        </div>
                        <p class="text-sm text-slate-300 leading-relaxed break-words">${msg.contenido}</p>
                    </div>
                `;
                muro.appendChild(div);
            });
            muro.scrollTop = muro.scrollHeight;
        }

        async function enviarMensaje() {
            if(!usuarioActual) return;
            const input = document.getElementById('inputMensaje');
            const contenido = input.value.trim();
            if(!contenido) return;

            const apodoMeta = usuarioActual.user_metadata?.apodo || 'Jugador';

            const { error } = await supabase.from('mensajes').insert([{
                user_id: usuarioActual.id,
                autor_apodo: apodoMeta,
                contenido: contenido
            }]);

            if (error) alert("Error al enviar: " + error.message);
            else { input.value = ''; cargarMensajes(); }
        }

        async function borrarMensaje(id) {
            const { error } = await supabase.from('mensajes').delete().eq('id', id);
            if(error) alert("Acción bloqueada: No tienes permisos en el servidor.");
            else cargarMensajes();
        }

        // Websockets nativos para recarga en tiempo real
        supabase.channel('mensajes_realtime')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'mensajes' }, payload => {
                cargarMensajes();
            }).subscribe();

        revisarSesion();
        cargarMensajes();
    </script>
</body>
</html>
