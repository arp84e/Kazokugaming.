<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Precios | KazokuGaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; margin: 0; color: #ffffff;}
        .gamer-font { font-family: 'Orbitron', sans-serif; }
        .neon-border-cyan { box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); border: 1px solid rgba(0, 240, 255, 0.4); }
        .neon-glow-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.6); }

        /* Barra Superior KazokuGaming */
        .header-kz { background-color: rgba(20, 20, 25, 0.85); backdrop-filter: blur(12px); padding: 10px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00f0ff; position: sticky; top: 0; z-index: 100; }
        .logo-img { max-height: 50px; transition: transform 0.3s ease; }
        .logo-img:hover { transform: scale(1.05); }
        .nav-menu { display: flex; list-style: none; gap: 20px; margin: 0; padding: 0; }
        .nav-menu a { color: #a1a1aa; text-decoration: none; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; padding: 8px 16px; border-radius: 6px; border: 1px solid transparent; }
        .nav-menu a:hover { color: #ffffff; text-shadow: 0 0 8px #00f0ff; }
        
        @media (max-width: 768px) { .header-kz { flex-direction: column; gap: 15px; padding: 15px; } .nav-menu { flex-wrap: wrap; justify-content: center; gap: 10px; } }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="header-kz">
        <a href="index.html" class="logo-container">
            <img src="1779650326105.png" alt="KazokuGaming Logo" class="logo-img">
        </a>
        <nav>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="lanzamientos.html" target="_blank">Lanzamientos</a></li>
                <li><a href="radar.html" style="color: #ffffff; border: 1px solid #00f0ff; background-color: rgba(0, 240, 255, 0.1);">Radar de Precios</a></li>
            </ul>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="gamer-font text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">
                    📡 RADAR DE PRECIOS
                </h1>
                <p class="text-xs text-gray-400 mt-1">Las mejores ofertas en juegos digitales detectadas hoy en la red</p>
            </div>
            <span class="mt-3 md:mt-0 text-xs bg-cyan-900/40 border border-cyan-500 text-cyan-300 px-3 py-1 rounded-full uppercase tracking-widest font-semibold animate-pulse">
                🔴 ESCANEO EN VIVO
            </span>
        </div>

        <div id="loadingState" class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-400 mx-auto mb-4"></div>
            <p class="gamer-font text-cyan-400 animate-pulse tracking-widest text-sm">ESCANEANDO TIENDAS DIGITALES (STEAM, EPIC, ENÉBA y MÁS)...</p>
        </div>

        <section id="resultsSection" class="hidden">
            <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>
    </main>

    <script>
        // Mapeo de IDs de tiendas de CheapShark a nombres limpios y visibles
        const ID_TIENDAS = {
            "1": "Steam Store",
            "2": "GamersGate",
            "3": "GreenManGaming",
            "7": "GOG.com",
            "11": "Epic Games Store",
            "25": "Epic Games",
            "34": "Eneba / Keys"
        };

        async function cargarTopOfertas() {
            const container = document.getElementById('cardsContainer');
            const loading = document.getElementById('loadingState');
            const section = document.getElementById('resultsSection');

            try {
                // Pedimos un volumen alto de ofertas (120) para tener suficiente variedad tras filtrar
                const respuesta = await fetch('https://www.cheapshark.com/api/1.0/deals?pageSize=120&sortBy=Metacritic');
                if (!respuesta.ok) throw new Error("Error de red");
                const ofertas = await respuesta.json();

                loading.classList.add('hidden');
                section.classList.remove('hidden');
                container.innerHTML = "";

                // FILTRO DE DUPLICADOS: Guardaremos los nombres que ya se mostraron
                const juegosMostrados = new Set();
                let ofertasContadas = 0;

                for (let i = 0; i < ofertas.length; i++) {
                    const item = ofertas[i];
                    
                    // Limpiamos el título para detectar duplicados base (ej: quita "Deluxe Edition", "GOTY", etc.)
                    // Esto ayuda a que si ya está "The Witcher 3", no se repita "The Witcher 3 GOTY"
                    const tituloBase = item.title.split('-')[0].split('(')[0].trim().toLowerCase();

                    // Si el juego ya está en nuestra lista de mostrados, nos lo saltamos
                    if (juegosMostrados.has(tituloBase)) {
                        continue; 
                    }

                    // Si no está duplicado, lo registramos en el filtro
                    juegosMostrados.add(tituloBase);
                    ofertasContadas++;

                    // Formateamos los datos visuales
                    const tiendaNombre = ID_TIENDAS[item.storeID] || "Tienda Digital";
                    const descuento = Math.round(parseFloat(item.savings));
                    
                    let badgeHTML = `<span class="text-[10px] font-bold px-2 py-0.5 rounded border border-slate-700 bg-slate-800 text-gray-400 gamer-font">RANK #${ofertasContadas}</span>`;
                    let highlightCard = "border-slate-800 bg-slate-950/60";
                    
                    if (ofertasContadas <= 3) {
                        badgeHTML = `<span class="text-[10px] font-bold px-2 py-0.5 rounded border border-cyan-400 bg-cyan-950 text-cyan-400 gamer-font">🔥 TOP DEL DÍA</span>`;
                        highlightCard = "neon-border-cyan bg-gradient-to-b from-cyan-950/20 to-slate-950";
                    }

                    const cardHtml = `
                        <div class="rounded-xl overflow-hidden border flex flex-col justify-between transition-all transform hover:-translate-y-1 hover:shadow-xl ${highlightCard}">
                            <div class="p-4 pb-2">
                                <div class="flex justify-between items-center mb-3">
                                    ${badgeHTML}
                                    <span class="text-[10px] uppercase font-bold text-purple-400 tracking-wider">${tiendaNombre}</span>
                                </div>
                                <h3 class="font-bold text-base text-white tracking-wide truncate" title="${item.title}">${item.title}</h3>
                            </div>

                            <div class="h-28 w-full bg-slate-900 relative overflow-hidden border-y border-slate-800/60">
                                <img src="${item.thumb}" alt="Portada de ${item.title}" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-all duration-300" onerror="this.src='https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=400&auto=format&fit=crop'">
                                <div class="absolute bottom-2 right-2 bg-rose-600 px-2 py-0.5 rounded text-xs font-black text-white border border-rose-500">
                                    -${descuento}%
                                </div>
                            </div>

                            <div class="p-4 space-y-2 bg-slate-900/40">
                                <div class="flex justify-between text-xs text-gray-500">
                                    <span>Precio anterior:</span>
                                    <span class="line-through">$${item.normalPrice}</span>
                                </div>
                                <hr class="border-slate-800/60 my-2">
                                <div class="flex justify-between items-end">
                                    <span class="text-xs uppercase font-bold text-gray-400">Oferta:</span>
                                    <span class="text-xl font-black text-cyan-400 gamer-font neon-glow-cyan">
                                        $${item.salePrice}
                                    </span>
                                </div>
                            </div>

                            <div class="p-4 pt-0">
                                <a href="https://www.cheapshark.com/redirect?dealID=${item.dealID}" target="_blank" class="block w-full text-center text-xs gamer-font uppercase font-bold tracking-wider bg-slate-800 hover:bg-cyan-500 hover:text-black text-cyan-400 py-2.5 rounded-lg border border-cyan-500/20 transition-all">
                                    🎮 IR A LA OFERTA
                                </a>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHtml);

                    // Frenamos cuando logremos llenar exactamente las 12 mejores ofertas únicas
                    if (ofertasContadas >= 12) {
                        break;
                    }
                }

            } catch (error) {
                console.error(error);
                loading.innerHTML = `<p style="color: #ef4444;" class="gamer-font text-xs">⚠️ FALLÓ EL ESCANEO DE TIENDAS. INTENTA MÁS TARDE.</p>`;
            }
        }

        cargarTopOfertas();
    </script></body>
</html>
