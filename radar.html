<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Precios | KazokuGaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: white; font-family: sans-serif; }
        .neon-card { border: 1px solid #00f0ff; box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-cyan-400 mb-6">🎮 Radar de Precios Real</h1>
        
        <div class="bg-slate-900 p-6 rounded-lg mb-8">
            <input type="text" id="gameInput" placeholder="Escribe el nombre del juego..." class="w-full p-3 bg-slate-800 rounded mb-4 text-white">
            <button onclick="buscarJuego()" class="w-full bg-cyan-500 hover:bg-cyan-600 p-3 rounded font-bold text-black">ESCANEAR TIENDAS</button>
        </div>

        <div id="loading" class="hidden text-center text-cyan-400">Escaneando bases de datos...</div>
        <div id="resultados" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </div>

    <script>
        async function buscarJuego() {
            const query = document.getElementById('gameInput').value;
            const resultadosDiv = document.getElementById('resultados');
            const loading = document.getElementById('loading');
            
            resultadosDiv.innerHTML = "";
            loading.classList.remove('hidden');

            try {
                // 1. Buscamos el ID del juego
                const response = await fetch(`https://www.cheapshark.com/api/1.0/games?title=${query}&limit=1`);
                const games = await response.json();

                if (games.length === 0) {
                    resultadosDiv.innerHTML = "<p>Juego no encontrado.</p>";
                    loading.classList.add('hidden');
                    return;
                }

                const gameID = games[0].gameID;
                const gameTitle = games[0].external;

                // 2. Buscamos los mejores precios para ese ID
                const dealResponse = await fetch(`https://www.cheapshark.com/api/1.0/games?id=${gameID}`);
                const data = await dealResponse.json();

                // 3. Mostramos el TOP 3
                const top3 = data.deals.slice(0, 3);
                
                loading.classList.add('hidden');
                
                top3.forEach(deal => {
                    resultadosDiv.innerHTML += `
                        <div class="neon-card p-4 rounded-lg bg-slate-900">
                            <img src="${data.info.thumb}" class="w-full h-32 object-cover mb-4">
                            <h3 class="font-bold text-lg">${gameTitle}</h3>
                            <p class="text-cyan-400 text-2xl font-bold">$${deal.price}</p>
                            <a href="https://www.cheapshark.com/redirect?dealID=${deal.dealID}" target="_blank" class="block mt-4 bg-purple-600 text-center py-2 rounded">COMPRAR</a>
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                loading.classList.add('hidden');
                resultadosDiv.innerHTML = "<p>Error al conectar con el servidor de precios.</p>";
            }
        }
    </script>
</body>
</html>
