<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Reportaje | KazokuGaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div id="cuerpo-global" class="flex flex-col lg:flex-row gap-12 relative">
            
            <div class="lg:w-3/4 w-full" id="area-articulo">
                <div class="text-center py-12"><div class="animate-spin rounded-full h-8 w-8 border-t-2 border-cyan-400 mx-auto"></div></div>
            </div>

            <aside class="lg:w-1/4 w-full hidden lg:block">
                <div class="sticky top-8 bg-slate-900/40 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <h4 class="text-sm font-extrabold text-white uppercase tracking-widest mb-4 border-b border-slate-800 pb-2">📖 En este artículo</h4>
                    <ul id="indice-flotante" class="space-y-3 text-sm text-slate-400"></ul>
                </div>
            </aside>
        </div>

        <div id="zona-relacionados" class="mt-20 pt-10 border-t border-slate-900 hidden">
            <h3 class="text-2xl font-bold text-white mb-6">Te podría interesar...</h3>
            <div id="grid-relacionados" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

        <div class="mt-16 pt-10 border-t border-slate-900 max-w-4xl mx-auto" id="seccion-comentarios">
            <div class="flex items-center justify-between mb-8">
                <h3 class="text-2xl font-bold text-white flex items-center gap-2">
                    <span class="text-cyan-400">💬</span> Debate Comunitario
                </h3>
            </div>

            <div id="caja-escribir-comentario" class="bg-slate-900/30 border border-slate-800 rounded-2xl p-5 mb-8 shadow-lg"></div>

            <div class="bg-slate-900/20 border border-slate-800/60 rounded-2xl p-4 sm:p-6 shadow-inner">
                <div id="lista-comentarios" class="space-y-3">
                    <p class="text-slate-500 text-sm text-center py-6 animate-pulse">Sincronizando red de comentarios...</p>
                </div>
            </div>
        </div>

    </main>

    <script src="header.js"></script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://gufppojjzrmvgrigblge.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1ZnBwb2pqenJtdmdyaWdibGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNjE4NDAsImV4cCI6MjA5NjkzNzg0MH0.RnYhd4pahFjWpEWZOp4I78HpxBaUeihp6FcntJeYZyU';
        const supabase = createClient(supabaseUrl, supabaseKey);

        const blacklist = ['kazokuadmin', 'gameranon22'];
        const usuarioActual = localStorage.getItem('kazoku_usuario');
        const params = new URLSearchParams(window.location.search);
        const idArticulo = params.get('id');

        async function cargarArticuloYRelacionados() {
            try {
                const res = await fetch('articulos.json');
                const lista = await res.json();
                const articulo = lista.find(a => a.id === idArticulo);
                
                if (articulo) {
                    const palabras = (articulo.cuerpo || "").replace(/<[^>]*>?/gm, '').split(/\s+/).length;
                    const tiempo = Math.ceil(palabras / 200);

                    document.getElementById('area-articulo').innerHTML = `
                        <div class="mb-8">
                            <span class="text-xs bg-cyan-900/30 text-cyan-400 px-3 py-1 rounded border border-cyan-800/50 uppercase font-bold tracking-widest">${articulo.categoria}</span>
                            <span class="text-slate-500 text-xs ml-3 border-l border-slate-700 pl-3">⏳ ${tiempo} min de lectura</span>
                            <h1 class="text-4xl sm:text-5xl font-extrabold text-white mt-4 mb-4 leading-tight">${articulo.titulo}</h1>
                            <p class="text-lg text-slate-400">${articulo.resumen}</p>
                        </div>
                        <div class="w-full aspect-video rounded-2xl overflow-hidden mb-10 shadow-2xl shadow-black">
                            <img src="${articulo.imagen}" class="w-full h-full object-cover">
                        </div>
                        <div class="prose-custom text-lg text-slate-300" id="contenido-real">${articulo.cuerpo}</div>
                    `;
                    document.title = `${articulo.titulo} | KazokuGaming`;

                    const subtitulos = document.querySelectorAll('#contenido-real h3');
                    const indice = document.getElementById('indice-flotante');
                    if(subtitulos.length > 0) {
                        subtitulos.forEach((h3, index) => {
                            const idSeccion = `seccion-${index}`;
                            h3.id = idSeccion; 
                            indice.innerHTML += `<li><a href="#${idSeccion}" class="hover:text-cyan-400 transition-colors inline-block w-full">${h3.innerText}</a></li>`;
                        });
                    } else {
                        indice.innerHTML = "<li>No hay subsecciones.</li>";
                    }

                    const relacionados = lista.filter(a => a.categoria === articulo.categoria && a.id !== articulo.id).slice(0, 3);
                    if(relacionados.length > 0) {
                        document.getElementById('zona-relacionados').classList.remove('hidden');
                        const gridRel = document.getElementById('grid-relacionados');
                        relacionados.forEach(rel => {
                            gridRel.innerHTML += `
                                <a href="articulo.html?id=${rel.id}" class="group block bg-slate-900 border border-slate-800 rounded-xl overflow-hidden hover:border-cyan-700 transition">
                                    <div class="h-32 overflow-hidden"><img src="${rel.imagen}" class="w-full h-full object-cover group-hover:scale-105 transition"></div>
                                    <div class="p-4"><h5 class="text-white font-bold text-sm line-clamp-2">${rel.titulo}</h5></div>
                                </a>
                            `;
                        });
                    }
                } else {
                    document.getElementById('area-articulo').innerHTML = "<h1 class='text-2xl text-white'>Error 404: Artículo no encontrado.</h1>";
                    document.getElementById('seccion-comentarios').classList.add('hidden');
                }
            } catch (error) {
                console.error("Error al cargar artículo:", error);
            }
        }

        const cajaEscribir = document.getElementById('caja-escribir-comentario');
        const listaComentarios = document.getElementById('lista-comentarios');

        function renderizarCajaInput() {
            if (usuarioActual) {
                const inicial = usuarioActual.charAt(0).toUpperCase();
                const esAdmin = blacklist.includes(usuarioActual.toLowerCase());
                const colorAvatar = esAdmin ? 'bg-gradient-to-br from-indigo-500 to-cyan-500 text-white border-cyan-400' : 'bg-slate-800 text-slate-300 border-slate-700';

                cajaEscribir.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold shrink-0 text-sm border shadow-lg ${colorAvatar}">
                            ${inicial}
                        </div>
                        <div class="flex-grow">
                            <textarea id="textoComentario" rows="2" class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500/80 transition-all resize-none" placeholder="¿Qué opinas sobre esto, ${usuarioActual}?"></textarea>
                            <div class="flex justify-between items-center mt-3">
                                <span class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Opina con respeto</span>
                                <button id="btnPublicarCom" class="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-5 py-2 rounded-lg transition shadow-md cursor-pointer disabled:opacity-50">
                                    Publicar Comentario
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('btnPublicarCom').addEventListener('click', async () => {
                    const texto = document.getElementById('textoComentario').value.trim();
                    if(!texto) return;

                    const btn = document.getElementById('btnPublicarCom');
                    btn.disabled = true;
                    btn.innerText = 'Publicando...';

                    const { error } = await supabase.from('comentarios_articulos').insert([{ 
                        articulo_id: idArticulo, 
                        autor_apodo: usuarioActual, 
                        contenido: texto 
                    }]);

                    btn.disabled = false;
                    btn.innerText = 'Publicar Comentario';

                    if(error) {
                        alert('Error detallado de Supabase al escribir: ' + error.message);
                    } else {
                        document.getElementById('textoComentario').value = '';
                        await cargarComentarios(); 
                    }
                });

            } else {
                cajaEscribir.innerHTML = `
                    <div class="text-center py-4 space-y-3">
                        <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-indigo-500/10 text-indigo-400 mb-1 border border-indigo-500/20">🔒</div>
                        <h4 class="text-lg font-bold text-white">Identidad Requerida</h4>
                        <p class="text-slate-400 text-sm">Debes formar parte de la red KazokuGaming para participar en el debate.</p>
                        <a href="foro.html" class="inline-block bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-6 py-2.5 rounded-lg transition shadow-md mt-2">
                            Entrar o Crear Identidad en el Foro
                        </a>
                    </div>
                `;
            }
        }

        window.borrarComentario = async function(id) {
            if(!confirm('🚨 ¿Estás seguro de que deseas eliminar este comentario?')) return;
            const { error } = await supabase.from('comentarios_articulos').delete().eq('id', id);
            if(error) alert('Error al borrar: ' + error.message);
            else cargarComentarios();
        };

        async function cargarComentarios() {
            if(!idArticulo) return;

            const { data, error } = await supabase
                .from('comentarios_articulos')
                .select('*')
                .eq('articulo_id', idArticulo)
                .order('created_at', { ascending: false });

            // 🛑 AQUÍ IMPRIMIMOS EL ERROR REAL DE LA BASE DE DATOS
            if(error) {
                listaComentarios.innerHTML = `
                    <div class="bg-red-900/20 border border-red-500/30 p-4 rounded-xl text-center max-w-lg mx-auto mt-4">
                        <p class="text-red-400 text-sm font-bold mb-2">⚠️ Supabase ha bloqueado la conexión</p>
                        <code class="text-red-300 text-xs block bg-black/50 p-3 rounded mb-3 break-all font-mono">${error.message}</code>
                        <p class="text-slate-400 text-xs">El código web está perfecto, pero tu base de datos está rechazando la lectura. Sigue el Paso 2 para solucionarlo.</p>
                    </div>`;
                console.error("Error de Supabase:", error);
                return;
            }

            listaComentarios.innerHTML = '';
            
            if(data.length === 0) {
                listaComentarios.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">No hay opiniones aún. ¡Sé el primero en compartir la tuya!</p>';
                return;
            }

            data.forEach(msg => {
                const inicial = msg.autor_apodo.charAt(0).toUpperCase();
                const esAdminPosteando = blacklist.includes(msg.autor_apodo.toLowerCase());
                const soyAdminViendo = usuarioActual && blacklist.includes(usuarioActual.toLowerCase());
                
                const colorAvatar = esAdminPosteando ? 'bg-gradient-to-br from-indigo-500 to-cyan-500 text-white shadow-lg' : 'bg-slate-800 text-slate-400 border border-slate-700';
                const colorNombre = esAdminPosteando ? 'text-cyan-400 font-extrabold' : 'text-white font-bold';
                const etiquetaAdmin = esAdminPosteando ? '<span class="px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 text-[9px] uppercase tracking-widest border border-indigo-500/30 ml-2">Staff</span>' : '';
                
                let botonBorrarHTML = '';
                if (soyAdminViendo) {
                    botonBorrarHTML = `<button onclick="borrarComentario('${msg.id}')" class="ml-auto text-[10px] font-bold uppercase tracking-widest bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/30 px-2 py-1 rounded transition cursor-pointer">Eliminar</button>`;
                }
                
                const fecha = new Date(msg.created_at).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });

                const div = document.createElement('div');
                div.className = 'bg-slate-900/30 border border-slate-800/50 rounded-xl p-4 flex space-x-4 shrink-0 transition hover:bg-slate-900/50';
                div.innerHTML = `
                    <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold shrink-0 text-sm ${colorAvatar}">${inicial}</div>
                    <div class="flex-grow min-w-0">
                        <div class="flex items-center mb-1 w-full">
                            <span class="text-sm ${colorNombre} truncate">${msg.autor_apodo}</span>
                            ${etiquetaAdmin}
                            <span class="text-[10px] text-slate-500 ml-3 shrink-0">${fecha}</span>
                            ${botonBorrarHTML}
                        </div>
                        <p class="text-sm text-slate-300 leading-relaxed break-words">${msg.contenido}</p>
                    </div>
                `;
                listaComentarios.appendChild(div);
            });
        }

        cargarArticuloYRelacionados();
        renderizarCajaInput();
        cargarComentarios();

    </script>
</body>
</html>
