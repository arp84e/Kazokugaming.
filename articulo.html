<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo | KazokuGaming</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
        .contenido-articulo p { color: #cbd5e1; line-height: 1.8; font-size: 1.125rem; margin-bottom: 1rem; }
        .contenido-articulo h2 { font-size: 1.8rem; font-weight: bold; color: #fff; margin-top: 2rem; margin-bottom: 1rem; }
        .contenido-articulo h3 { font-size: 1.4rem; font-weight: bold; color: #66C0F4; margin-top: 1.5rem; margin-bottom: 0.8rem; }
        .contenido-articulo ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
        .contenido-articulo strong { color: #ffffff; }
        .contenido-articulo a { color: #66C0F4; text-decoration: underline; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <div id="header-container"></div>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-12 pb-6 w-full" id="contenedor-principal">
        <div class="text-center py-20 text-slate-500 animate-pulse">Desplegando expediente informativo...</div>
    </main>

    <section id="seccion-comentarios" class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pb-16 w-full hidden">
        <div class="pt-8 border-t border-slate-800/80">
            <h3 class="text-2xl font-bold text-white mb-6 flex items-center gap-2"><span class="text-cyan-500">💬</span> Discusión</h3>

            <div id="panel-escribir-comentario" class="bg-slate-900/50 border border-slate-800 rounded-2xl p-5 mb-8 hidden shadow-xl">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm font-bold text-cyan-400 flex items-center gap-2" id="usuario-activo-nombre"></span>
                    <button onclick="cerrarSesion()" class="text-xs font-bold text-red-400 hover:text-red-300 transition px-3 py-1 rounded bg-red-500/10 border border-red-500/20">Desconectar</button>
                </div>
                <textarea id="inputComentario" rows="3" placeholder="Aporta tu opinión..." class="w-full bg-slate-950 border border-slate-700 text-sm rounded-lg px-4 py-3 focus:border-cyan-500 outline-none text-white resize-none"></textarea>
                <div class="flex justify-end mt-3">
                    <button onclick="enviarComentario()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold py-2 px-6 rounded-lg transition">Publicar</button>
                </div>
            </div>

            <div id="alerta-registro" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center mb-8 hidden">
                <p class="text-slate-400 mb-3">Debes estar identificado para unirte a la discusión.</p>
                <a href="../index.html#terminal-acceso" class="inline-block bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-6 rounded-lg transition">Ir al Portal de Acceso</a>
            </div>

            <div id="lista-comentarios" class="space-y-4"></div>
        </div>
    </section>

    <footer class="border-t border-slate-900 bg-slate-950 py-8 mt-auto text-center text-slate-600 text-sm">&copy; 2026 KAZOKUGAMING.</footer>

    <script src="../header.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idActual = urlParams.get('id');

        // LÓGICA DE CONTENIDO
        document.addEventListener('DOMContentLoaded', () => {
            const contenedor = document.getElementById('contenedor-principal');
            if (!idActual) return contenedor.innerHTML = '<div class="text-center py-20 text-red-500">Error: Artículo no especificado.</div>';

            fetch('../articulos.json').then(res => res.json()).then(data => {
                const articulo = data.articulos.find(a => a.id === idActual);
                if (articulo) {
                    document.title = `${articulo.titulo} | KazokuGaming`;
                    const tagsHTML = articulo.tags.map(tag => `<span class="px-3 py-1 bg-slate-800 text-slate-300 text-[10px] uppercase font-semibold rounded-full border border-slate-700">${tag}</span>`).join('');
                    const contenidoLimpio = DOMPurify.sanitize(articulo.contenido);

                    contenedor.innerHTML = `
                        <article class="animate-fade-in-up">
                            <div class="mb-8 text-center">
                                <span class="text-[10px] font-black tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">${articulo.categoria}</span>
                                <h1 class="text-3xl md:text-5xl font-extrabold text-white mt-6 mb-4 tracking-tight leading-tight">${articulo.titulo}</h1>
                                <p class="text-sm text-slate-400">${articulo.fecha} • ⏱️ ${articulo.tiempo_lectura}</p>
                            </div>
                            <div class="w-full aspect-video rounded-2xl overflow-hidden mb-10 border border-slate-800 shadow-2xl relative">
                               <img src="${articulo.imagen}" class="w-full h-full object-cover">
                               <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-transparent"></div>
                            </div>
                            <div class="contenido-articulo max-w-3xl mx-auto">${contenidoLimpio}</div>
                            <div class="mt-8 mb-4 flex flex-wrap justify-center gap-2">${tagsHTML}</div>
                        </article>
                    `;
                    // Mostrar sección de comentarios una vez cargado el post
                    document.getElementById('seccion-comentarios').classList.remove('hidden');
                    initSupabase();
                } else {
                    contenedor.innerHTML = '<div class="text-center py-20 text-slate-400">El artículo no existe.</div>';
                }
            }).catch(() => contenedor.innerHTML = '<div class="text-center py-20 text-red-500">Error de conexión.</div>');
        });

        // LÓGICA DE COMENTARIOS BLINDADA
        const supabase = window.supabase.createClient('https://TU_PROYECTO.supabase.co', 'TU_ANON_KEY'); // <-- REEMPLAZAR
        let usuarioActual = null;

        async function initSupabase() {
            const { data: { session } } = await supabase.auth.getSession();
            usuarioActual = session?.user || null;
            
            if(usuarioActual) {
                document.getElementById('panel-escribir-comentario').classList.remove('hidden');
                document.getElementById('usuario-activo-nombre').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ${usuarioActual.user_metadata?.apodo || 'Agente'}`;
            } else {
                document.getElementById('alerta-registro').classList.remove('hidden');
            }
            cargarComentarios();
        }

        async function cerrarSesion() { await supabase.auth.signOut(); window.location.reload(); }

        async function cargarComentarios() {
            const { data: comentarios, error } = await supabase.from('mensajes').select('*').eq('post_id', idActual).order('created_at', { ascending: true });
            const lista = document.getElementById('lista-comentarios');
            lista.innerHTML = '';

            if (error) return lista.innerHTML = '<p class="text-red-400 text-center">Error al cargar discusiones.</p>';
            if (comentarios.length === 0) return lista.innerHTML = '<p class="text-slate-500 text-center py-6">Nadie ha comentado aún. ¡Sé el primero!</p>';

            comentarios.forEach(msg => {
                const fecha = new Date(msg.created_at).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
                const inicial = msg.autor_apodo ? msg.autor_apodo.charAt(0).toUpperCase() : 'U';
                let btnBorrar = (usuarioActual && usuarioActual.id === msg.user_id) ? `<button onclick="borrarComentario('${msg.id}')" class="ml-auto text-[10px] text-red-500 hover:text-red-400 transition">Eliminar</button>` : '';

                // [SEGURIDAD] Bloqueo absoluto de HTML en el contenido del usuario
                const contenidoSeguro = DOMPurify.sanitize(msg.contenido, { ALLOWED_TAGS: [] });

                const div = document.createElement('div');
                div.className = 'bg-slate-900/40 border border-slate-800/60 rounded-xl p-5 flex space-x-4';
                div.innerHTML = `
                    <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold shrink-0 text-sm bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">${inicial}</div>
                    <div class="flex-grow min-w-0">
                        <div class="flex items-center mb-1 w-full"><span class="text-sm font-bold text-white">${msg.autor_apodo}</span><span class="text-[10px] text-slate-500 ml-3 shrink-0">${fecha}</span>${btnBorrar}</div>
                        <p class="text-sm text-slate-300 break-words whitespace-pre-wrap">${contenidoSeguro}</p>
                    </div>
                `;
                lista.appendChild(div);
            });
        }

        async function enviarComentario() {
            const input = document.getElementById('inputComentario');
            const contenido = input.value.trim();
            if(!contenido) return;

            const { error } = await supabase.from('mensajes').insert([{ post_id: idActual, user_id: usuarioActual.id, autor_apodo: usuarioActual.user_metadata?.apodo || 'Agente', contenido: contenido }]);
            if (error) alert("Error: " + error.message);
            else { input.value = ''; cargarComentarios(); }
        }

        async function borrarComentario(id) {
            await supabase.from('mensajes').delete().eq('id', id);
            cargarComentarios();
        }
    </script>
</body>
</html>
