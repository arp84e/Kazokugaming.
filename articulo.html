<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo | KazokuGaming</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
        .contenido-articulo p { color: #cbd5e1; line-height: 1.8; font-size: 1.125rem; margin-bottom: 1rem; }
        .contenido-articulo h2 { font-size: 1.8rem; font-weight: bold; color: #fff; margin-top: 2rem; margin-bottom: 1rem; }
        .contenido-articulo h3 { font-size: 1.4rem; font-weight: bold; color: #66C0F4; margin-top: 1.5rem; margin-bottom: 0.8rem; }
        .contenido-articulo ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
        .contenido-articulo strong { color: #ffffff; }
        .contenido-articulo a { color: #66C0F4; text-decoration: underline; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <div id="header-container"></div>

    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full" id="contenedor-principal">
        <div class="text-center py-20 text-slate-500 animate-pulse font-bold tracking-widest uppercase text-xl">
            Desplegando expediente informativo...
        </div>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-8 text-center text-slate-600 text-sm">&copy; 2026 KAZOKUGAMING.</footer>

    <script src="header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const idActual = new URLSearchParams(window.location.search).get('id');
            const contenedor = document.getElementById('contenedor-principal');

            if (!idActual) {
                contenedor.innerHTML = '<div class="text-center py-12 text-red-500 font-bold">⚠️ Artículo no especificado en la URL.</div>';
                return;
            }

            try {
                const req = await fetch('articulos.json').catch(() => null);
                const data = (req && req.ok) ? await req.json() : { articulos: [] };
                
                const articulo = data.articulos?.find(a => a.id === idActual);
                
                if (!articulo) {
                    contenedor.innerHTML = '<div class="text-center py-20 text-amber-500 font-bold">⚠️ El artículo que buscas no existe o ha sido movido.</div>';
                    return;
                }

                document.title = `${articulo.titulo} | KazokuGaming`;
                
                const tagsHTML = articulo.tags.map(tag => `<span class="px-3 py-1 bg-slate-800 text-slate-300 text-[10px] uppercase font-semibold rounded-full border border-slate-700">${tag}</span>`).join('');
                
                const contenidoLimpio = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(articulo.contenido) : articulo.contenido;

                contenedor.innerHTML = `
                    <article>
                        <div class="mb-8 text-center">
                            <span class="text-[10px] font-black tracking-widest text-indigo-400 uppercase bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20">${articulo.categoria}</span>
                            <h1 class="text-3xl md:text-5xl font-extrabold text-white mt-6 mb-4 tracking-tight leading-tight">${articulo.titulo}</h1>
                            <p class="text-sm text-slate-400">${articulo.fecha} • ⏱️ ${articulo.tiempo_lectura}</p>
                        </div>
                        <div class="w-full aspect-video rounded-2xl overflow-hidden mb-10 border border-slate-800 shadow-2xl relative">
                           <img src="${articulo.imagen}" class="w-full h-full object-cover">
                           <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-transparent"></div>
                        </div>
                        <div class="contenido-articulo max-w-3xl mx-auto">
                            ${contenidoLimpio}
                        </div>
                        <div class="mt-8 mb-4 flex flex-wrap justify-center gap-2">${tagsHTML}</div>
                    </article>
                `;

            } catch (error) {
                console.error(error);
                contenedor.innerHTML = `<div class="text-center py-20 text-red-500 font-bold">⚠️ Error de conexión al cargar la base de datos de artículos.</div>`;
            }
        });
    </script>
</body>
</html>
