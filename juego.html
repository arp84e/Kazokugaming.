<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expediente | KazokuGaming</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <meta name="description" content="Especificaciones de rendimiento e informes de hardware detallados de juegos en PC.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <div id="header-container"></div>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div id="pantalla-juego" class="space-y-8 animate-fade-in-up">
            <div class="text-center py-20 text-slate-500 animate-pulse">Cargando expediente técnico...</div>
        </div>
    </main>

    <script src="../header.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const idJuego = urlParams.get('id');

        if(idJuego) cargarExpediente(idJuego);
        else document.getElementById('pantalla-juego').innerHTML = `<div class="text-center py-12 text-red-400 text-sm">⚠️ ID de juego no especificado.</div>`;
    });

    function cargarExpediente(id) {
        fetch('telemetria.json')
            .then(res => res.json())
            .then(data => {
                const juego = data.juegos.find(j => j.id === id);
                if(juego) {
                    const htmlMinimos = juego.requisitos?.minimos?.map(r => `<li class="flex items-start"><span class="text-cyan-500 mr-2 mt-1">▸</span><span>${r}</span></li>`).join('') || '';
                    const htmlRecomendados = juego.requisitos?.recomendados?.map(r => `<li class="flex items-start"><span class="text-cyan-500 mr-2 mt-1">▸</span><span>${r}</span></li>`).join('') || '';
                    
                    // [SEGURIDAD] Limpieza de reporte inyectado
                    const analisisLimpio = DOMPurify.sanitize(juego.analisis_detallado);

                    document.getElementById('pantalla-juego').innerHTML = `
                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div class="lg:col-span-2 space-y-8">
                                <div>
                                    <span class="text-xs font-black tracking-widest text-slate-500 uppercase">${juego.plataformas}</span>
                                    <h1 class="text-4xl font-extrabold text-white mt-2 mb-4 tracking-tight">${juego.titulo}</h1>
                                    <div class="flex items-center gap-4 text-sm text-slate-400">
                                        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> ${juego.motor_grafico}</span>
                                        <span class="flex items-center gap-1.5 border border-slate-700 bg-slate-800 px-2.5 py-0.5 rounded text-cyan-400 font-mono">${juego.tecnologias}</span>
                                    </div>
                                </div>
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <h3 class="text-xl font-bold text-white mb-4">Reporte Técnico</h3>
                                    <div class="prose prose-invert prose-cyan max-w-none text-slate-300">
                                        ${analisisLimpio}
                                    </div>
                                </div>
                            </div>
                            <div class="space-y-6">
                                <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 relative overflow-hidden">
                                    <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/5 rounded-full blur-3xl"></div>
                                    <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-cyan-900/40 relative z-10">
                                        <div class="w-10 h-10 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold">MIN</div>
                                        <h3 class="text-lg font-bold text-cyan-100">Requisitos Mínimos</h3>
                                    </div>
                                    <ul class="space-y-4 text-sm text-slate-300 relative z-10">${htmlMinimos || '<li class="text-slate-600">No disponibles.</li>'}</ul>
                                </div>
                                <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6 relative overflow-hidden">
                                    <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/5 rounded-full blur-3xl"></div>
                                    <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-cyan-900/40 relative z-10">
                                        <div class="w-10 h-10 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold">REC</div>
                                        <h3 class="text-lg font-bold text-cyan-100">Requisitos Recomendados</h3>
                                    </div>
                                    <ul class="space-y-4 text-sm text-slate-300 relative z-10">${htmlRecomendados || '<li class="text-slate-600">No disponibles.</li>'}</ul>
                                </div>
                            </div>
                        </div>
                    `;
                    document.title = `${juego.titulo} | Análisis Técnico`;
                } else {
                    document.getElementById('pantalla-juego').innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">⚠️ El expediente de telemetría solicitado no existe.</div>`;
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('pantalla-juego').innerHTML = `<div class="text-center py-12 text-red-400 text-sm">⚠️ Error de conexión.</div>`;
            });
    }
    </script>
</body>
</html>
