<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expediente | KazokuGaming</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">

    <meta name="description" content="Especificaciones de rendimiento e informes de hardware detallados de juegos en PC.">
    <meta property="og:type" content="article">
    <meta name="twitter:card" content="summary_large_image">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
    </style>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div id="pantalla-juego" class="space-y-8">
            <p class="text-slate-500 text-sm animate-pulse text-center py-12">Accediendo a los servidores de telemetría...</p>
        </div>
    </main>

    <footer class="border-t border-slate-950 bg-slate-950/60 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 KazokuGaming. Todos los derechos reservados.</p>
    </footer>

    <script src="header.js"></script>
    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const idBuscado = urlParams.get('id');

    if (!idBuscado) {
        document.getElementById('pantalla-juego').innerHTML = `<div class="text-center py-12 text-slate-400">⚠️ No se especificó ningún expediente.</div>`;
    } else {
        fetch('telemetria.json')
            .then(res => res.json())
            .then(data => {
                const juego = data.juegos.find(j => j.id === idBuscado);
                
                if (juego) {
                    const reqMin = juego.requisitos?.minimos || [];
                    const reqRec = juego.requisitos?.recomendados || [];
                    
                    let htmlMinimos = reqMin.map(r => `<li class="flex items-start space-x-2"><span class="text-cyan-500 mt-0.5 text-xs">▸</span><span>${r}</span></li>`).join('');
                    let htmlRecomendados = reqRec.map(r => `<li class="flex items-start space-x-2"><span class="text-cyan-500 mt-0.5 text-xs">▸</span><span>${r}</span></li>`).join('');

                    document.getElementById('pantalla-juego').innerHTML = `
                        <div class="lg:flex lg:space-x-10 mb-12">
                            <div class="lg:w-1/3 mb-8 lg:mb-0">
                                <div class="rounded-2xl overflow-hidden shadow-2xl border border-slate-800/80 sticky top-24 relative">
                                    <img src="${juego.imagen || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800'}" alt="${juego.titulo}" class="w-full h-auto object-cover aspect-[3/4]">
                                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                                </div>
                            </div>
                            
                            <div class="lg:w-2/3 flex flex-col justify-center">
                                <div class="flex items-center space-x-3 mb-4">
                                    <span class="px-3 py-1 rounded-full text-xs font-bold bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 uppercase tracking-wider">${juego.fecha}</span>
                                    <span class="px-3 py-1 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700 uppercase tracking-wider">Telemetría Completa</span>
                                </div>
                                
                                <div class="flex items-start justify-between mb-2">
                                    <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight pr-4">${juego.titulo}</h1>
                                    <div class="relative flex flex-col items-center justify-center w-20 h-20 min-w-[5rem] bg-slate-900 border-2 border-cyan-500/80 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.3)] transform hover:scale-105 transition-transform duration-300">
                                        <div class="absolute -top-3.5 bg-gradient-to-r from-cyan-400 to-indigo-500 text-white text-[12px] font-black px-3 py-1 rounded-md shadow-lg border border-cyan-300/30 flex items-center justify-center">
                                            <span>家族</span>
                                        </div>
                                        <span class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-cyan-200 mt-2">${juego.calificacion || '-'}</span>
                                        <span class="text-[9px] text-cyan-500 font-bold uppercase tracking-widest mt-0.5">Score</span>
                                    </div>
                                </div>
                                <p class="text-sm font-bold text-slate-400 tracking-wide uppercase mb-6 mt-2">${juego.plataformas}</p>
                                
                                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                                    <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4">
                                        <p class="text-[10px] text-slate-500 uppercase font-bold mb-1">Motor Gráfico</p>
                                        <p class="text-sm font-semibold text-cyan-400">${juego.motor_grafico || 'No especificado'}</p>
                                    </div>
                                    <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4">
                                        <p class="text-[10px] text-slate-500 uppercase font-bold mb-1">Tecnologías</p>
                                        <p class="text-sm font-semibold text-white">${juego.tecnologias || 'Estándar'}</p>
                                    </div>
                                    <div class="bg-slate-900/50 border border-slate-800 rounded-xl p-4 col-span-2 md:col-span-1">
                                        <p class="text-[10px] text-slate-500 uppercase font-bold mb-1">Rendimiento</p>
                                        <p class="text-sm font-semibold text-white">${juego.rendimiento || 'Variable'}</p>
                                    </div>
                                </div>
                                <div class="bg-slate-900/30 border border-slate-800/50 rounded-2xl p-6 md:p-8 mb-8 prose prose-invert max-w-none">
                                    <h3 class="text-xl font-bold text-white mb-4 flex items-center"><span class="text-cyan-500 mr-2">⚡</span> Análisis Técnico Profundo</h3>
                                    <div class="text-slate-300 leading-relaxed">${juego.analisis_detallado}</div>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-900/40 border border-slate-800/80 rounded-3xl p-8 lg:p-12 shadow-xl">
                            <div class="text-center mb-10">
                                <h2 class="text-2xl lg:text-3xl font-extrabold text-white">Requisitos del Sistema en PC</h2>
                                <p class="text-slate-400 mt-2 text-sm">Especificaciones necesarias para una experiencia óptima.</p>
                            </div>
                            <div class="grid md:grid-cols-2 gap-8 lg:gap-12">
                                <div class="bg-slate-950/50 rounded-2xl p-6 border border-slate-800/50 hover:border-cyan-500/30 transition-colors">
                                    <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-slate-800/60">
                                        <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 font-bold">MIN</div>
                                        <h3 class="text-lg font-bold text-slate-200">Requisitos Mínimos</h3>
                                    </div>
                                    <ul class="space-y-4 text-sm text-slate-400">${htmlMinimos || '<li class="text-slate-600">No disponibles.</li>'}</ul>
                                </div>
                                <div class="bg-cyan-950/10 rounded-2xl p-6 border border-cyan-900/30 hover:border-cyan-500/50 transition-colors relative overflow-hidden">
                                    <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/5 rounded-full blur-3xl"></div>
                                    <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-cyan-900/40 relative z-10">
                                        <div class="w-10 h-10 rounded-full bg-cyan-500/20 text-cyan-400 flex items-center justify-center font-bold">REC</div>
                                        <h3 class="text-lg font-bold text-cyan-100">Requisitos Recomendados</h3>
                                    </div>
                                    <ul class="space-y-4 text-sm text-slate-300 relative z-10">${htmlRecomendados || '<li class="text-slate-600">No disponibles.</li>'}</ul>
                                </div>
                            </div>
                        </div>
                    `;
                    document.title = `${juego.titulo} | Análisis Técnico`;
                } else {
                    document.getElementById('pantalla-juego').innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">⚠️ El expediente de telemetría solicitado no existe.</div>`;
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('pantalla-juego').innerHTML = `<div class="text-center py-12 text-red-400 text-sm">⚠️ Error de conexión a la base de datos.</div>`;
            });
    }
    </script>
</body>
</html>
