<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expediente | KazokuGaming</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #03040b; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <div id="header-container"></div>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full" id="pantalla-juego">
        <div class="text-center py-20 text-slate-500 animate-pulse font-bold tracking-widest uppercase text-xl">
            Cargando expediente de la base de datos...
        </div>
    </main>

    <footer class="border-t border-slate-900 bg-[#010205] py-8 text-center text-slate-600 text-sm">&copy; 2026 KAZOKUGAMING.</footer>

    <script src="header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const idActual = new URLSearchParams(window.location.search).get('id');
            const pantalla = document.getElementById('pantalla-juego');

            if(!idActual) return pantalla.innerHTML = `<div class="text-center py-12 text-red-400 font-bold">⚠️ ID de juego no especificado.</div>`;

            try {
                // Ahora lee del nuevo archivo de JUEGOS GLOBALES
                const reqTel = await fetch('juegos.json').catch(() => null);
                const reqGui = await fetch('guias.json').catch(() => null);
                
                const dataJuegos = (reqTel && reqTel.ok) ? await reqTel.json() : { juegos: [] };
                const dataGuias = (reqGui && reqGui.ok) ? await reqGui.json() : { guias: [] };

                const juego = dataJuegos.juegos?.find(j => j.id === idActual);
                
                if(!juego) return pantalla.innerHTML = `<div class="text-center py-12 text-violet-500 font-bold">⚠️ El expediente no existe en el directorio de juegos.</div>`;

                document.title = `${juego.titulo} | Expediente de Juego`;

                const guiaRelacionada = dataGuias.guias?.find(g => g.slug === idActual || g.id === `guia-${idActual}`);
                let htmlBannerGuia = guiaRelacionada ? `
                    <div class="mt-8 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl p-6 flex flex-col sm:flex-row items-center justify-between gap-6 shadow-[0_0_20px_rgba(16,185,129,0.15)]">
                        <div class="text-center sm:text-left">
                            <span class="text-[10px] font-black tracking-widest text-emerald-400 uppercase bg-emerald-950/50 px-2 py-0.5 rounded border border-emerald-500/20 mb-2 inline-block">INTELIGENCIA DESBLOQUEADA</span>
                            <h4 class="text-xl font-bold text-white mb-1">Dossier Táctico Disponible</h4>
                        </div>
                        <a href="guia.html?id=${guiaRelacionada.id}" class="w-full sm:w-auto text-center bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 text-white font-extrabold py-3 px-8 rounded-xl transition shadow-lg shrink-0">Leer Guía →</a>
                    </div>` : '';

                const reqMin = juego.requisitos?.minimos?.map(r => `<li class="flex items-start"><span class="text-violet-500 mr-2 mt-1 font-bold">▸</span><span>${r}</span></li>`).join('') || '';
                const reqRec = juego.requisitos?.recomendados?.map(r => `<li class="flex items-start"><span class="text-violet-500 mr-2 mt-1 font-bold">▸</span><span>${r}</span></li>`).join('') || '';
                
                const analisisLimpio = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(juego.analisis_detallado) : juego.analisis_detallado;

                pantalla.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 space-y-8">
                            <div>
                                <span class="text-xs font-black tracking-widest text-slate-500 uppercase">${juego.plataformas}</span>
                                <h1 class="text-4xl md:text-5xl font-extrabold text-white mt-2 mb-4 tracking-tight">${juego.titulo}</h1>
                                <div class="flex flex-wrap items-center gap-4 text-sm text-slate-400">
                                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-violet-400 animate-pulse"></span> ${juego.motor_grafico}</span>
                                </div>
                            </div>
                            
                            <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-xl">
                                <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2"><span class="text-violet-500">⚙️</span> Reporte de Rendimiento</h3>
                                <div class="prose prose-invert prose-violet max-w-none text-slate-300 leading-relaxed">${analisisLimpio}</div>
                            </div>
                            ${htmlBannerGuia}
                        </div>
                        
                        <div class="space-y-6">
                            <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 md:p-8 relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-32 h-32 bg-violet-500/5 rounded-full blur-3xl"></div>
                                <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-violet-900/40 relative z-10">
                                    <h3 class="text-lg font-bold text-violet-100">Requisitos Mínimos (o Móvil)</h3>
                                </div>
                                <ul class="space-y-4 text-sm text-slate-300 relative z-10">${reqMin || '<li class="text-slate-600">No disponibles.</li>'}</ul>
                            </div>
                            
                            <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 md:p-8 relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-32 h-32 bg-violet-500/5 rounded-full blur-3xl"></div>
                                <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-violet-900/40 relative z-10">
                                    <h3 class="text-lg font-bold text-violet-100">Requisitos Recomendados</h3>
                                </div>
                                <ul class="space-y-4 text-sm text-slate-300 relative z-10">${reqRec || '<li class="text-slate-600">No disponibles.</li>'}</ul>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                pantalla.innerHTML = `<div class="text-center py-12 text-red-500 font-bold">⚠️ Error crítico.</div>`;
            }
        });
    </script>
</body>
</html>
