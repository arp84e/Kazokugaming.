name: Bot Redactor de Noticias

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta automáticamente (ej. todos los días a las 8:00 AM UTC)
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

permissions:
  contents: write

jobs:
  redactar-noticias:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install google-genai feedparser requests

      - name: Ejecutar KazokuBot (Noticias)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # 👇 AQUÍ ESTÁ LA CORRECCIÓN CLAVE 👇
        run: python scraper_noticias.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          git add noticias.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🗞️ Nueva crónica redactada por IA" && git push)
