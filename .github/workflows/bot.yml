name: Bot Redactor KazokuGaming

on:
  schedule:
    - cron: '0 10,22 * * *' 
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
    - name: 1. Descargar la web
      uses: actions/checkout@v4

    - name: 2. Preparar el servidor Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 3. Instalar herramientas
      # Se añade 'beautifulsoup4' para el correcto funcionamiento del rastreador de hardware
      run: pip install feedparser google-genai requests beautifulsoup4

    - name: 4. Despertar a KazokuBot (Ejecutar IA e Imágenes de Noticias)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }} 
      run: python scraper.py

    - name: 4b. Monitorear Hardware (Precios y Lanzamientos del Mes)
      # Este paso ejecuta de forma independiente el analizador de consolas y laptops
      run: python hardware_tracker.py

    - name: 5. Publicar en la revista (Guardar cambios)
      run: |
        git config --global user.name 'KazokuBot'
        git config --global user.email 'bot@kazokugaming.com'
        git add .
        # Cambiado el mensaje de commit para reflejar de manera profesional que también incluye el hardware
        git commit -m "🤖 KazokuBot: Actualización automática de contenido, imágenes y catálogo de hardware" || echo "No hay cambios nuevos que guardar"
        git push
