name: Bot Redactor KazokuGaming

on:
  schedule:
    - cron: '0 10,22 * * *' 
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
    - name: 1. Descargar la web
      uses: actions/checkout@v4

    - name: 2. Preparar el servidor Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # ¡Actualizado a Python 3.12!

    - name: 3. Instalar herramientas
      run: pip install feedparser google-genai # ¡Actualizado al nuevo paquete de Google!

    - name: 4. Despertar a KazokuBot (Ejecutar IA)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python scraper.py

    - name: 5. Publicar en la revista (Guardar cambios)
      run: |
        git config --global user.name 'KazokuBot'
        git config --global user.email 'bot@kazokugaming.com'
        git add noticias.json
        git commit -m "🤖 Actualización automática de noticias" || echo "No hay noticias nuevas"
        git push
