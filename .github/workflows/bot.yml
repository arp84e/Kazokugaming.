name: Bot Redactor KazokuGaming

on:
  schedule:
    - cron: '0 10,22 * * *' 
  workflow_dispatch: 

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permite al bot guardar y subir los archivos JSON

    steps:
    - name: 1. Descargar la web
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Necesario para evitar conflictos al hacer git pull

    - name: 2. Preparar el servidor Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Versión ultra-estable y compatible para GitHub Actions

    - name: 3. Instalar herramientas
      run: |
        python -m pip install --upgrade pip
        pip install feedparser google-genai requests

    - name: 4. Despertar a KazokuBot (Ejecutar IA e Imágenes)
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
      run: python scraper.py

    - name: 5. Publicar en la revista (Guardar cambios)
      run: |
        git config --global user.name 'KazokuBot'
        git config --global user.email 'bot@kazokugaming.com'
        git add lanzamientos.json noticias.json || true
        
        # Primero guardamos los cambios de la IA
        git commit -m "🤖 Actualización automática de contenido e imágenes" || echo "No hay cambios nuevos que guardar"
        
        # Magia anti-conflictos: El bot descarga tus cambios manuales y los fusiona pacíficamente
        git pull origin main --rebase
        
        # Finalmente, sube todo el paquete a GitHub
        git push
