name: Bot Redactor IA (Artículos)

on:
  workflow_dispatch:
    inputs:
      temas:
        description: '📝 Nuevos Artículos (Separados por ;). Déjalo vacío para Automático.'
        required: false
        type: string
      actualizar:
        description: '🖼️ Arreglar Imágenes (Escribe parte del título, o escribe TODOS)'
        required: false
        type: string
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  redactar-articulos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install google-genai requests

      - name: Ejecutar Bot Redactor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INPUT_TEMAS: ${{ inputs.temas }}
          INPUT_ACTUALIZAR: ${{ inputs.actualizar }}
        run: python redactor_ia.py

      - name: Actualizar Mapa del Sitio XML
        run: python generar_sitemap.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          
          git add articulos.json || true
          git add sitemap.xml || true
          
          if git diff --staged --quiet; then
            echo "No hay cambios en los artículos."
          else
            git commit -m "🤖 KazokuBot: Artículos redactados o imágenes actualizadas"
            git pull --rebase origin main || true
            git push
          fi
