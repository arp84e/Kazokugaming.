name: Bot Redactor (Noticias)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write # ESTO ES VITAL PARA QUE SE GUARDE EL JSON

jobs:
  redactar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install google-genai feedparser requests
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper_noticias.py
      - name: Guardar en GitHub
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          git add noticias.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizando noticias.json" && git push)
