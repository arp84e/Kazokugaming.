# Actualiza noticias.json con las últimas noticias de videojuegos en español
# (Vida Extra y Google Noticias; ver scripts/generar-noticias.mjs).
# Se ejecuta:
#   - cada hora (GitHub a veces se salta ejecuciones programadas),
#   - al momento cada vez que se actualiza scripts/generar-noticias.mjs,
#   - a mano: pestaña "Actions" → "Actualizar noticias" → botón "Run workflow".
name: Actualizar noticias

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generar-noticias.mjs'
  workflow_dispatch:

permissions:
  contents: write          # necesario para guardar noticias.json en el repositorio

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Generar noticias.json
        run: node scripts/generar-noticias.mjs

      - name: Guardar noticias.json si cambió
        run: |
          git add noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las noticias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar noticias"
          git push
