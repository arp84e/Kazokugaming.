# Actualiza noticias.json cada hora con las últimas noticias de Xataka, IGN y
# Google Noticias (ver scripts/generar-noticias.mjs). Sustituye a rss2json.com.
name: Actualizar noticias

on:
  schedule:
    - cron: '17 * * * *'   # cada hora, en el minuto 17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Generar noticias.json
        run: node scripts/generar-noticias.mjs

      - name: Guardar noticias.json si cambió
        run: |
          git add noticias.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las noticias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar noticias"
          git push
