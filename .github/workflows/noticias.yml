name: Bot Redactor (Noticias)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redactar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install google-genai feedparser requests beautifulsoup4
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper_noticias.py
      - name: Commit y Push
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          git add noticias.json
          
          # Comprueba si hay cambios antes de hacer commit
          if git diff --staged --quiet; then
            echo "No hay cambios en noticias.json para guardar."
          else
            git commit -m "🤖 Actualizando noticias.json"
            git push
          fi

      # 🚀 ESTE ES EL NUEVO PASO QUE AÑADIMOS
      - name: Tocar el timbre de Vercel (Desplegar)
        if: success()
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
