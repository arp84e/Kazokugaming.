name: Bot Analista (Hardware)

on:
  workflow_dispatch:
    inputs:
      nombre_dispositivo:
        description: '💻 Nombre o Modelo del Dispositivo (Obligatorio)'
        required: true
        type: string
      categoria:
        description: '🏷️ ¿Qué tipo de dispositivo es?'
        required: true
        type: choice
        options:
          - accessory
          - laptop
          - handheld
          - console
      analisis_previo:
        description: '📝 Tus notas o análisis previo (Opcional - La IA lo mejorará)'
        required: false
        type: string
      pros_contras_previos:
        description: '⚖️ Pros y Contras que notaste (Opcional - Separados por comas)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  analizar_y_publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Instalar librerías
        # Instalamos duckduckgo-search para buscar imágenes sin copyright gratis
        run: pip install google-genai requests duckduckgo-search
        
      - name: Ejecutar Bot de Hardware
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Pasamos lo que escribiste en las cajitas al script de Python
          INPUT_NOMBRE: ${{ github.event.inputs.nombre_dispositivo }}
          INPUT_CATEGORIA: ${{ github.event.inputs.categoria }}
          INPUT_ANALISIS: ${{ github.event.inputs.analisis_previo }}
          INPUT_PROS_CONTRAS: ${{ github.event.inputs.pros_contras_previos }}
        run: python bot_hardware.py
        
      - name: Guardar en la Base de Datos (hardware.json)
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          git add hardware.json
          
          if git diff --staged --quiet; then
            echo "No hubo cambios para guardar."
          else
            git commit -m "🤖 Nuevo análisis de hardware añadido"
            git push
          fi

      - name: Desplegar en Vercel
        if: success()
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
