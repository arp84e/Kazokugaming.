name: Bot Telemetría (Manual)

on:
  workflow_dispatch:
    inputs:
      juegos:
        description: 'Juegos a analizar (uno por línea)'
        required: true
        type: string
      sobrescribir:
        description: '¿Borrar catálogo anterior?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      # 👇 Agregamos requests aquí
      - run: pip install google-genai requests
      - name: Ejecutar Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }} # 👈 Agregamos tu llave de RAWG aquí
          NUEVOS_JUEGOS: ${{ inputs.juegos }}
          SOBRESCRIBIR: ${{ inputs.sobrescribir }}
        run: python scraper_telemetria.py
