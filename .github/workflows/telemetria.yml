name: Bot Telemetría (Manual)

on:
  workflow_dispatch:
    inputs:
      juegos:
        description: 'Juegos a analizar (uno por línea)'
        required: true
        type: string
      sobrescribir:
        description: '¿Borrar catálogo anterior?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ... (resto de pasos)
      - name: Ejecutar Bot
        working-directory: .
        run: python scraper_telemetria.py
