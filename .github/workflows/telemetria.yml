name: Bot Telemetría (Manual)

on:
  workflow_dispatch:
    inputs:
      juegos:
        description: 'Juegos a analizar (uno por línea)'
        required: true
        type: string
      sobrescribir:
        description: '¿Borrar catálogo anterior?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install google-genai
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NUEVOS_JUEGOS: ${{ inputs.juegos }}
          SOBRESCRIBIR: ${{ inputs.sobrescribir }}
        run: python scraper_telemetria.py
      - name: Guardar en GitHub
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          git add telemetria.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizando telemetria.json" && git push)
