name: Bot Telemetría (Manual Avanzado)

on:
  workflow_dispatch:
    inputs:
      juegos:
        description: '🎮 Título(s) del o los juegos (separados por ; si son varios)'
        required: true
        type: string
      calificacion:
        description: '⭐ Calificación (Solo para el primer juego. Ej: 9.2)'
        required: false
        type: string
        default: ''
      plataformas:
        description: '🖥️ Plataformas (Solo para el primer juego. Ej: PC, PS5, Xbox Series X)'
        required: false
        type: string
        default: ''
      requisitos:
        description: '📋 Requisitos en bruto (Solo para el primer juego)'
        required: false
        type: string
        default: ''
      analisis:
        description: '✍️ Análisis base para reescribir anti-copyright (Solo para el primer juego)'
        required: false
        type: string
        default: ''
      sobrescribir:
        description: '⚠️ ¿Borrar catálogo anterior de Telemetría?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  analizar-telemetria:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install google-genai requests

      - name: Ejecutar Bot de Telemetría Multi-Cuadro
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          INPUT_JUEGOS: ${{ inputs.juegos }}
          INPUT_CALIFICACION: ${{ inputs.calificacion }}
          INPUT_PLATAFORMAS: ${{ inputs.plataformas }}
          INPUT_REQUISITOS: ${{ inputs.requisitos }}
          INPUT_ANALISIS: ${{ inputs.analisis }}
          SOBRESCRIBIR: ${{ inputs.sobrescribir }}
        run: python scraper_telemetria.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          git add telemetria.json
          if git diff --staged --quiet; then
            echo "Sin cambios en telemetria.json."
          else
            git commit -m "🤖 Telemetría Avanzada: Expedientes actualizados"
            git push
          fi
