name: Bot Telemetría (Hardware y Rendimiento)

on:
  workflow_dispatch:
    inputs:
      juegos:
        description: '🎮 (Opcional) Juego manual. Deja vacío para Modo Automático (3 juegos de PC tendencia).'
        required: false
        type: string
      sobrescribir:
        description: '⚠️ ¿Borrar catálogo anterior de Telemetría?'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 14 * * *' # Se ejecuta a las 14:00 UTC automáticamente

permissions:
  contents: write

jobs:
  analizar-telemetria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias seguras
        run: pip install google-genai==0.3.0 requests==2.31.0

      - name: Ejecutar Bot de Telemetría
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          INPUT_JUEGOS: ${{ inputs.juegos }}
          SOBRESCRIBIR: ${{ inputs.sobrescribir }}
        run: python scraper_telemetria.py

      - name: Actualizar Mapa del Sitio XML
        run: python generar_sitemap.py

      - name: Commit y Push
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          
          git add telemetria.json || true
          git add telemetria/ || true
          git add sitemap.xml || true
          
          if git diff --staged --quiet; then
            echo "No hay variaciones de telemetría."
          else
            git commit -m "🤖 Bot Telemetría: Análisis actualizado (Modo Automático/Manual)."
            git pull --rebase origin main || true
            git push origin main
          fi
