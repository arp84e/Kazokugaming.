name: Bot Juegos y Top 10 Global

on:
  workflow_dispatch:
    inputs:
      comandos:
        description: 'COMANDO: "top" | Número (ej. "5") | Nombres (ej. "Juego 1; Juego 2")'
        required: false
        type: string
        default: 'top'
      sobrescribir:
        description: '⚠️ ¿Forzar sobrescritura si el juego ya existe?'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  actualizar-juegos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install google-genai requests

      - name: Ejecutar Bot de Juegos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          INPUT_COMANDOS: ${{ inputs.comandos }}
          SOBRESCRIBIR: ${{ inputs.sobrescribir }}
        run: python scraper_juegos.py

      - name: Actualizar Mapa del Sitio XML
        run: python generar_sitemap.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          
          git add juegos.json || true
          git add sitemap.xml || true
          
          if git diff --staged --quiet; then
            echo "No hay variaciones en el catálogo de juegos hoy."
          else
            git commit -m "🤖 KazokuBot: Base de Juegos actualizada"
            git push
          fi
