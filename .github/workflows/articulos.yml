name: Bot Redactor de Artículos Pro

on:
  workflow_dispatch:
    inputs:
      accion:
        description: '🚀 ¿Qué deseas hacer?'
        required: true
        type: choice
        default: '1_generar_borrador'
        options:
          - '1_generar_borrador'
          - '2_publicar_borrador'
      tema_articulo:
        description: '📝 Tema o Título conceptual del Artículo'
        required: false
        type: string
      categoria:
        description: '🏷️ Categoría del Artículo'
        required: false
        type: choice
        default: 'Tecnología'
        options:
          - 'Tecnología'
          - 'Videojuegos'
          - 'Análisis'
          - 'Guías y Tutoriales'
      enlaces_oficiales:
        description: '🔗 Enlaces Oficiales (Opcional - Sepáralos por comas)'
        required: false
        type: string
      imagen_elegida:
        description: '🖼️ Si vas a PUBLICAR, ¿qué imagen prefieres? (1, 2, 3 o Todas)'
        required: false
        type: choice
        default: '1'
        options:
          - '1'
          - '2'
          - '3'
          - 'Todas'

permissions:
  contents: write

jobs:
  procesar_articulo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar dependencias
        run: pip install google-genai requests duckduckgo-search beautifulsoup4
        
      - name: Ejecutar el motor del Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_ACCION: ${{ github.event.inputs.accion }}
          INPUT_TEMA: ${{ github.event.inputs.tema_articulo }}
          INPUT_CATEGORIA: ${{ github.event.inputs.categoria }}
          INPUT_ENLACES: ${{ github.event.inputs.enlaces_oficiales }}
          INPUT_IMAGEN_OK: ${{ github.event.inputs.imagen_elegida }}
        run: python bot_articulos.py
        
      - name: Actualizar Mapa del Sitio XML
        run: python generar_sitemap.py
        
      - name: Guardar cambios en el repositorio (Git Commit)
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          
          git add articulos_borrador.json || true
          git add articulos.json || true
          git add articulos/ || true
          git add sitemap.xml || true
          
          if git diff --staged --quiet; then
            echo "Sin cambios detectados en los archivos."
          else
            git commit -m "🤖 Bot Artículos: Actualización estructural y sitemap con soporte multi-imagen"
            git pull --rebase origin main || true
            git push
          fi
