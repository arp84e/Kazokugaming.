name: Bot Redactor de Artículos Pro

on:
  workflow_dispatch:
    inputs:
      accion:
        description: '🚀 ¿Qué deseas hacer?'
        required: true
        type: choice
        default: '1_generar_borrador'
        options:
          - '1_generar_borrador'
          - '2_publicar_borrador'
          - '3_eliminar_articulo'
      tema_articulo:
        description: '📝 Tema o Título (Usar en Acción 1)'
        required: false
        type: string
      categoria:
        description: '🏷️ Categoría del Artículo'
        required: false
        type: choice
        default: 'Tecnología'
        options:
          - 'Tecnología'
          - 'Videojuegos'
          - 'Análisis'
          - 'Guías y Tutoriales'
      enlaces_oficiales:
        description: '🔗 Enlaces Manuales (Sepáralos por comas)'
        required: false
        type: string
      url_imagen_manual:
        description: '🖼️ URL de imagen base (Úsala tal cual, o como base para modificarla con IA)'
        required: false
        type: string
      prompt_nano_banana:
        description: '🍌 Prompt Nano Banana (Ej: "Haz que la imagen base sea estilo cyberpunk")'
        required: false
        type: string
      palabras_clave_imagenes:
        description: '🔑 Palabras clave extra para galería (Opcional)'
        required: false
        type: string
      imagen_elegida:
        description: '🖼️ Al PUBLICAR (Acción 2), escribe los números (ej: 1,3,4) o "Todas"'
        required: false
        type: string
        default: '1'
      id_articulo_borrar:
        description: '🗑️ Al ELIMINAR (Acción 3), escribe el título exacto o el ID'
        required: false
        type: string

permissions:
  contents: write

jobs:
  procesar_articulo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalar dependencias
        run: pip install google-genai requests ddgs beautifulsoup4 urllib3
        
      - name: Ejecutar el motor del Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_ACCION: ${{ github.event.inputs.accion }}
          INPUT_TEMA: ${{ github.event.inputs.tema_articulo }}
          INPUT_CATEGORIA: ${{ github.event.inputs.categoria }}
          INPUT_ENLACES: ${{ github.event.inputs.enlaces_oficiales }}
          INPUT_URL_IMAGEN_MANUAL: ${{ github.event.inputs.url_imagen_manual }}
          INPUT_PROMPT_NANO_BANANA: ${{ github.event.inputs.prompt_nano_banana }}
          INPUT_PALABRAS_CLAVE_IMAGENES: ${{ github.event.inputs.palabras_clave_imagenes }}
          INPUT_IMAGEN_OK: ${{ github.event.inputs.imagen_elegida }}
          INPUT_ID_BORRAR: ${{ github.event.inputs.id_articulo_borrar }}
        run: python bot_articulos.py
        
      - name: Actualizar Mapa del Sitio XML
        run: python generar_sitemap.py
        
      - name: Guardar cambios en el repositorio (Git Commit)
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          
          git add articulos_borrador.json || true
          git add articulos.json || true
          git add articulos/ || true
          git add sitemap.xml || true
          
          if git diff --staged --quiet && git diff --cached --quiet; then
            echo "Sin cambios detectados en los archivos."
          else
            git commit -m "🤖 Bot Artículos: Acción [${{ github.event.inputs.accion }}] ejecutada con éxito"
            git pull --rebase origin main || true
            git push
          fi
