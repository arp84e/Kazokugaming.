name: Bot Hardware y Tecnología

on:
  workflow_dispatch:
    inputs:
      productos:
        description: '💻 Productos (ej. "RTX 4090; Logitech G Pro"). Vacío = 3 Tendencias'
        required: false
        type: string
      links:
        description: '🔗 Links de afiliado (opcional, separados por ;)'
        required: false
        type: string
  schedule:
    - cron: '0 12 * * *' # Se ejecuta a diario

permissions:
  contents: write

jobs:
  analizar-tecnologia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install google-genai requests

      - name: Ejecutar Bot de Tecnología
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          INPUT_PRODUCTOS: ${{ inputs.productos }}
          INPUT_LINKS: ${{ inputs.links }}
        run: python scraper_tecnologia.py

      - name: Actualizar Mapa del Sitio XML
        run: python generar_sitemap.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          
          git add tecnologia.json || true
          git add sitemap.xml || true
          
          if git diff --staged --quiet; then
            echo "No hay variaciones en el catálogo de tecnología hoy."
          else
            git commit -m "🤖 KazokuBot: Hardware y Tecnología actualizados"
            git push
          fi
