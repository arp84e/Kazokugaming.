name: Bot Guías Tácticas Automáticas

on:
  workflow_dispatch:
    inputs:
      comandos:
        description: 'COMANDOS: "top" | "3" | "Halo" | "eliminar:id-guia"'
        required: false
        type: string
        default: 'top'
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: write

jobs:
  redactar-guias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install google-genai requests

      - name: Ejecutar Bot de Guías
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
          INPUT_COMANDOS: ${{ inputs.comandos }}
        run: python scraper_guias.py

      - name: Actualizar Mapa del Sitio XML
        run: python generar_sitemap.py

      - name: Commit y Push de los cambios
        run: |
          git config --global user.name "KazokuBot"
          git config --global user.email "bot@kazokugaming.com"
          
          git add guias.json || true
          git add sitemap.xml || true
          
          if git diff --staged --quiet; then
            echo "No hay variaciones en el catálogo de guías."
          else
            git commit -m "🤖 KazokuBot: Guías tácticas actualizadas/modificadas"
            git push
          fi
