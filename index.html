<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazokuGaming | Artículos y Análisis</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">
    <div id="header-container"></div>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center mb-16">
            <span class="text-xs font-bold tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-4 py-1.5 rounded-full border border-cyan-500/20">Portal de Noticias</span>
            <h1 class="text-4xl font-extrabold text-white sm:text-6xl mt-6 mb-4 tracking-tight">Artículos y Análisis Pro</h1>
            <p class="text-slate-400 max-w-xl mx-auto">Información objetiva del ecosistema gaming redactada mediante inteligencia artificial avanzada.</p>
        </div>

        <div id="grid-articulos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="text-center col-span-full text-slate-500 py-12">Sincronizando feed de noticias...</p>
        </div>
    </main>
    <script src="header.js"></script>
    <script>
        fetch('articulos.json')
            .then(res => res.json())
            .then(data => {
                const articulos = Array.isArray(data) ? data : (data.articulos || []);
                document.getElementById('grid-articulos').innerHTML = articulos.map(a => {
                    const idLimpio = a.id.replace('art-', '');
                    return `
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden hover:border-cyan-500/30 transition shadow-xl flex flex-col h-full group">
                        <div class="relative overflow-hidden aspect-[16/10]">
                            <img src="${a.imagen}" class="w-full h-full object-cover group-hover:scale-103 transition duration-500">
                            <span class="absolute bottom-4 left-4 text-[9px] font-black text-cyan-400 uppercase tracking-widest bg-slate-950/80 px-2.5 py-1 rounded border border-slate-800">${a.categoria}</span>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <h3 class="text-xl font-extrabold text-white mb-2 line-clamp-2 leading-snug">${a.titulo}</h3>
                            <p class="text-sm text-slate-400 line-clamp-3 mb-6 flex-grow">${a.resumen}</p>
                            <a href="articulos/${idLimpio}.html" class="w-full bg-slate-800 hover:bg-cyan-600 hover:text-slate-950 text-cyan-400 font-bold py-3 rounded-xl transition text-center border border-slate-700/80 hover:border-cyan-500">Leer Artículo</a>
                        </div>
                    </div>`
                }).join('');
            });
    </script>
</body>
</html>
