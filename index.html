<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazokuGaming | Portal Automatizado de Videojuegos</title>
    
    <style>
        /* 1. RESETEO UNIVERSAL Y ESTILOS BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d11; /* Fondo oscuro profundo */
            color: #ffffff;
            overflow-x: hidden;
        }

        /* 2. DISEÑO DEL HEADER CENTRADO */
        .header {
            background-color: #141419;
            padding: 20px 10px; 
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 15px;              
            border-bottom: 3px solid #00f0ff; /* Azul Cian brillante */
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 450px; 
            padding: 0 10px;
        }

        .logo-img {
            width: 100%;      
            height: auto;     
            max-height: 140px; 
            object-fit: contain;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 30px; 
            flex-wrap: wrap; 
            justify-content: center;
        }

        .nav-menu a {
            color: #a1a1aa; 
            text-decoration: none;
            font-size: 14px; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            padding: 5px 10px; 
        }

        .nav-menu a:hover {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* CONTENEDOR PRINCIPAL */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-left: 4px solid #ff0055; /* Detalle rosa neón */
            padding-left: 10px;
            color: #ffffff;
        }

        #noticia-destacada {
            margin-bottom: 40px;
        }

        .magazine-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .card, .hero-section {
            background-color: #141419;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #27272a;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .hero-section { display: block; }

        .hero-banner {
            width: 100%;
            height: 450px;
            display: flex;
            align-items: flex-end;
            padding: 40px;
            background-size: cover;
            background-position: center;
        }

        .card:hover { border-color: #ff0055; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.1); transform: translateY(-5px); }
        .hero-section:hover { border-color: #00f0ff; transform: translateY(-5px); }

        .card-img-holder { width: 100%; height: 200px; background-size: cover; background-position: center; }
        .card-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-badge, .hero-badge { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #00f0ff; margin-bottom: 10px; letter-spacing: 1px; background: none; padding: 0; }
        .hero-badge { background-color: #ff0055; color: #fff; padding: 5px 10px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; line-height: 1.4; }
        .hero-title { font-size: 32px; font-weight: 800; line-height: 1.2; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .card-text { color: #a1a1aa; font-size: 14px; line-height: 1.5; }
        .hero-excerpt { color: #d4d4d8; font-size: 16px; max-width: 800px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

        /* RESPONSIVO */
        @media (max-width: 600px) {
            .logo-container { max-width: 280px; }
            .nav-menu a { font-size: 11px; padding: 6px 8px; }
            .hero-banner { height: 300px; padding: 20px; }
            .hero-title { font-size: 20px; }
            .hero-excerpt { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
            .magazine-grid { grid-template-columns: 1fr; gap: 20px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo-container">
            <!-- Apunta exactamente al nombre del logotipo en tu misma carpeta -->
            <img src="1779650326105.png" alt="KazokuGaming Logo" class="logo-img">
        </div>
        <nav>
            <ul class="nav-menu">
                <li><a href="#">Noticias</a></li>
                <li><a href="#">Lanzamientos</a></li>
                <li><a href="#">Consolas</a></li>
                <li><a href="#">Ofertas</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <h2 class="section-title">Destacado</h2>
        <div id="noticia-destacada"></div>

        <h2 class="section-title">Últimas Novedades y Ofertas</h2>
        <section class="magazine-grid" id="bloque-noticias"></section>
    </main>

    <script>
        // Datos de stock ultra estables por si falla el archivo automático
        const backupData = {
            destacada: {
                categoria: "Tendencia",
                titulo: "Próxima Generación de Consolas: Rumores y Hardware en Desarrollo",
                resumen: "Analizamos las filtraciones más recientes de la industria y los títulos que marcarán el futuro del gaming.",
                imagen: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80",
                enlace: "#"
            },
            secundarias: [
                {
                    categoria: "Lanzamientos",
                    titulo: "El RPG más esperado del año confirma su fecha de estreno",
                    resumen: "Los desarrolladores muestran su gameplay definitivo junto a ediciones especiales de colección.",
                    imagen: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=500&q=80",
                    enlace: "#"
                },
                {
                    categoria: "Ofertas",
                    titulo: "Descuentos imperdibles de hasta el 75% esta semana",
                    resumen: "Recopilamos las mejores ofertas y joyas ocultas digitales que no puedes dejar pasar.",
                    imagen: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=500&q=80",
                    enlace: "#"
                }
            ]
        };

        function render(data) {
            const de = data.destacada;
            document.getElementById('noticia-destacada').innerHTML = `
                <a href="${de.enlace}" class="hero-section">
                    <div class="hero-banner" style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(13,13,17,0.95)), url('${de.imagen}');">
                        <div>
                            <span class="hero-badge">${de.categoria}</span>
                            <h1 class="hero-title">${de.titulo}</h1>
                            <p class="hero-excerpt">${de.resumen}</p>
                        </div>
                    </div>
                </a>`;

            let gridHtml = '';
            data.secundarias.forEach(noticia => {
                gridHtml += `
                    <a href="${noticia.enlace}" class="card">
                        <div class="card-img-holder" style="background-image: url('${noticia.imagen}');"></div>
                        <div class="card-content">
                            <span class="card-badge">${noticia.categoria}</span>
                            <h3 class="card-title">${noticia.titulo}</h3>
                            <p class="card-text">${noticia.resumen}</p>
                        </div>
                    </a>`;
            });
            document.getElementById('bloque-noticias').innerHTML = gridHtml;
        }

        // Sistema de control de errores: si no encuentra noticias.json usa el backup integrado
        fetch('noticias.json')
            .then(response => {
                if(!response.ok) throw new Error();
                return response.json();
            })
            .then(data => render(data))
            .catch(() => render(backupData));
    </script>
</body>
</html>
