<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazokuGaming | Revista de Videojuegos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
                KAZOKU<span class="text-slate-100">GAMING</span>
            </a>
            <nav class="flex space-x-6 text-sm font-medium">
                <a href="index.html" class="text-cyan-400 border-b-2 border-cyan-400 px-1 pb-1">Noticias</a>
                <a href="telemetria.html" class="text-slate-400 hover:text-cyan-400 transition">Telemetría</a>
                <a href="radar.html" class="text-slate-400 hover:text-cyan-400 transition">Radar de Ofertas</a>
                <a href="hardware.html" class="text-slate-400 hover:text-cyan-400 transition">Hardware</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center max-w-3xl mx-auto mb-16">
            <span class="text-xs font-bold tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Actualidad Gamer Semanal</span>
            <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl mt-4 mb-4">Últimas Crónicas Gamer</h1>
            <p class="text-lg text-slate-400">La actualidad del videojuego de las últimas 72 horas, optimizada para ti.</p>
        </div>

        <div id="noticiasLoading" class="flex flex-col items-center justify-center py-20 space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-400"></div>
            <p class="text-slate-400 text-sm animate-pulse">Sintonizando noticias desde el satélite...</p>
        </div>

        <div id="noticiasContenedor" class="hidden space-y-12">
            <div id="noticiaDestacadaZona"></div>
            <div id="zonaSecundarias" class="border-t border-slate-900 pt-8 hidden">
                <h2 class="text-xl font-bold text-slate-400 tracking-tight mb-6">Crónicas de los Últimos 3 Días</h2>
                <div id="noticiasSecundariasGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500">
            &copy; 2026 KazokuGaming.
        </div>
    </footer>

    <script>
        async function cargarNoticiasInicio() {
            const loading = document.getElementById('noticiasLoading');
            const contenedor = document.getElementById('noticiasContenedor');
            const zonaDestacada = document.getElementById('noticiaDestacadaZona');
            const zonaSecundarias = document.getElementById('zonaSecundarias');
            const gridSecundarias = document.getElementById('noticiasSecundariasGrid');

            try {
                // RUTA LIMPIA PARA GITHUB PAGES
                const respuesta = await fetch('noticias.json');
                if (!respuesta.ok) throw new Error("No se pudo leer noticias.json");
                
                const datos = await respuesta.json();
                
                loading.classList.add('hidden');
                contenedor.classList.remove('hidden');

                const TRES_DIAS_MS = 259200000;
                const ahora = Date.now();
                let mostrarDestacada = false;

                if (datos.destacada) {
                    const dest = datos.destacada;
                    const fechaDestacada = dest.fecha ? new Date(dest.fecha).getTime() : ahora;
                    
                    if (ahora - fechaDestacada <= TRES_DIAS_MS || !dest.fecha) {
                        mostrarDestacada = true;
                        zonaDestacada.innerHTML = `
                            <div class="group bg-slate-900/40 border border-slate-800/80 rounded-3xl overflow-hidden hover:border-slate-700 hover:bg-slate-900/60 transition-all duration-300 lg:flex shadow-2xl shadow-black/40">
                                <div class="lg:w-1/2 h-64 lg:h-auto overflow-hidden relative bg-slate-950">
                                    <img src="${dest.imagen || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800'}" class="w-full h-full object-cover group-hover:scale-102 transition-transform duration-500">
                                    <span class="absolute top-4 left-4 bg-indigo-600/90 backdrop-blur-sm text-white text-xs uppercase font-black tracking-wider px-3 py-1 rounded-lg border border-indigo-500/30 shadow-md">Destacado</span>
                                </div>
                                <div class="p-8 lg:p-10 lg:w-1/2 flex flex-col justify-between space-y-6">
                                    <div class="space-y-4">
                                        <h3 class="text-2xl lg:text-3xl font-extrabold text-white leading-tight tracking-tight group-hover:text-cyan-300 transition-colors">${dest.titulo}</h3>
                                        <p class="text-slate-400 text-sm leading-relaxed">${dest.resumen || ''}</p>
                                    </div>
                                    <div class="pt-4 border-t border-slate-800/60">
                                        <a href="articulo.html?id=${dest.id || ''}" class="inline-flex justify-center bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold uppercase tracking-wider py-3 px-6 rounded-xl transition">Leer Crónica Completa →</a>
                                    </div>
                                </div>
                            </div>`;
                    }
                }
                if (!mostrarDestacada) zonaDestacada.innerHTML = "";

                if (datos.secundarias && datos.secundarias.length > 0) {
                    gridSecundarias.innerHTML = "";
                    const noticiasFiltradas = datos.secundarias.filter(noticia => {
                        if (!noticia.fecha) return true;
                        return (ahora - new Date(noticia.fecha).getTime()) <= TRES_DIAS_MS;
                    });

                    if (noticiasFiltradas.length > 0) {
                        zonaSecundarias.classList.remove('hidden');
                        noticiasFiltradas.forEach(noticia => {
                            gridSecundarias.innerHTML += `
                                <article class="group bg-slate-900/40 border border-slate-800/80 rounded-2xl overflow-hidden backdrop-blur-sm hover:border-slate-700 transition-all flex flex-col justify-between hover:-translate-y-1">
                                    <div class="relative aspect-video w-full overflow-hidden bg-slate-950">
                                        <img src="${noticia.imagen || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    </div>
                                    <div class="p-6 flex-grow flex flex-col justify-between space-y-4">
                                        <div>
                                            <h4 class="text-lg font-bold text-white leading-snug line-clamp-2">${noticia.titulo}</h4>
                                            <p class="text-sm text-slate-400 line-clamp-3 mt-2">${noticia.resumen}</p>
                                        </div>
                                    </div>
                                </article>`;
                        });
                    } else if (!mostrarDestacada) {
                        gridSecundarias.innerHTML = "<p class='text-slate-500 text-sm col-span-full text-center py-10'>No hay crónicas recientes.</p>";
                        zonaSecundarias.classList.remove('hidden');
                    }
                } else if (!mostrarDestacada) {
                    gridSecundarias.innerHTML = "<p class='text-slate-500 text-sm col-span-full text-center py-10'>No hay crónicas recientes.</p>";
                    zonaSecundarias.classList.remove('hidden');
                }
            } catch (error) {
                loading.innerHTML = `<div class="text-center text-red-400 text-sm">⚠️ El complemento de noticias está inactivo o vacío.</div>`;
            }
        }
        document.addEventListener('DOMContentLoaded', cargarNoticiasInicio);
    </script>
</body>
</html>
