<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazokuGaming | Revista de Videojuegos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
                KAZOKU<span class="text-slate-100">GAMING</span>
            </a>
            <nav class="flex space-x-6 text-sm font-medium">
                <a href="index.html" class="text-cyan-400 border-b-2 border-cyan-400 px-1 pb-1">Noticias</a>
                <a href="telemetria.html" class="text-slate-400 hover:text-cyan-400 transition">Telemetría</a>
                <a href="radar.html" class="text-slate-400 hover:text-cyan-400 transition">Radar de Ofertas</a>
                <a href="hardware.html" class="text-slate-400 hover:text-cyan-400 transition">Hardware</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center max-w-3xl mx-auto mb-16">
            <span class="text-xs font-bold tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Actualidad Gamer Semanal</span>
            <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl mt-4 mb-4">Últimas Crónicas Gamer</h1>
            <p class="text-lg text-slate-400">La actualidad del videojuego de las últimas 72 horas, optimizada para ti.</p>
        </div>

        <div id="noticiasLoading" class="flex flex-col items-center justify-center py-20 space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-cyan-400"></div>
            <p class="text-slate-400 text-sm animate-pulse">Sintonizando noticias desde el satélite...</p>
        </div>

        <div id="noticiasContenedor" class="hidden space-y-12">
            <div id="noticiaDestacadaZona"></div>
            <div id="zonaSecundarias" class="border-t border-slate-900 pt-8 hidden">
                <h2 class="text-xl font-bold text-slate-400 tracking-tight mb-6">Crónicas de los Últimos 3 Días</h2>
                <div id="noticiasSecundariasGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500">
            &copy; 2026 KazokuGaming.
        </div>
    </footer>

<script>
        async function cargarNoticiasInicio() {
            const loading = document.getElementById('noticiasLoading');
            const contenedor = document.getElementById('noticiasContenedor');
            const zonaDestacada = document.getElementById('noticiaDestacadaZona');
            const gridSecundarias = document.getElementById('noticiasSecundariasGrid');
            const zonaSecundarias = document.getElementById('zonaSecundarias');

            try {
                const respuesta = await fetch('noticias.json');
                if (!respuesta.ok) throw new Error("No se pudo leer noticias.json");
                
                const datos = await respuesta.json();
                
                loading.classList.add('hidden');
                contenedor.classList.remove('hidden');

                // Recopilamos todas las noticias existentes en un solo array ordenado
                let listaGlobal = [];
                if (datos.destacada && datos.destacada.titulo) {
                    listaGlobal.push(datos.destacada);
                }
                if (datos.secundarias && datos.secundarias.length > 0) {
                    listaGlobal = listaGlobal.concat(datos.secundarias);
                }

                // Eliminamos duplicados por ID por si acaso
                const idsUnicos = new Set();
                listaGlobal = listaGlobal.filter(n => {
                    if (!n.id || idsUnicos.has(n.id)) return false;
                    idsUnicos.add(n.id);
                    return true;
                });

                if (listaGlobal.length === 0) {
                    gridSecundarias.innerHTML = "<p class='text-slate-500 text-sm col-span-full text-center py-10'>No hay crónicas disponibles.</p>";
                    zonaSecundarias.classList.remove('hidden');
                    return;
                }

                // La primera de la lista (la más fresca) siempre será la Destacada principal
                const destacadaPrincipal = listaGlobal.shift();
                
                // Renderizado de la Noticia Destacada Principal
                zonaDestacada.innerHTML = `
                    <div class="group bg-slate-900/40 border border-slate-800/80 rounded-3xl overflow-hidden hover:border-slate-700 hover:bg-slate-900/60 transition-all duration-300 lg:flex shadow-2xl shadow-black/40">
                        <div class="lg:w-1/2 h-64 lg:h-auto overflow-hidden relative bg-slate-950">
                            <img src="${destacadaPrincipal.imagen || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800'}" alt="${destacadaPrincipal.titulo}" class="w-full h-full object-cover group-hover:scale-102 transition-transform duration-500">
                            <span class="absolute top-4 left-4 bg-indigo-600/90 backdrop-blur-sm text-white text-xs uppercase font-black tracking-wider px-3 py-1 rounded-lg border border-indigo-500/30 shadow-md">
                                ${destacadaPrincipal.categoria || 'Reporte Crítico'}
                            </span>
                        </div>
                        <div class="p-8 lg:p-10 lg:w-1/2 flex flex-col justify-between space-y-6">
                            <div class="space-y-4">
                                <span class="text-xs text-slate-500 font-medium">Última Hora</span>
                                <h3 class="text-2xl lg:text-3xl font-extrabold text-white leading-tight tracking-tight group-hover:text-cyan-300 transition-colors">
                                    ${destacadaPrincipal.titulo}
                                </h3>
                                <p class="text-slate-400 text-sm leading-relaxed line-clamp-4">
                                    ${destacadaPrincipal.resumen}
                                </p>
                            </div>
                            <div class="pt-4 border-t border-slate-800/60">
                                <a href="articulo.html?id=${destacadaPrincipal.id}" class="inline-flex justify-center bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold uppercase tracking-wider py-3 px-6 rounded-xl transition shadow-md shadow-indigo-900/30">
                                    Leer Crónica Completa →
                                </a>
                            </div>
                        </div>
                    </div>
                `;

                // Clasificamos el resto de las noticias por antigüedad (48 Horas de límite para tarjetas visuales)
                const limite48HorasMS = 48 * 60 * 60 * 1000;
                const ahora = new Date().getTime();

                let htmlTarjetasRecientes = "";
                let htmlListaCompacta = "";

                listaGlobal.forEach(noticia => {
                    let antigüedadMS = 0;
                    if (noticia.fecha) {
                        antigüedadMS = ahora - new Date(noticia.fecha).getTime();
                    }

                    // FORMATO 1: Menos de 48 horas (Tarjetas con imagen grandes)
                    if (antigüedadMS <= limite48HorasMS) {
                        htmlTarjetasRecientes += `
                            <article class="group bg-slate-900/40 border border-slate-800/80 rounded-2xl overflow-hidden backdrop-blur-sm hover:border-slate-700 hover:bg-slate-900/60 transition-all duration-300 flex flex-col justify-between hover:-translate-y-1 shadow-lg shadow-black/20">
                                <div class="relative aspect-video w-full overflow-hidden bg-slate-950">
                                    <img src="${noticia.imagen || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600'}" alt="${noticia.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy">
                                    <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-sm text-slate-300 text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded border border-slate-700/50">
                                        ${noticia.categoria || 'Actualidad'}
                                    </span>
                                </div>
                                <div class="p-6 flex-grow flex flex-col justify-between space-y-4">
                                    <div class="space-y-2">
                                        <h4 class="text-lg font-bold text-white leading-snug line-clamp-2 group-hover:text-cyan-300 transition-colors" title="${noticia.titulo}">
                                            ${noticia.titulo}
                                        </h4>
                                        <p class="text-sm text-slate-400 line-clamp-3 leading-relaxed">
                                            ${noticia.resumen}
                                        </p>
                                    </div>
                                    <div class="pt-3 border-t border-slate-800/40 flex justify-between items-center">
                                        <span class="text-[10px] text-slate-500 font-semibold uppercase">Reciente</span>
                                        <a href="articulo.html?id=${noticia.id}" class="text-xs font-bold text-cyan-400 hover:text-cyan-300 transition flex items-center space-x-1">
                                            <span>Leer más</span>
                                            <span>→</span>
                                        </a>
                                    </div>
                                </div>
                            </article>
                        `;
                    } 
                    // FORMATO 2: Días 3, 4 y 5 (Filas compactas ultra-limpias de Hemeroteca)
                    else {
                        // Formateamos una fecha legible corta si existe
                        let fechaLegible = "Archivo";
                        if (noticia.fecha) {
                            const d = new Date(noticia.fecha);
                            fechaLegible = d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
                        }

                        htmlListaCompacta += `
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-slate-900/20 border border-slate-800/60 rounded-xl hover:border-slate-700/80 hover:bg-slate-900/40 transition-all duration-200 gap-3">
                                <div class="flex items-center space-x-4 min-w-0">
                                    <span class="text-xs font-black text-slate-500 uppercase tracking-wider bg-slate-950 px-2.5 py-1 rounded-md border border-slate-800">${fechaLegible}</span>
                                    <div class="min-w-0">
                                        <h5 class="text-sm font-bold text-slate-200 truncate group-hover:text-white">${noticia.titulo}</h5>
                                        <p class="text-xs text-slate-400 line-clamp-1 mt-0.5">${noticia.resumen}</p>
                                    </div>
                                </div>
                                <div class="flex items-center justify-end shrink-0">
                                    <a href="articulo.html?id=${noticia.id}" class="text-xs font-bold text-slate-400 hover:text-cyan-400 bg-slate-900/80 border border-slate-800 hover:border-cyan-500/30 px-4 py-2 rounded-lg transition-all shadow-md">
                                        Explorar Crónica →
                                    </a>
                                </div>
                            </div>
                        `;
                    }
                });

                // Inyectamos las tarjetas de las últimas 48h
                if (htmlTarjetasRecientes) {
                    gridSecundarias.innerHTML = htmlTarjetasRecientes;
                    zonaSecundarias.classList.remove('hidden');
                } else {
                    gridSecundarias.innerHTML = "<p class='text-slate-500 text-sm col-span-full text-center py-6'>No hay crónicas en las últimas 48 horas.</p>";
                    zonaSecundarias.classList.remove('hidden');
                }

                // Inyectamos la sección de Hemeroteca (Días 3, 4 y 5) al final si existen noticias viejas
                const idHemeroteca = document.getElementById('hemerotecaNoticiasZona');
                if (htmlListaCompacta) {
                    // Si el contenedor visual de hemeroteca no existe en el HTML, lo creamos dinámicamente justo debajo
                    if (!idHemeroteca) {
                        const seccionHemeroteca = document.createElement('section');
                        seccionHemeroteca.id = "hemerotecaNoticiasZona";
                        seccionHemeroteca.className = "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 border-t border-slate-900";
                        seccionHemeroteca.innerHTML = `
                            <div class="flex items-center space-x-3 mb-6">
                                <div class="h-2 w-2 rounded-full bg-slate-500 animate-pulse"></div>
                                <h3 class="text-lg font-extrabold text-slate-400 tracking-wider uppercase text-sm">Hemeroteca de la Semana (Últimos 5 días)</h3>
                            </div>
                            <div class="space-y-2.5">
                                ${htmlListaCompacta}
                            </div>
                        `;
                        contenedor.appendChild(seccionHemeroteca);
                    } else {
                        idHemeroteca.innerHTML = htmlListaCompacta;
                    }
                }

            } catch (error) {
                console.error(error);
                loading.innerHTML = `
                    <div class="text-center p-6 bg-red-500/10 border border-red-500/20 rounded-xl max-w-md mx-auto">
                        <p class="text-red-400 font-semibold text-sm">⚠️ El complemento de noticias está inactivo.</p>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', cargarNoticiasInicio);
    </script>
</body>
</html>
