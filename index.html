<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KazokuGaming | Artículos y Análisis</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">
    <div id="header-container"></div>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center mb-16">
            <span class="text-xs font-bold tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-4 py-1.5 rounded-full border border-cyan-500/20 shadow-[0_0_15px_rgba(6,182,212,0.1)]">Espacio Editorial (SEO Ready)</span>
            <h1 class="text-4xl font-extrabold text-white sm:text-6xl mt-6 mb-6 tracking-tight">Artículos y Análisis Pro</h1>
            <p class="text-slate-400 max-w-2xl mx-auto text-lg">Páginas generadas en HTML estático por IA para un posicionamiento perfecto en Google.</p>
        </div>

        <div id="grid-articulos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="text-center col-span-full text-slate-500 py-20">Generando portada...</p>
        </div>
    </main>
    <script src="header.js"></script>
    <script>
        fetch('articulos.json')
            .then(res => res.json())
            .then(data => {
                const articulos = Array.isArray(data) ? data : (data.articulos || []);
                const html = articulos.map(a => {
                    // PASO 1: Ajuste de link a la página estática generada por el bot
                    const idLimpio = a.id.replace('art-', '');
                    return `
                    <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden hover:border-cyan-500/40 transition-all duration-300 shadow-xl hover:shadow-[0_0_30px_rgba(6,182,212,0.15)] group flex flex-col h-full">
                        <div class="relative overflow-hidden aspect-[16/10]">
                            <img src="${a.imagen}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700 ease-in-out">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-80"></div>
                            <span class="absolute bottom-4 left-4 text-[10px] font-black text-cyan-400 uppercase tracking-widest bg-slate-900/80 px-3 py-1 rounded border border-slate-700/50 backdrop-blur-sm">${a.categoria}</span>
                        </div>
                        <div class="p-8 flex flex-col flex-grow">
                            <h3 class="text-2xl font-extrabold text-white mb-3 leading-snug group-hover:text-cyan-400 transition">${a.titulo}</h3>
                            <p class="text-sm text-slate-400 line-clamp-3 mb-8 flex-grow leading-relaxed">${a.resumen}</p>
                            
                            <a href="articulos/${idLimpio}.html" class="inline-flex items-center justify-center w-full bg-slate-800 hover:bg-cyan-600 hover:text-slate-950 text-cyan-400 font-bold py-3 rounded-xl transition-colors border border-slate-700 hover:border-cyan-500">
                                Leer Artículo
                                <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                            </a>
                        </div>
                    </div>`
                }).join('');
                document.getElementById('grid-articulos').innerHTML = html;
            });
    </script>
</body>
</html>
