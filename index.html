<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estamos Trabajando | KazokuGaming</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19; /* El fondo oscuro oficial de KazokuGaming */
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-center items-center px-4 overflow-hidden relative">
    
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-md w-full text-center relative z-10 space-y-8">
        
        <div class="text-3xl font-black tracking-tight bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
            KAZOKU<span class="text-slate-100 font-normal">GAMING</span>
        </div>

        <div class="relative mx-auto w-64 h-64 rounded-3xl overflow-hidden border border-slate-800 shadow-2xl bg-slate-950/50 flex items-center justify-center p-2 group hover:border-cyan-500/30 transition duration-500">
            <div class="absolute inset-0 bg-gradient-to-b from-cyan-500/5 to-transparent pointer-events-none z-10"></div>
            
            <video autoplay loop muted playsinline class="w-full h-full object-cover rounded-2xl relative z-0">
                <source src="oso_panda_trabajando.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
            </video>
                 
            <div class="absolute top-3 left-3 w-3 h-3 border-t-2 border-l-2 border-cyan-400 opacity-60 z-20"></div>
            <div class="absolute top-3 right-3 w-3 h-3 border-t-2 border-r-2 border-cyan-400 opacity-60 z-20"></div>
            <div class="absolute bottom-3 left-3 w-3 h-3 border-b-2 border-l-2 border-cyan-400 opacity-60 z-20"></div>
            <div class="absolute bottom-3 right-3 w-3 h-3 border-b-2 border-r-2 border-cyan-400 opacity-60 z-20"></div>
        </div>

        <div class="space-y-3">
            <span class="inline-flex items-center gap-2 text-xs font-bold tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-4 py-1.5 rounded-full border border-cyan-500/20">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                Actualización en Progreso
            </span>
            
            <h1 class="text-4xl font-extrabold text-white tracking-tight sm:text-5xl">
                Estamos trabajando
            </h1>
            
            <p class="text-sm text-slate-400 leading-relaxed max-w-sm mx-auto">
                Estamos realizando mejoras. ¡Volvemos pronto!
            </p>
        </div>

        <div class="w-full bg-slate-900 border border-slate-800 h-2 rounded-full overflow-hidden max-w-xs mx-auto relative">
            <div class="bg-gradient-to-r from-cyan-500 to-indigo-500 h-full rounded-full w-1/3 absolute animate-infinite-loading"></div>
        </div>

    </div>

    <style>
        @keyframes infiniteLoading {
            0% { left: -33%; }
            100% { left: 100%; }
        }
        .animate-infinite-loading {
            animation: infiniteLoading 1.6s linear infinite;
        }
    </style>
</body>
</html>
