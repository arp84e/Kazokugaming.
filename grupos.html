<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA: instalable como app en móvil -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kazoku">
    <title>KAZOKUGAMING | Escuadrones y Familias</title>
    
    <meta name="description" content="Únete a escuadrones y forma tu propia familia gamer. Compite sanamente, mejora en equipo y haz amigos en KazokuGaming.">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Carga de Tailwind CSS -->

    <style> 
        body { font-family: 'Outfit', sans-serif; background-color: #050508; overflow-x: hidden; } 
        .font-display { font-family: 'Space Grotesk', sans-serif; }

        .bg-grid { background-image: linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px); background-size: 40px 40px; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col selection:bg-emerald-500/30 selection:text-emerald-200">

    <!-- Se inyecta la barra de navegación automáticamente -->
    <div id="header-container"></div>

    <main class="flex-grow relative">
        <div class="absolute inset-0 z-0 bg-grid opacity-60 pointer-events-none"></div>

        <!-- ENCABEZADO DE LA SECCIÓN -->
        <section class="relative pt-20 pb-16 overflow-hidden">
            <div class="absolute top-0 right-1/4 w-[600px] h-[600px] bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
            
            <div class="relative z-10 max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-8">
                <div>
                    <h1 class="text-4xl md:text-6xl font-black text-white tracking-tight mb-4 leading-tight">
                        Encuentra tu <br>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">Familia Gamer</span>
                    </h1>
                    <p class="text-lg text-slate-400 max-w-xl">
                        Únete a clanes activos, mejora tus habilidades en un ambiente libre de toxicidad y vive grandes momentos en equipo.
                    </p>
                </div>
                
                <!-- Botón de acción principal -->
                <button id="btn-fundar-escuadron" class="px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-600/20 flex items-center gap-3 whitespace-nowrap hover:scale-105">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Fundar Escuadrón
                </button>
            </div>
        </section>

        <!-- FILTROS DE BÚSQUEDA -->
        <section class="relative z-10 border-y border-slate-800/50 bg-slate-900/30 py-4">
            <div id="barra-filtros" class="max-w-7xl mx-auto px-4 flex gap-4 overflow-x-auto pb-2 scrollbar-hide">
                <button data-juego="Todos" class="btn-filtro px-5 py-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold rounded-full text-sm whitespace-nowrap">Todos los Juegos</button>
                <button data-juego="Valorant" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Valorant</button>
                <button data-juego="League of Legends" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">League of Legends</button>
                <button data-juego="Call of Duty" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Call of Duty</button>
                <button data-juego="Minecraft" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Minecraft</button>
                <button data-juego="Fortnite" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Fortnite</button>
                <button data-juego="Free Fire" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Free Fire</button>
                <button data-juego="EA FC" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">EA FC</button>
                <button data-juego="Apex Legends" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Apex Legends</button>
                <button data-juego="CS2" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Counter-Strike 2</button>
                <button data-juego="Rocket League" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Rocket League</button>
                <button data-juego="Roblox" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Roblox</button>
                <button data-juego="Brawl Stars" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Brawl Stars</button>
            </div>
        </section>

        <!-- DIRECTORIO DE ESCUADRONES -->
        <section class="py-16 relative z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div id="contenedor-escuadrones" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>
        </section>
    </main>

    <!-- MODAL: FUNDAR ESCUADRÓN -->
    <div id="modal-fundar-escuadron" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="fondo-modal-escuadron"></div>
        <div class="relative w-full max-w-lg bg-[#0a0a0f] border border-emerald-500/30 rounded-2xl shadow-2xl shadow-emerald-900/50 overflow-hidden">
            <div class="flex justify-between items-center p-6 border-b border-slate-800">
                <h3 class="text-xl font-black text-white">Fundar tu Escuadrón</h3>
                <button id="btn-cerrar-modal-escuadron-x" class="text-slate-400 hover:text-white transition-colors" aria-label="Cerrar">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="p-6 space-y-4">
                <div id="mensaje-escuadron" class="hidden p-3 rounded-lg text-sm font-bold text-center border"></div>

                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1">Nombre del escuadrón</label>
                    <input type="text" id="input-nombre-escuadron" maxlength="40" placeholder="Ej: Nexus Vanguard" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-300 mb-1">Videojuego</label>
                        <select id="input-juego-escuadron" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="Valorant">Valorant</option>
                            <option value="League of Legends">League of Legends</option>
                            <option value="Call of Duty">Call of Duty</option>
                            <option value="Minecraft">Minecraft</option>
                            <option value="Fortnite">Fortnite</option>
                            <option value="Free Fire">Free Fire</option>
                            <option value="EA FC">EA FC</option>
                            <option value="Apex Legends">Apex Legends</option>
                            <option value="CS2">Counter-Strike 2</option>
                            <option value="Rocket League">Rocket League</option>
                            <option value="Roblox">Roblox</option>
                            <option value="Brawl Stars">Brawl Stars</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-300 mb-1">Capacidad máxima</label>
                        <input type="number" id="input-capacidad-escuadron" min="2" max="50" value="10" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1">Descripción</label>
                    <textarea id="input-descripcion-escuadron" rows="3" maxlength="280" placeholder="Cuéntale a la comunidad qué buscas en tu escuadrón..." class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none resize-none"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-3 p-6 border-t border-slate-800 bg-slate-900/30">
                <button id="btn-cerrar-modal-escuadron" class="px-5 py-2.5 text-slate-300 font-bold hover:text-white transition-colors">Cancelar</button>
                <button id="btn-publicar-escuadron" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-500/25">
                    Fundar Escuadrón
                </button>
            </div>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer class="border-t border-slate-800/50 bg-[#020203] py-12 text-center text-slate-500 text-sm relative z-10">
        <div class="flex justify-center gap-2 text-2xl font-black tracking-tighter mb-4 opacity-50">
            <span class="text-white">KAZOKU<span class="text-indigo-400">GAMING</span></span>
        </div>
        <p>&copy; 2026 KAZOKUGAMING. Construyendo la mejor familia gamer.</p>
    </footer>

    <!-- MODAL: SOLICITUDES PENDIENTES (solo visible para el dueño del escuadrón) -->
    <div id="modal-solicitudes" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="fondo-modal-solicitudes"></div>
        <div class="relative w-full max-w-lg bg-[#0a0a0f] border border-emerald-500/30 rounded-2xl shadow-2xl overflow-hidden max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center p-6 border-b border-slate-800">
                <h3 id="titulo-solicitudes" class="text-xl font-black text-white">Solicitudes pendientes</h3>
                <button id="btn-cerrar-solicitudes" class="text-slate-400 hover:text-white transition-colors" aria-label="Cerrar">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="lista-solicitudes" class="p-6 space-y-3 overflow-y-auto"></div>
        </div>
    </div>

    <!-- MODAL: CHAT DEL ESCUADRÓN -->
    <div id="modal-chat" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="fondo-modal-chat"></div>
        <div class="relative w-full max-w-lg bg-[#0a0a0f] border border-emerald-500/30 rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[70vh]">
            <div class="flex justify-between items-center p-4 border-b border-slate-800">
                <h3 id="titulo-chat" class="text-lg font-black text-white">Chat del Escuadrón</h3>
                <button id="btn-cerrar-chat" class="text-slate-400 hover:text-white transition-colors" aria-label="Cerrar chat">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="mensajes-chat" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <form id="form-chat" class="p-4 border-t border-slate-800 flex gap-2">
                <input type="text" id="input-mensaje-chat" maxlength="500" placeholder="Escribe un mensaje..." class="flex-1 bg-slate-900 border border-slate-700 text-white px-4 py-2.5 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500" autocomplete="off">
                <button type="submit" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all">Enviar</button>
            </form>
        </div>
    </div>

    <!-- Importamos la cabecera compartida -->
    <script type="module" src="header.js"></script>

    <!-- SCRIPT DE ESCUADRONES (conectado a Firestore) -->
    <script type="module">
        import {
            collection, addDoc, doc, setDoc, deleteDoc, updateDoc, arrayUnion, query, orderBy, limit, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db, onAuthStateChanged, serverTimestamp } from './firebase-init.js';
        import { showToast, showReportPrompt, skeletonCards, skeletonRows } from './ui-utils.js';

        const sanitizarHTML = (texto) => {
            const el = document.createElement('div');
            el.textContent = texto ?? '';
            return el.innerHTML;
        };

        const coloresPorJuego = {
            "Valorant": ["from-red-500", "to-orange-500", "text-red-400", "bg-red-400/10"],
            "League of Legends": ["from-blue-500", "to-indigo-500", "text-blue-400", "bg-blue-400/10"],
            "Call of Duty": ["from-amber-500", "to-yellow-500", "text-amber-400", "bg-amber-400/10"],
            "Minecraft": ["from-emerald-500", "to-green-500", "text-emerald-400", "bg-emerald-400/10"],
            "Fortnite": ["from-violet-500", "to-purple-500", "text-violet-400", "bg-violet-400/10"],
            "Free Fire": ["from-orange-500", "to-rose-500", "text-orange-400", "bg-orange-400/10"],
            "EA FC": ["from-lime-500", "to-green-500", "text-lime-400", "bg-lime-400/10"],
            "Apex Legends": ["from-rose-500", "to-red-600", "text-rose-400", "bg-rose-400/10"],
            "CS2": ["from-yellow-500", "to-orange-600", "text-yellow-400", "bg-yellow-400/10"],
            "Rocket League": ["from-cyan-500", "to-sky-500", "text-cyan-400", "bg-cyan-400/10"],
            "Roblox": ["from-pink-500", "to-fuchsia-500", "text-pink-400", "bg-pink-400/10"],
            "Brawl Stars": ["from-yellow-400", "to-amber-500", "text-yellow-300", "bg-yellow-400/10"]
        };

        function inicialesDe(nombre) {
            return (nombre || "??").trim().split(/\s+/).slice(0, 2).map(p => p[0]?.toUpperCase() || '').join('') || "??";
        }

        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('modal-fundar-escuadron');
            const contenedor = document.getElementById('contenedor-escuadrones');
            contenedor.innerHTML = skeletonCards(3);
            const mensajeEscuadron = document.getElementById('mensaje-escuadron');
            let usuarioActual = null;
            let escuadronesCache = [];

            // Si venimos desde el buscador del inicio (index.html?juego=X → grupos.html?juego=X),
            // pre-seleccionamos ese filtro en vez de "Todos los Juegos".
            const juegoDesdeUrl = new URLSearchParams(window.location.search).get('juego');
            const botonFiltroInicial = juegoDesdeUrl && document.querySelector(`.btn-filtro[data-juego="${CSS.escape(juegoDesdeUrl)}"]`);
            let filtroActual = botonFiltroInicial ? juegoDesdeUrl : 'Todos';
            if (botonFiltroInicial) {
                document.querySelectorAll('.btn-filtro').forEach(b => {
                    b.classList.remove('bg-emerald-500/20', 'text-emerald-400', 'border', 'border-emerald-500/30');
                    b.classList.add('text-slate-400');
                });
                botonFiltroInicial.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border', 'border-emerald-500/30');
                botonFiltroInicial.classList.remove('text-slate-400');
                botonFiltroInicial.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            onAuthStateChanged(auth, (user) => { usuarioActual = user; pintarEscuadrones(); });

            const mostrarMensajeEscuadron = (texto, tipo) => {
                mensajeEscuadron.classList.remove('hidden', 'bg-red-500/20', 'border-red-500', 'text-red-400', 'bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
                mensajeEscuadron.classList.add(tipo === 'error' ? 'bg-red-500/20' : 'bg-emerald-500/20', tipo === 'error' ? 'border-red-500' : 'border-emerald-500', tipo === 'error' ? 'text-red-400' : 'text-emerald-400');
                mensajeEscuadron.innerText = texto;
            };

            // --- Abrir / cerrar modal de creación ---
            document.getElementById('btn-fundar-escuadron').addEventListener('click', () => {
                if (!usuarioActual) {
                    window.location.href = 'login.html';
                    return;
                }
                mensajeEscuadron.classList.add('hidden');
                modal.classList.remove('hidden');
            });

            const cerrarModal = () => modal.classList.add('hidden');
            document.getElementById('btn-cerrar-modal-escuadron').addEventListener('click', cerrarModal);
            document.getElementById('btn-cerrar-modal-escuadron-x').addEventListener('click', cerrarModal);
            document.getElementById('fondo-modal-escuadron').addEventListener('click', cerrarModal);

            // --- Publicar un nuevo escuadrón en Firestore ---
            const btnPublicar = document.getElementById('btn-publicar-escuadron');
            btnPublicar.addEventListener('click', async () => {
                if (!usuarioActual) { window.location.href = 'login.html'; return; }

                const nombre = document.getElementById('input-nombre-escuadron').value.trim();
                const juego = document.getElementById('input-juego-escuadron').value;
                const capacidad = parseInt(document.getElementById('input-capacidad-escuadron').value, 10) || 10;
                const descripcion = document.getElementById('input-descripcion-escuadron').value.trim().slice(0, 280);

                if (nombre.length < 3 || nombre.length > 40) {
                    mostrarMensajeEscuadron("El nombre debe tener entre 3 y 40 caracteres.", "error");
                    return;
                }
                if (capacidad < 2 || capacidad > 50) {
                    mostrarMensajeEscuadron("La capacidad debe estar entre 2 y 50 miembros.", "error");
                    return;
                }

                btnPublicar.disabled = true;
                btnPublicar.innerText = "Fundando...";

                try {
                    await addDoc(collection(db, 'escuadrones'), {
                        nombre,
                        juego,
                        descripcion: descripcion || "¡Únete y sé parte de la familia!",
                        capacidad,
                        duenoId: usuarioActual.uid,
                        duenoNombre: usuarioActual.displayName || usuarioActual.email.split('@')[0],
                        miembros: [usuarioActual.uid],
                        creadoEn: serverTimestamp()
                    });

                    document.getElementById('input-nombre-escuadron').value = '';
                    document.getElementById('input-descripcion-escuadron').value = '';
                    document.getElementById('input-capacidad-escuadron').value = '10';
                    cerrarModal();
                    showToast("¡Escuadrón fundado! Ya aparece en el directorio.", "exito");
                } catch (error) {
                    console.error("No se pudo fundar el escuadrón:", error);
                    mostrarMensajeEscuadron("No se pudo fundar el escuadrón. Inténtalo de nuevo.", "error");
                } finally {
                    btnPublicar.disabled = false;
                    btnPublicar.innerText = "Fundar Escuadrón";
                }
            });

            // --- Filtros por juego ---
            document.getElementById('barra-filtros').addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-filtro');
                if (!btn) return;
                filtroActual = btn.dataset.juego;
                document.querySelectorAll('.btn-filtro').forEach(b => {
                    b.classList.remove('bg-emerald-500/20', 'text-emerald-400', 'border', 'border-emerald-500/30');
                    b.classList.add('text-slate-400');
                });
                btn.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border', 'border-emerald-500/30');
                btn.classList.remove('text-slate-400');
                pintarEscuadrones();
            });

            // --- Solicitar ingreso a un escuadrón ---
            contenedor.addEventListener('click', async (e) => {
                const btnReportar = e.target.closest('.btn-reportar-escuadron');
                if (btnReportar) {
                    if (!usuarioActual) { window.location.href = 'login.html'; return; }
                    const motivo = await showReportPrompt({ titulo: `🚩 Reportar "${btnReportar.dataset.nombre}"` });
                    if (motivo === null) return;
                    try {
                        await addDoc(collection(db, 'reportes'), {
                            tipo: 'escuadron',
                            objetivoId: btnReportar.dataset.id,
                            objetivoNombre: btnReportar.dataset.nombre,
                            motivo,
                            reportadoPor: usuarioActual.uid,
                            reportadoPorNombre: usuarioActual.displayName || usuarioActual.email.split('@')[0],
                            estado: 'pendiente',
                            creadoEn: serverTimestamp()
                        });
                        showToast("Reporte enviado. Gracias por ayudar a mantener la comunidad sana.", "exito");
                    } catch (error) {
                        console.error("No se pudo enviar el reporte:", error);
                        showToast("No se pudo enviar el reporte.", "error");
                    }
                    return;
                }

                const btn = e.target.closest('.btn-solicitar');
                if (!btn) return;

                if (!usuarioActual) { window.location.href = 'login.html'; return; }

                const escuadronId = btn.dataset.id;
                btn.disabled = true;
                const textoOriginal = btn.innerText;
                btn.innerText = "Enviando...";

                try {
                    await setDoc(doc(db, 'escuadrones', escuadronId, 'solicitudes', usuarioActual.uid), {
                        solicitanteId: usuarioActual.uid,
                        solicitanteNombre: usuarioActual.displayName || usuarioActual.email.split('@')[0],
                        creadoEn: serverTimestamp()
                    });
                    btn.innerText = "¡Solicitud enviada!";
                    btn.classList.remove('bg-slate-800', 'hover:bg-emerald-600');
                    btn.classList.add('bg-emerald-700');
                } catch (error) {
                    console.error("No se pudo enviar la solicitud:", error);
                    btn.innerText = textoOriginal;
                    btn.disabled = false;
                    showToast("No se pudo enviar la solicitud. Inténtalo de nuevo.", "error");
                }
            });

            // --- Abrir el chat de un escuadrón (solo miembros) ---
            const modalChat = document.getElementById('modal-chat');
            const mensajesChat = document.getElementById('mensajes-chat');
            const formChat = document.getElementById('form-chat');
            const inputChat = document.getElementById('input-mensaje-chat');
            let dejarDeEscucharChat = null;
            let escuadronChatActual = null;

            function cerrarChat() {
                modalChat.classList.add('hidden');
                if (dejarDeEscucharChat) { dejarDeEscucharChat(); dejarDeEscucharChat = null; }
                escuadronChatActual = null;
            }
            document.getElementById('btn-cerrar-chat').addEventListener('click', cerrarChat);
            document.getElementById('fondo-modal-chat').addEventListener('click', cerrarChat);

            function pintarMensaje(m) {
                const mio = usuarioActual && m.autorId === usuarioActual.uid;
                return `<div class="max-w-[80%] ${mio ? 'ml-auto text-right' : ''}">
                    <a href="usuario.html?uid=${encodeURIComponent(m.autorId)}" class="text-xs text-slate-500 hover:text-indigo-400 hover:underline mb-0.5 inline-block">${sanitizarHTML(m.autorNombre)}</a>
                    <p class="inline-block px-3 py-2 rounded-xl text-sm ${mio ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-200'}">${sanitizarHTML(m.texto)}</p>
                </div>`;
            }

            contenedor.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-abrir-chat');
                if (!btn) return;
                if (!usuarioActual) { window.location.href = 'login.html'; return; }

                escuadronChatActual = btn.dataset.id;
                document.getElementById('titulo-chat').innerText = `💬 ${btn.dataset.nombre}`;
                mensajesChat.innerHTML = skeletonRows(3);
                modalChat.classList.remove('hidden');

                const qMsg = query(collection(db, 'escuadrones', escuadronChatActual, 'mensajes'), orderBy('creadoEn', 'asc'), limit(100));
                dejarDeEscucharChat = onSnapshot(qMsg, (snap) => {
                    if (snap.empty) {
                        mensajesChat.innerHTML = `<p class="text-slate-500 text-center text-sm">Sé el primero en escribir en este escuadrón.</p>`;
                    } else {
                        mensajesChat.innerHTML = snap.docs.map(d => pintarMensaje(d.data())).join('');
                        mensajesChat.scrollTop = mensajesChat.scrollHeight;
                    }
                    // Marca como leído cada vez que se pintan mensajes (al abrir Y si llega uno nuevo mientras está abierto)
                    updateDoc(doc(db, 'usuarios', usuarioActual.uid), {
                        [`ultimasLecturas.${escuadronChatActual}`]: serverTimestamp()
                    }).catch((err) => console.error("No se pudo marcar como leído:", err));
                }, (error) => {
                    console.error("Error en el chat:", error);
                    mensajesChat.innerHTML = `<p class="text-red-400 text-center text-sm">No se pudo cargar el chat.</p>`;
                });
            });

            formChat.addEventListener('submit', async (e) => {
                e.preventDefault();
                const texto = inputChat.value.trim();
                if (!texto || !escuadronChatActual || !usuarioActual) return;

                inputChat.value = '';
                try {
                    await addDoc(collection(db, 'escuadrones', escuadronChatActual, 'mensajes'), {
                        texto: texto.slice(0, 500),
                        autorId: usuarioActual.uid,
                        autorNombre: usuarioActual.displayName || usuarioActual.email.split('@')[0],
                        creadoEn: serverTimestamp()
                    });
                } catch (error) {
                    console.error("No se pudo enviar el mensaje:", error);
                    showToast("No se pudo enviar el mensaje.", "error");
                }
            });

            // --- Panel de solicitudes pendientes (solo dueño) ---
            const modalSolicitudes = document.getElementById('modal-solicitudes');
            const listaSolicitudes = document.getElementById('lista-solicitudes');
            let dejarDeEscucharSolicitudes = null;

            function cerrarSolicitudes() {
                modalSolicitudes.classList.add('hidden');
                if (dejarDeEscucharSolicitudes) { dejarDeEscucharSolicitudes(); dejarDeEscucharSolicitudes = null; }
            }
            document.getElementById('btn-cerrar-solicitudes').addEventListener('click', cerrarSolicitudes);
            document.getElementById('fondo-modal-solicitudes').addEventListener('click', cerrarSolicitudes);

            contenedor.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-ver-solicitudes');
                if (!btn) return;

                const escuadronId = btn.dataset.id;
                document.getElementById('titulo-solicitudes').innerText = `📋 ${btn.dataset.nombre}`;
                listaSolicitudes.innerHTML = skeletonRows(2);
                modalSolicitudes.classList.remove('hidden');

                const qSol = query(collection(db, 'escuadrones', escuadronId, 'solicitudes'), orderBy('creadoEn', 'asc'));
                dejarDeEscucharSolicitudes = onSnapshot(qSol, (snap) => {
                    if (snap.empty) {
                        listaSolicitudes.innerHTML = `<p class="text-slate-500 text-center text-sm">No hay solicitudes pendientes.</p>`;
                        return;
                    }
                    listaSolicitudes.innerHTML = snap.docs.map(d => {
                        const s = d.data();
                        return `<div class="flex justify-between items-center bg-slate-900/60 border border-slate-800 rounded-xl p-3">
                            <a href="usuario.html?uid=${d.id}" class="font-bold text-white text-sm hover:text-indigo-400 hover:underline">${sanitizarHTML(s.solicitanteNombre)}</a>
                            <div class="flex gap-2">
                                <button data-escuadron="${escuadronId}" data-uid="${d.id}" data-nombre="${sanitizarHTML(s.solicitanteNombre)}" class="btn-aceptar-solicitud px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg">Aceptar</button>
                                <button data-escuadron="${escuadronId}" data-uid="${d.id}" class="btn-rechazar-solicitud px-3 py-1.5 bg-slate-800 hover:bg-red-600 text-white text-xs font-bold rounded-lg">Rechazar</button>
                            </div>
                        </div>`;
                    }).join('');
                }, (error) => {
                    console.error("Error cargando solicitudes:", error);
                    listaSolicitudes.innerHTML = `<p class="text-red-400 text-center text-sm">No se pudieron cargar.</p>`;
                });
            });

            listaSolicitudes.addEventListener('click', async (e) => {
                const btnAceptar = e.target.closest('.btn-aceptar-solicitud');
                const btnRechazar = e.target.closest('.btn-rechazar-solicitud');
                if (!btnAceptar && !btnRechazar) return;

                const btn = btnAceptar || btnRechazar;
                const escuadronId = btn.dataset.escuadron;
                const uid = btn.dataset.uid;
                btn.disabled = true;

                try {
                    if (btnAceptar) {
                        await updateDoc(doc(db, 'escuadrones', escuadronId), { miembros: arrayUnion(uid) });
                        await deleteDoc(doc(db, 'escuadrones', escuadronId, 'solicitudes', uid));
                        showToast("Solicitud aceptada. ¡Nuevo miembro en el escuadrón!", "exito");
                    } else {
                        await deleteDoc(doc(db, 'escuadrones', escuadronId, 'solicitudes', uid));
                        showToast("Solicitud rechazada.", "info");
                    }
                } catch (error) {
                    console.error("No se pudo procesar la solicitud:", error);
                    showToast("No se pudo procesar la solicitud.", "error");
                    btn.disabled = false;
                }
            });

            // --- Pintar tarjetas según el filtro activo ---
            function pintarEscuadrones() {
                const lista = filtroActual === 'Todos'
                    ? escuadronesCache
                    : escuadronesCache.filter(e => e.juego === filtroActual);

                if (lista.length === 0) {
                    contenedor.innerHTML = `<p class="text-slate-500 col-span-full text-center py-8">No hay escuadrones ${filtroActual === 'Todos' ? 'todavía' : `de ${sanitizarHTML(filtroActual)}`}. ¡Funda el primero!</p>`;
                    return;
                }

                contenedor.innerHTML = lista.map((e) => {
                    const [de1, de2, textoColor, fondoColor] = coloresPorJuego[e.juego] || ["from-indigo-500", "to-fuchsia-500", "text-indigo-400", "bg-indigo-400/10"];
                    const miembrosArr = Array.isArray(e.miembros) ? e.miembros : [];
                    const miembros = miembrosArr.length;
                    const lleno = miembros >= e.capacidad;
                    const esDueno = usuarioActual && e.duenoId === usuarioActual.uid;
                    const esMiembro = usuarioActual && miembrosArr.includes(usuarioActual.uid);
                    return `
                        <div class="glass-panel rounded-2xl p-6 hover:border-emerald-500/50 transition-all hover:-translate-y-1 relative overflow-hidden">
                            <div class="flex items-center justify-between mb-4">
                                <div class="flex items-center gap-4">
                                    <div class="w-14 h-14 rounded-xl bg-gradient-to-br ${de1} ${de2} flex items-center justify-center text-white font-black text-2xl shadow-lg">${sanitizarHTML(inicialesDe(e.nombre))}</div>
                                    <div>
                                        <h3 class="text-xl font-bold text-white leading-tight">${sanitizarHTML(e.nombre)}</h3>
                                        <span class="text-xs font-bold ${textoColor} ${fondoColor} px-2 py-1 rounded">${sanitizarHTML(e.juego)}</span>
                                    </div>
                                </div>
                                <button data-id="${e.id}" data-nombre="${sanitizarHTML(e.nombre)}" class="btn-reportar-escuadron text-slate-600 hover:text-red-400 transition-colors text-xs shrink-0" aria-label="Reportar escuadrón" title="Reportar">🚩</button>
                            </div>
                            <p class="text-sm text-slate-400 mb-1">${sanitizarHTML(e.descripcion)}</p>
                            <a href="usuario.html?uid=${encodeURIComponent(e.duenoId)}" class="text-xs text-slate-500 hover:text-indigo-400 hover:underline transition-colors">Fundado por ${sanitizarHTML(e.duenoNombre || 'un jugador')}</a>
                            <div class="flex justify-between items-center pt-4 mt-4 border-t border-slate-800 gap-2">
                                <div class="text-sm font-bold text-slate-300">👥 ${miembros}/${e.capacidad}</div>
                                <div class="flex gap-2">
                                    ${esDueno ? `<button data-id="${e.id}" data-nombre="${sanitizarHTML(e.nombre)}" class="btn-ver-solicitudes px-3 py-2 bg-slate-800 hover:bg-amber-600 text-white text-sm font-bold rounded-lg transition-colors">📋 Solicitudes</button>` : ''}
                                    ${esMiembro ? `<button data-id="${e.id}" data-nombre="${sanitizarHTML(e.nombre)}" class="btn-abrir-chat px-3 py-2 bg-slate-800 hover:bg-emerald-600 text-white text-sm font-bold rounded-lg transition-colors">💬 Chat</button>` : `<button data-id="${e.id}" ${lleno ? 'disabled' : ''} class="btn-solicitar px-4 py-2 ${lleno ? 'bg-slate-800/50 text-slate-500 cursor-not-allowed' : 'bg-slate-800 hover:bg-emerald-600 text-white'} text-sm font-bold rounded-lg transition-colors">${lleno ? 'Lleno' : 'Solicitar Ingreso'}</button>`}
                                </div>
                            </div>
                        </div>`;
                }).join('');
            }

            // --- Escuchar escuadrones en tiempo real ---
            const q = query(collection(db, 'escuadrones'), orderBy('creadoEn', 'desc'));
            onSnapshot(q, (snapshot) => {
                escuadronesCache = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                pintarEscuadrones();
            }, (error) => {
                console.error("Error escuchando escuadrones:", error);
                contenedor.innerHTML = `<p class="text-red-400 col-span-full text-center py-8">No se pudieron cargar los escuadrones.</p>`;
            });

            // --- Cerrar el modal abierto (el que sea) con la tecla Escape ---
            document.addEventListener('keydown', (e) => {
                if (e.key !== 'Escape') return;
                if (!modal.classList.contains('hidden')) cerrarModal();
                else if (!modalSolicitudes.classList.contains('hidden')) cerrarSolicitudes();
                else if (!modalChat.classList.contains('hidden')) cerrarChat();
            });
        });
    </script>
</body>
</html>
