<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAZOKUGAMING | Escuadrones y Familias</title>
    
    <meta name="description" content="Únete a escuadrones y forma tu propia familia gamer. Compite sanamente, mejora en equipo y haz amigos en KazokuGaming.">
    <!-- Fuentes tipográficas modernas -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style> 
        body { font-family: 'Outfit', sans-serif; background-color: #050508; overflow-x: hidden; } 
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(79, 70, 229, 0.2); }
        .bg-grid { background-image: linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px); background-size: 40px 40px; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col selection:bg-emerald-500/30 selection:text-emerald-200">

    <!-- Se inyecta la barra de navegación automáticamente -->
    <div id="header-container"></div>

    <main class="flex-grow relative">
        <div class="absolute inset-0 z-0 bg-grid opacity-60 pointer-events-none"></div>

        <!-- ENCABEZADO DE LA SECCIÓN -->
        <section class="relative pt-20 pb-16 overflow-hidden">
            <div class="absolute top-0 right-1/4 w-[600px] h-[600px] bg-emerald-600/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
            
            <div class="relative z-10 max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-8">
                <div>
                    <h1 class="text-4xl md:text-6xl font-black text-white tracking-tight mb-4 leading-tight">
                        Encuentra tu <br>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">Familia Gamer</span>
                    </h1>
                    <p class="text-lg text-slate-400 max-w-xl">
                        Únete a clanes activos, mejora tus habilidades en un ambiente libre de toxicidad y vive grandes momentos en equipo.
                    </p>
                </div>
                
                <!-- Botón de acción principal -->
                <button id="btn-fundar-escuadron" class="px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-600/20 flex items-center gap-3 whitespace-nowrap hover:scale-105">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Fundar Escuadrón
                </button>
            </div>
        </section>

        <!-- FILTROS DE BÚSQUEDA -->
        <section class="relative z-10 border-y border-slate-800/50 bg-slate-900/30 py-4">
            <div id="barra-filtros" class="max-w-7xl mx-auto px-4 flex gap-4 overflow-x-auto pb-2 scrollbar-hide">
                <button data-juego="Todos" class="btn-filtro px-5 py-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold rounded-full text-sm whitespace-nowrap">Todos los Juegos</button>
                <button data-juego="Valorant" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Valorant</button>
                <button data-juego="League of Legends" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">League of Legends</button>
                <button data-juego="Call of Duty" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Call of Duty</button>
                <button data-juego="Minecraft" class="btn-filtro px-5 py-2 hover:bg-slate-800 text-slate-400 font-bold rounded-full text-sm transition-colors whitespace-nowrap">Minecraft</button>
            </div>
        </section>

        <!-- DIRECTORIO DE ESCUADRONES -->
        <section class="py-16 relative z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div id="contenedor-escuadrones" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <p class="text-slate-500 col-span-full text-center py-8">Cargando escuadrones...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL: FUNDAR ESCUADRÓN -->
    <div id="modal-fundar-escuadron" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="fondo-modal-escuadron"></div>
        <div class="relative w-full max-w-lg bg-[#0a0a0f] border border-emerald-500/30 rounded-2xl shadow-2xl shadow-emerald-900/50 overflow-hidden">
            <div class="flex justify-between items-center p-6 border-b border-slate-800">
                <h3 class="text-xl font-black text-white">Fundar tu Escuadrón</h3>
                <button id="btn-cerrar-modal-escuadron-x" class="text-slate-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="p-6 space-y-4">
                <div id="mensaje-escuadron" class="hidden p-3 rounded-lg text-sm font-bold text-center border"></div>

                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1">Nombre del escuadrón</label>
                    <input type="text" id="input-nombre-escuadron" maxlength="40" placeholder="Ej: Nexus Vanguard" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-300 mb-1">Videojuego</label>
                        <select id="input-juego-escuadron" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="Valorant">Valorant</option>
                            <option value="League of Legends">League of Legends</option>
                            <option value="Call of Duty">Call of Duty</option>
                            <option value="Minecraft">Minecraft</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-300 mb-1">Capacidad máxima</label>
                        <input type="number" id="input-capacidad-escuadron" min="2" max="50" value="10" class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-1">Descripción</label>
                    <textarea id="input-descripcion-escuadron" rows="3" maxlength="280" placeholder="Cuéntale a la comunidad qué buscas en tu escuadrón..." class="w-full bg-slate-900 border border-slate-700 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none resize-none"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-3 p-6 border-t border-slate-800 bg-slate-900/30">
                <button id="btn-cerrar-modal-escuadron" class="px-5 py-2.5 text-slate-300 font-bold hover:text-white transition-colors">Cancelar</button>
                <button id="btn-publicar-escuadron" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-500/25">
                    Fundar Escuadrón
                </button>
            </div>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer class="border-t border-slate-800/50 bg-[#020203] py-12 text-center text-slate-500 text-sm relative z-10">
        <div class="flex justify-center gap-2 text-2xl font-black tracking-tighter mb-4 opacity-50">
            <span class="text-white">KAZOKU<span class="text-indigo-400">GAMING</span></span>
        </div>
        <p>&copy; 2026 KAZOKUGAMING. Construyendo la mejor familia gamer.</p>
    </footer>

    <!-- Importamos la cabecera compartida -->
    <script type="module" src="header.js"></script>

    <!-- SCRIPT DE ESCUADRONES (conectado a Firestore) -->
    <script type="module">
        import {
            collection, addDoc, doc, setDoc, query, orderBy, onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { auth, db, onAuthStateChanged, serverTimestamp } from './firebase-init.js';

        const sanitizarHTML = (texto) => {
            const el = document.createElement('div');
            el.textContent = texto ?? '';
            return el.innerHTML;
        };

        const coloresPorJuego = {
            "Valorant": ["from-red-500", "to-orange-500", "text-red-400", "bg-red-400/10"],
            "League of Legends": ["from-blue-500", "to-indigo-500", "text-blue-400", "bg-blue-400/10"],
            "Call of Duty": ["from-amber-500", "to-yellow-500", "text-amber-400", "bg-amber-400/10"],
            "Minecraft": ["from-emerald-500", "to-green-500", "text-emerald-400", "bg-emerald-400/10"]
        };

        function inicialesDe(nombre) {
            return (nombre || "??").trim().split(/\s+/).slice(0, 2).map(p => p[0]?.toUpperCase() || '').join('') || "??";
        }

        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('modal-fundar-escuadron');
            const contenedor = document.getElementById('contenedor-escuadrones');
            const mensajeEscuadron = document.getElementById('mensaje-escuadron');
            let usuarioActual = null;
            let escuadronesCache = [];
            let filtroActual = 'Todos';

            onAuthStateChanged(auth, (user) => { usuarioActual = user; });

            const mostrarMensajeEscuadron = (texto, tipo) => {
                mensajeEscuadron.classList.remove('hidden', 'bg-red-500/20', 'border-red-500', 'text-red-400', 'bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
                mensajeEscuadron.classList.add(tipo === 'error' ? 'bg-red-500/20' : 'bg-emerald-500/20', tipo === 'error' ? 'border-red-500' : 'border-emerald-500', tipo === 'error' ? 'text-red-400' : 'text-emerald-400');
                mensajeEscuadron.innerText = texto;
            };

            // --- Abrir / cerrar modal de creación ---
            document.getElementById('btn-fundar-escuadron').addEventListener('click', () => {
                if (!usuarioActual) {
                    window.location.href = 'login.html';
                    return;
                }
                mensajeEscuadron.classList.add('hidden');
                modal.classList.remove('hidden');
            });

            const cerrarModal = () => modal.classList.add('hidden');
            document.getElementById('btn-cerrar-modal-escuadron').addEventListener('click', cerrarModal);
            document.getElementById('btn-cerrar-modal-escuadron-x').addEventListener('click', cerrarModal);
            document.getElementById('fondo-modal-escuadron').addEventListener('click', cerrarModal);

            // --- Publicar un nuevo escuadrón en Firestore ---
            const btnPublicar = document.getElementById('btn-publicar-escuadron');
            btnPublicar.addEventListener('click', async () => {
                if (!usuarioActual) { window.location.href = 'login.html'; return; }

                const nombre = document.getElementById('input-nombre-escuadron').value.trim();
                const juego = document.getElementById('input-juego-escuadron').value;
                const capacidad = parseInt(document.getElementById('input-capacidad-escuadron').value, 10) || 10;
                const descripcion = document.getElementById('input-descripcion-escuadron').value.trim().slice(0, 280);

                if (nombre.length < 3 || nombre.length > 40) {
                    mostrarMensajeEscuadron("El nombre debe tener entre 3 y 40 caracteres.", "error");
                    return;
                }
                if (capacidad < 2 || capacidad > 50) {
                    mostrarMensajeEscuadron("La capacidad debe estar entre 2 y 50 miembros.", "error");
                    return;
                }

                btnPublicar.disabled = true;
                btnPublicar.innerText = "Fundando...";

                try {
                    await addDoc(collection(db, 'escuadrones'), {
                        nombre,
                        juego,
                        descripcion: descripcion || "¡Únete y sé parte de la familia!",
                        capacidad,
                        duenoId: usuarioActual.uid,
                        duenoNombre: usuarioActual.displayName || usuarioActual.email.split('@')[0],
                        miembros: [usuarioActual.uid],
                        creadoEn: serverTimestamp()
                    });

                    document.getElementById('input-nombre-escuadron').value = '';
                    document.getElementById('input-descripcion-escuadron').value = '';
                    document.getElementById('input-capacidad-escuadron').value = '10';
                    cerrarModal();
                } catch (error) {
                    console.error("No se pudo fundar el escuadrón:", error);
                    mostrarMensajeEscuadron("No se pudo fundar el escuadrón. Inténtalo de nuevo.", "error");
                } finally {
                    btnPublicar.disabled = false;
                    btnPublicar.innerText = "Fundar Escuadrón";
                }
            });

            // --- Filtros por juego ---
            document.getElementById('barra-filtros').addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-filtro');
                if (!btn) return;
                filtroActual = btn.dataset.juego;
                document.querySelectorAll('.btn-filtro').forEach(b => {
                    b.classList.remove('bg-emerald-500/20', 'text-emerald-400', 'border', 'border-emerald-500/30');
                    b.classList.add('text-slate-400');
                });
                btn.classList.add('bg-emerald-500/20', 'text-emerald-400', 'border', 'border-emerald-500/30');
                btn.classList.remove('text-slate-400');
                pintarEscuadrones();
            });

            // --- Solicitar ingreso a un escuadrón ---
            contenedor.addEventListener('click', async (e) => {
                const btn = e.target.closest('.btn-solicitar');
                if (!btn) return;

                if (!usuarioActual) { window.location.href = 'login.html'; return; }

                const escuadronId = btn.dataset.id;
                btn.disabled = true;
                const textoOriginal = btn.innerText;
                btn.innerText = "Enviando...";

                try {
                    await setDoc(doc(db, 'escuadrones', escuadronId, 'solicitudes', usuarioActual.uid), {
                        solicitanteId: usuarioActual.uid,
                        solicitanteNombre: usuarioActual.displayName || usuarioActual.email.split('@')[0],
                        creadoEn: serverTimestamp()
                    });
                    btn.innerText = "¡Solicitud enviada!";
                    btn.classList.remove('bg-slate-800', 'hover:bg-emerald-600');
                    btn.classList.add('bg-emerald-700');
                } catch (error) {
                    console.error("No se pudo enviar la solicitud:", error);
                    btn.innerText = textoOriginal;
                    btn.disabled = false;
                    alert("No se pudo enviar la solicitud. Inténtalo de nuevo.");
                }
            });

            // --- Pintar tarjetas según el filtro activo ---
            function pintarEscuadrones() {
                const lista = filtroActual === 'Todos'
                    ? escuadronesCache
                    : escuadronesCache.filter(e => e.juego === filtroActual);

                if (lista.length === 0) {
                    contenedor.innerHTML = `<p class="text-slate-500 col-span-full text-center py-8">No hay escuadrones ${filtroActual === 'Todos' ? 'todavía' : `de ${sanitizarHTML(filtroActual)}`}. ¡Funda el primero!</p>`;
                    return;
                }

                contenedor.innerHTML = lista.map((e) => {
                    const [de1, de2, textoColor, fondoColor] = coloresPorJuego[e.juego] || ["from-indigo-500", "to-fuchsia-500", "text-indigo-400", "bg-indigo-400/10"];
                    const miembros = Array.isArray(e.miembros) ? e.miembros.length : 1;
                    const lleno = miembros >= e.capacidad;
                    return `
                        <div class="glass-panel rounded-2xl p-6 hover:border-emerald-500/50 transition-all hover:-translate-y-1 relative overflow-hidden">
                            <div class="flex items-center gap-4 mb-4">
                                <div class="w-14 h-14 rounded-xl bg-gradient-to-br ${de1} ${de2} flex items-center justify-center text-white font-black text-2xl shadow-lg">${sanitizarHTML(inicialesDe(e.nombre))}</div>
                                <div>
                                    <h3 class="text-xl font-bold text-white leading-tight">${sanitizarHTML(e.nombre)}</h3>
                                    <span class="text-xs font-bold ${textoColor} ${fondoColor} px-2 py-1 rounded">${sanitizarHTML(e.juego)}</span>
                                </div>
                            </div>
                            <p class="text-sm text-slate-400 mb-6">${sanitizarHTML(e.descripcion)}</p>
                            <div class="flex justify-between items-center pt-4 border-t border-slate-800">
                                <div class="text-sm font-bold text-slate-300">👥 ${miembros}/${e.capacidad} Miembros</div>
                                <button data-id="${e.id}" ${lleno ? 'disabled' : ''} class="btn-solicitar px-4 py-2 ${lleno ? 'bg-slate-800/50 text-slate-500 cursor-not-allowed' : 'bg-slate-800 hover:bg-emerald-600 text-white'} text-sm font-bold rounded-lg transition-colors">${lleno ? 'Escuadrón Lleno' : 'Solicitar Ingreso'}</button>
                            </div>
                        </div>`;
                }).join('');
            }

            // --- Escuchar escuadrones en tiempo real ---
            const q = query(collection(db, 'escuadrones'), orderBy('creadoEn', 'desc'));
            onSnapshot(q, (snapshot) => {
                escuadronesCache = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                pintarEscuadrones();
            }, (error) => {
                console.error("Error escuchando escuadrones:", error);
                contenedor.innerHTML = `<p class="text-red-400 col-span-full text-center py-8">No se pudieron cargar los escuadrones.</p>`;
            });
        });
    </script>
</body>
</html>
