<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetría | KazokuGaming</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">
    <div id="header-container"></div>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center mb-16">
            <span class="text-xs font-bold tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-4 py-1.5 rounded-full border border-cyan-500/20">Centro Técnico</span>
            <h1 class="text-4xl font-extrabold text-white sm:text-6xl mt-4 mb-4 tracking-tight">Expedientes de Telemetría</h1>
            <p class="text-slate-400 max-w-xl mx-auto">Requisitos optimizados, arquitectura de motores de juegos y rastreador automático de precios.</p>
        </div>

        <div id="grid-juegos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>
    <script src="header.js"></script>
    <script>
        fetch('telemetria.json')
            .then(res => res.json())
            .then(data => {
                const juegos = data.juegos || [];
                document.getElementById('grid-juegos').innerHTML = juegos.map(j => `
                    <a href="telemetria/${j.id}.html" class="group bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-cyan-500/40 transition flex flex-col h-full relative">
                        <div class="absolute top-3 right-3 bg-slate-950/90 text-cyan-400 font-black text-xs px-2.5 py-1 rounded-lg border border-slate-700/80 z-10">${j.calificacion}</div>
                        <div class="relative w-full aspect-[3/4] overflow-hidden">
                            <img src="${j.imagen}" class="w-full h-full object-cover group-hover:scale-103 transition duration-500">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-transparent"></div>
                        </div>
                        <div class="p-4 bg-slate-950 flex flex-col flex-grow">
                            <span class="text-[9px] font-black text-slate-500 uppercase tracking-wider">${j.plataformas}</span>
                            <h3 class="font-extrabold text-base text-white tracking-wide group-hover:text-cyan-400 transition-colors line-clamp-1 mt-0.5">${j.titulo}</h3>
                            <p class="text-xs text-slate-400 line-clamp-2 mt-2 leading-relaxed">${j.sinopsis}</p>
                        </div>
                    </a>`).join('');
            });
    </script>
</body>
</html>
