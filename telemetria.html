<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetría | KazokuGaming</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
                KAZOKU<span class="text-slate-100">GAMING</span>
            </a>
            <nav class="flex space-x-6 text-sm font-medium">
                <a href="index.html" class="text-slate-400 hover:text-cyan-400 transition">Noticias</a>
                <a href="telemetria.html" class="text-cyan-400 border-b-2 border-cyan-400 px-1 pb-1">Telemetría</a>
                <a href="radar.html" class="text-slate-400 hover:text-cyan-400 transition">Radar de Ofertas</a>
                <a href="hardware.html" class="text-slate-400 hover:text-cyan-400 transition">Hardware</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow">
        <div class="mb-10 border-b border-slate-800 pb-6 flex items-end justify-between">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-white">Análisis de Telemetría</h1>
                <p class="text-slate-400 mt-2 text-sm">Rendimiento, requisitos y arquitectura técnica de tus títulos seleccionados.</p>
            </div>
        </div>

        <div id="grid-juegos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <p class="text-slate-400 text-sm animate-pulse col-span-full text-center">Extrayendo datos telemétricos...</p>
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 py-8 text-center text-sm text-slate-500">
        &copy; 2026 KazokuGaming.
    </footer>

    <script>
        function cargarTelemetria() {
            // RUTA ACTUALIZADA A TELEMETRÍA
            fetch('telemetria.json')
                .then(res => {
                    if (!res.ok) throw new Error('Network response was not ok');
                    return res.json();
                })
                .then(data => {
                    const contenedor = document.getElementById('grid-juegos');
                    if (!data.juegos || data.juegos.length === 0) {
                        contenedor.innerHTML = '<p class="text-slate-400 text-sm col-span-full text-center">No hay expedientes registrados.</p>';
                        return;
                    }
                    
                    let html = '';
                    data.juegos.forEach(juego => {
                        html += `
                        <a href="juego.html?id=${juego.id}" class="group bg-slate-900/40 border border-slate-800/80 rounded-2xl overflow-hidden hover:border-slate-700 hover:bg-slate-900/60 transition-all flex flex-col justify-between hover:-translate-y-1">
                            <div>
                                <div class="aspect-[16/9] w-full overflow-hidden bg-slate-950 relative">
                                    <img src="${juego.imagen || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                </div>
                                <div class="p-5 space-y-2">
                                    <h3 class="font-bold text-base text-white tracking-wide group-hover:text-cyan-400 transition-colors line-clamp-1">${juego.titulo}</h3>
                                    <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider line-clamp-1">${juego.plataformas}</p>
                                    <p class="text-xs text-slate-400 leading-relaxed line-clamp-3 pt-1">${juego.sinopsis}</p>
                                </div>
                            </div>
                            <div class="px-5 pb-5 pt-2 text-right">
                                <span class="text-[11px] font-bold text-cyan-400 group-hover:translate-x-1 inline-block transition-transform">Ver Expediente Técnico →</span>
                            </div>
                        </a>`;
                    });
                    contenedor.innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('grid-juegos').innerHTML = `<p class="text-red-400 text-sm text-center col-span-full">⚠️ El archivo telemetria.json no se encuentra o está vacío.</p>`;
                });
        }
        document.addEventListener('DOMContentLoaded', cargarTelemetria);
    </script>
</body>
</html>
