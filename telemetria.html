<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetría | KazokuGaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">
    <div id="header-container"></div>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center mb-16">
            <h1 class="text-4xl font-extrabold text-white sm:text-6xl mt-4 mb-6 tracking-tight">Centro de Telemetría</h1>
            <p class="text-slate-400 max-w-2xl mx-auto text-lg">Expedientes técnicos, rendimiento real y <strong class="text-amber-400 font-bold">radar de ofertas integrado</strong> para cada título.</p>
        </div>

        <div id="grid-juegos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </main>
    <script src="header.js"></script>
    <script>
        fetch('telemetria.json')
            .then(res => res.json())
            .then(data => {
                const juegos = data.juegos || [];
                const html = juegos.map(juego => `
                    <!-- PASO 1: Enlace directo al HTML estático -->
                    <a href="telemetria/${juego.id}.html" class="group bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden hover:border-cyan-500/50 hover:shadow-[0_0_30px_rgba(6,182,212,0.15)] transition-all duration-300 flex flex-col h-full relative">
                        <div class="absolute top-4 right-4 bg-slate-950/80 backdrop-blur-md text-white font-black text-sm px-3 py-1 rounded-lg border border-slate-700 z-10 shadow-lg">${juego.calificacion}</div>
                        
                        <div class="relative w-full aspect-[3/4] overflow-hidden">
                            <img src="${juego.imagen}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/40 to-transparent"></div>
                        </div>
                        
                        <div class="p-6 flex flex-col flex-grow absolute bottom-0 left-0 w-full bg-gradient-to-t from-slate-950 via-slate-950 to-transparent pt-12">
                            <p class="text-[10px] font-black text-cyan-400 uppercase tracking-widest mb-1 shadow-sm">${juego.plataformas}</p>
                            <h3 class="font-extrabold text-xl text-white tracking-wide group-hover:text-cyan-400 transition-colors line-clamp-1 mb-2">${juego.titulo}</h3>
                            <p class="text-xs text-slate-400 leading-relaxed line-clamp-2">${juego.sinopsis}</p>
                        </div>
                    </a>`).join('');
                document.getElementById('grid-juegos').innerHTML = html;
            });
    </script>
</body>
</html>
