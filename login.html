<html lang="es">
<head>

    <title>Únete gratis a KazokuGaming | Crea tu perfil gamer</title>
    <meta name="description" content="Crea tu perfil gratis en KazokuGaming y encuentra compañeros para jugar en español: escuadrones, partidas y torneos.">
    <link rel="canonical" href="https://www.kazokugaming.com/login.html">

    <meta property="og:site_name" content="KazokuGaming">
    <meta property="og:locale" content="es_ES">
    <meta property="og:url" content="https://www.kazokugaming.com/login.html">
    <meta property="og:title" content="Únete gratis a KazokuGaming | Crea tu perfil gamer">
    <meta property="og:description" content="Crea tu perfil gratis en KazokuGaming y encuentra compañeros para jugar en español: escuadrones, partidas y torneos.">
    <meta property="og:image" content="https://www.kazokugaming.com/icons/og-kazoku.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="KazokuGaming: Nunca vuelvas a jugar solo">

        body { font-family: 'Outfit', sans-serif; background-color: #050508; } 
        .font-display { font-family: 'Space Grotesk', sans-serif; }

</head>
<body class="text-slate-200 min-h-screen flex flex-col lg:flex-row selection:bg-indigo-500/30 selection:text-indigo-200">

    <a href="index.html" class="absolute top-6 left-6 z-50 flex items-center gap-2 text-slate-400 hover:text-white transition-colors font-bold bg-black/50 px-4 py-2 rounded-full backdrop-blur-md border border-white/10">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Volver a la Base
    </a>

    <div class="hidden lg:flex lg:w-1/2 relative bg-slate-900 overflow-hidden items-center justify-center">
        <div class="absolute inset-0 bg-gradient-to-r from-indigo-900/40 to-[#050508] z-10 mix-blend-multiply"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#050508] via-transparent to-transparent z-10"></div>
        <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?ixlib=rb-1.2.1&auto=format&fit=crop&w=1080&q=70&fm=webp" alt="Vista inmersiva gaming" class="absolute inset-0 w-full h-full object-cover opacity-60" loading="lazy" decoding="async">
        
        <div class="relative z-20 p-12 text-center">
            <h2 class="text-5xl font-black text-white mb-4 tracking-tighter">Únete a la<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-fuchsia-400">Familia</span></h2>
            <p class="text-lg text-indigo-200/80 font-medium">Gamers como tú buscando con quién hacer equipo. Gratis y en español.</p>
        </div>
    </div>

    <div class="w-full lg:w-1/2 flex items-center justify-center relative bg-[#050508]">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

        <div class="w-full max-w-md p-8 relative z-10">
            <div class="flex justify-center mb-10">
                <div class="flex items-center gap-2 text-3xl font-black tracking-tighter">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">K</div>
                    <span class="text-white">KAZOKU<span class="text-indigo-400">GAMING</span></span>
                </div>
            </div>

            <div class="flex bg-slate-900/50 p-1 rounded-xl mb-8 border border-slate-800">
                <button id="btn-tab-login" class="flex-1 py-2 text-sm font-bold bg-indigo-600 text-white rounded-lg shadow-md transition-all">Iniciar Sesión</button>
                <button id="btn-tab-registro" class="flex-1 py-2 text-sm font-bold text-slate-400 hover:text-white transition-all">Crear Perfil</button>
            </div>

            <div id="mensaje-sistema" class="hidden mb-4 p-3 rounded-lg text-sm font-bold text-center border"></div>

            <!-- Entrar con Google: un clic, sin contraseña nueva y con el correo ya verificado -->
            <button type="button" id="btn-google" class="w-full py-3.5 bg-white hover:bg-slate-100 text-slate-900 font-bold rounded-xl transition-all flex items-center justify-center gap-3 shadow-lg">
                <svg viewBox="0 0 48 48" class="w-5 h-5" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
                Continuar con Google
            </button>
            <div class="flex items-center gap-3 my-6 text-xs font-bold text-slate-600 uppercase tracking-wider">
                <span class="flex-1 h-px bg-slate-800"></span> o con tu correo <span class="flex-1 h-px bg-slate-800"></span>
            </div>

            <form id="form-acceso" class="space-y-5">
                
                <div id="campo-usuario" class="hidden">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Nombre de Jugador (Gamertag)</label>
                    <input type="text" id="input-usuario" placeholder="Ej: ShadowNinja99" class="w-full bg-slate-900 border border-slate-800 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input type="email" id="input-email" placeholder="tu@correo.com" required class="w-full bg-slate-900 border border-slate-800 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>

                <div>
                    <div class="flex justify-between items-end mb-1">
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Contraseña</label>
                        <button type="button" id="btn-olvide" class="text-xs font-bold text-indigo-400 hover:text-indigo-300">¿Olvidaste tu contraseña?</button>
                    </div>
                    <input type="password" id="input-password" placeholder="••••••••" required minlength="6" class="w-full bg-slate-900 border border-slate-800 text-white px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>

                <button type="button" id="btn-accion-principal" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black rounded-xl transition-all shadow-[0_0_20px_rgba(79,70,229,0.3)] mt-4">
                    Entrar a la Comunidad
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE CONEXIÓN A FIREBASE -->
    <script type="module">
        import {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
        import {
            doc, setDoc, getDoc
        } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
        import { auth, db, updateProfile, sendEmailVerification, serverTimestamp } from './firebase-init.js';
        import { revisarTexto } from './moderacion.js';

        let modoRegistro = false;
        const btnLogin = document.getElementById('btn-tab-login');
        const btnRegistro = document.getElementById('btn-tab-registro');
        const campoUsuario = document.getElementById('campo-usuario');
        const btnAccion = document.getElementById('btn-accion-principal');
        const mensajeSistema = document.getElementById('mensaje-sistema');

        const mostrarMensaje = (texto, tipo) => {
            mensajeSistema.classList.remove('hidden', 'bg-red-500/20', 'border-red-500', 'text-red-400', 'bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
            if (tipo === 'error') {
                mensajeSistema.classList.add('bg-red-500/20', 'border-red-500', 'text-red-400');
            } else {
                mensajeSistema.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
            }
            mensajeSistema.innerText = texto;
        };

        btnRegistro.addEventListener('click', () => {
            modoRegistro = true;
            btnRegistro.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
            btnRegistro.classList.remove('text-slate-400');
            btnLogin.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
            btnLogin.classList.add('text-slate-400');
            campoUsuario.classList.remove('hidden');
            btnAccion.innerText = "Unirme a la Familia";
            mensajeSistema.classList.add('hidden');
        });

        btnLogin.addEventListener('click', () => {
            modoRegistro = false;
            btnLogin.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
            btnLogin.classList.remove('text-slate-400');
            btnRegistro.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
            btnRegistro.classList.add('text-slate-400');
            campoUsuario.classList.add('hidden');
            btnAccion.innerText = "Entrar a la Comunidad";
            mensajeSistema.classList.add('hidden');
        });

        // Reglas mínimas de validación de gamertag (deben coincidir en espíritu
        // con lo que firestore.rules exige para el documento en /usuarios/{uid})
        const gamertagValido = (valor) => {
            const limpio = valor.trim();
            return limpio.length >= 3 && limpio.length <= 30;
        };

        // ---------- Recuperar contraseña ----------
        document.getElementById('btn-olvide').addEventListener('click', async () => {
            const email = document.getElementById('input-email').value.trim();
            if (!email) {
                mostrarMensaje("Escribe tu correo arriba y vuelve a pulsar \"¿Olvidaste tu contraseña?\".", "error");
                document.getElementById('input-email').focus();
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
            } catch (error) {
                if (error.code === 'auth/invalid-email') { mostrarMensaje("Ese correo no parece válido.", "error"); return; }
                // Por privacidad no decimos si el correo existe o no
            }
            mostrarMensaje("Si ese correo tiene cuenta, te llegará un enlace para crear una contraseña nueva. Revisa también el spam.", "exito");
        });

        // ---------- Entrar con Google ----------
        // Si es la primera vez, se crea su perfil con un gamertag sacado de su
        // nombre de Google (filtrado igual que en el registro) y se le lleva a
        // su perfil para que lo cambie si quiere.
        function gamertagDesdeGoogle(user) {
            const candidato = String(user.displayName || '').replace(/\s+/g, ' ').trim().slice(0, 30);
            if (candidato.length >= 3 && revisarTexto(candidato, { contexto: 'nombre' }).ok) return candidato;
            return `Jugador${Math.floor(1000 + Math.random() * 9000)}`;
        }

        const btnGoogle = document.getElementById('btn-google');
        btnGoogle.addEventListener('click', async () => {
            btnGoogle.disabled = true;
            try {
                const { user } = await signInWithPopup(auth, new GoogleAuthProvider());
                const ref = doc(db, 'usuarios', user.uid);
                const perfil = await getDoc(ref);
                if (perfil.exists()) {
                    mostrarMensaje("¡Qué bueno verte de nuevo!", "exito");
                    setTimeout(() => window.location.href = "index.html", 800);
                    return;
                }
                const gamertag = gamertagDesdeGoogle(user);
                await setDoc(ref, { gamertag, email: user.email, creadoEn: serverTimestamp() });
                await updateProfile(user, { displayName: gamertag });
                mostrarMensaje(`¡Bienvenido a la familia, ${gamertag}! Vamos a tu perfil para que lo personalices.`, "exito");
                setTimeout(() => window.location.href = "perfil.html?bienvenida=1", 1500);
            } catch (error) {
                const mensajes = {
                    'auth/popup-closed-by-user': null,
                    'auth/cancelled-popup-request': null,
                    'auth/popup-blocked': "Tu navegador bloqueó la ventana de Google. Permite las ventanas emergentes para este sitio e inténtalo de nuevo.",
                    'auth/account-exists-with-different-credential': "Ya existe una cuenta con ese correo. Entra con tu correo y contraseña.",
                    'auth/unauthorized-domain': "El inicio con Google aún no está activado para este dominio (ver SETUP.md, sección 17).",
                    'auth/operation-not-allowed': "El inicio con Google aún no está activado (ver SETUP.md, sección 17)."
                };
                const msj = error.code in mensajes ? mensajes[error.code] : "No se pudo entrar con Google. Inténtalo de nuevo.";
                if (msj) mostrarMensaje(msj, "error");
                console.error("Error al entrar con Google:", error);
            } finally {
                btnGoogle.disabled = false;
            }
        });

        btnAccion.addEventListener('click', async () => {
            const email = document.getElementById('input-email').value.trim();
            const password = document.getElementById('input-password').value;
            const gamertag = document.getElementById('input-usuario').value.trim();

            if (!email || !password) {
                mostrarMensaje("Por favor, completa todos los campos.", "error");
                return;
            }

            if (password.length < 6) {
                mostrarMensaje("Tu contraseña debe tener al menos 6 caracteres.", "error");
                return;
            }

            if (modoRegistro && !gamertagValido(gamertag)) {
                mostrarMensaje("Tu Gamertag debe tener entre 3 y 30 caracteres.", "error");
                return;
            }

            // El gamertag se muestra en todo el sitio: no debe ser ofensivo, sexual, un enlace ni datos de contacto
            if (modoRegistro) {
                const revision = revisarTexto(gamertag, { contexto: 'nombre' });
                if (!revision.ok) {
                    mostrarMensaje(revision.mensaje, "error");
                    return;
                }
            }

            btnAccion.innerText = "Conectando...";
            btnAccion.disabled = true;

            if (modoRegistro) {
                try {
                    // 1. Crear el usuario en Firebase Auth
                    const credencial = await createUserWithEmailAndPassword(auth, email, password);

                    // 2. Guardar el gamertag en el perfil de Auth (para mostrarlo en el header al instante)
                    await updateProfile(credencial.user, { displayName: gamertag });

                    // 3. Crear el documento de perfil en Firestore (colección "usuarios")
                    //    Esto es lo que firestore.rules valida y protege.
                    await setDoc(doc(db, 'usuarios', credencial.user.uid), {
                        gamertag: gamertag,
                        email: email,
                        creadoEn: serverTimestamp()
                    });

                    // 4. Enviar correo de verificación (no bloqueante: si falla, no impide el registro)
                    sendEmailVerification(credencial.user).catch((err) => console.error("No se pudo enviar el correo de verificación:", err));

                    mostrarMensaje("¡Bienvenido a KazokuGaming! Te enviamos un correo para verificar tu cuenta. Entrando...", "exito");
                    setTimeout(() => window.location.href = "index.html", 2000);
                } catch (error) {
                    let msj = error.message;
                    if (error.code === 'auth/email-already-in-use') msj = "Este correo ya pertenece a la familia.";
                    if (error.code === 'auth/invalid-email') msj = "Ese correo no parece válido.";
                    mostrarMensaje(msj, "error");
                    btnAccion.innerText = "Unirme a la Familia";
                    btnAccion.disabled = false;
                }
            } else {
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    mostrarMensaje("¡Qué bueno verte de nuevo!", "exito");
                    setTimeout(() => window.location.href = "index.html", 1000);
                } catch (error) {
                    mostrarMensaje("Credenciales incorrectas. Intenta de nuevo.", "error");
                    btnAccion.innerText = "Entrar a la Comunidad";
                    btnAccion.disabled = false;
                }
            }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
