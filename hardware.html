<script>
    let hardwareData = {};
    let gamaActual = 'all';

    async function inicializarCatalogoAutomatizado() {
        try {
            // Añadimos un truco anti-caché (?v=) para obligar a GitHub y al navegador a leer en tiempo real
            const respuesta = await fetch('hardware.json?v=' +产生Time = new Date().getTime());
            hardwareData = await respuesta.json();
            
            console.log("Datos cargados del bot:", hardwareData); // Revisa esto en la consola del navegador (F12)
            renderizarTarjetas();
        } catch (error) {
            console.error("Error al sincronizar con el JSON del bot:", error);
            document.getElementById('container-laptops').innerHTML = `<div class="text-slate-400 text-sm py-4">Error al cargar datos. Asegúrate de que hardware.json existe en la raíz.</div>`;
        }
    }

    function renderizarTarjetas() {
        document.getElementById('container-laptops').innerHTML = '';
        document.getElementById('container-handhelds').innerHTML = '';

        Object.keys(hardwareData).forEach(id => {
            const equipo = hardwareData[id];
            
            // Forzamos la lectura limpia de categorías para evitar que se pierdan equipos
            const cat = equipo.category ? equipo.category.toLowerCase().trim() : 'handheld';
            const tier = equipo.tier ? equipo.tier.toLowerCase().trim() : 'baja';

            if (cat === 'laptop') {
                if (gamaActual === 'all' || gamaActual === tier) {
                    document.getElementById('container-laptops').innerHTML += crearTarjetaHTML(id, equipo);
                }
            } else {
                // Cualquier cosa que no sea laptop (consolas, handhelds chinas, xbox, switch) va aquí
                document.getElementById('container-handhelds').innerHTML += crearTarjetaHTML(id, equipo);
            }
        });

        // Alerta visual si tras cargar el bot la sección de laptops sigue vacía en el JSON
        if (document.getElementById('container-laptops').innerHTML === '') {
            document.getElementById('container-laptops').innerHTML = `<div class="text-slate-500 text-sm col-span-3 py-4 text-center border border-dashed border-slate-800 rounded-xl">No se encontraron portátiles registradas en el archivo JSON actual.</div>`;
        }
    }

    function filtrarGama(gama) {
        gamaActual = gama;
        const botones = ['all', 'baja', 'media', 'alta'];
        botones.forEach(b => {
            const btn = document.getElementById(`btn-gama-${b}`);
            if (b === gama) {
                btn.className = "px-4 py-2 rounded-lg bg-emerald-500 text-slate-950 transition cursor-pointer";
            } else {
                btn.className = "px-4 py-2 rounded-lg text-slate-400 hover:text-white transition cursor-pointer";
            }
        });
        renderizarTarjetas();
    }

    function crearTarjetaHTML(id, equipo) {
        let colorBorde = 'hover:border-cyan-500/50';
        let tierBadge = '';

        if (equipo.category === 'laptop') {
            colorBorde = 'hover:border-emerald-500/50';
            const coloresTier = {
                'baja': 'bg-slate-800 text-slate-400 border-slate-700',
                'media': 'bg-blue-950/40 text-blue-400 border-blue-900/40',
                'alta': 'bg-amber-950/40 text-amber-400 border-amber-900/40'
            };
            const tierName = equipo.tier === 'baja' ? 'Entrada' : equipo.tier === 'media' ? 'Media' : 'Alta';
            tierBadge = `<span class="text-[10px] px-2 py-0.5 rounded border font-bold uppercase ${coloresTier[equipo.tier] || coloresTier['baja']}">${tierName}</span>`;
        }

        return `
            <div onclick="showDetails('${id}')" class="group bg-slate-900/40 border border-slate-800/80 rounded-2xl overflow-hidden backdrop-blur-sm ${colorBorde} hover:bg-slate-900/70 hover:scale-[1.02] cursor-pointer transition-all duration-300 flex flex-col justify-between animate-fade-in">
                <div class="p-6 space-y-4">
                    <div class="flex justify-between items-start gap-2">
                        <div>
                            <h3 class="text-lg font-bold text-white group-hover:text-cyan-400 transition-colors line-clamp-1">${equipo.title}</h3>
                            <div class="mt-1 flex gap-1.5 items-center">${tierBadge}</div>
                        </div>
                        <span class="text-xs px-2.5 py-1 rounded-lg font-semibold border bg-slate-800 text-slate-300 border-slate-700 shrink-0">${equipo.brand}</span>
                    </div>
                    <p class="text-sm text-slate-400 leading-relaxed line-clamp-3">${equipo.desc}</p>
                </div>
                <div class="p-6 bg-slate-950/40 border-t border-slate-800/50 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs text-slate-400">
                    <span class="text-cyan-400 font-bold bg-cyan-500/10 px-2 py-1 rounded w-fit">Análisis Completo &rarr;</span>
                    <span class="font-extrabold text-white text-right">${equipo.priceUS} / ${equipo.priceEU}</span>
                </div>
            </div>
        `;
    }

    function showDetails(hardwareId) {
        const data = hardwareData[hardwareId];
        if (!data) return;

        let specsHTML = '';
        data.specs.forEach(spec => {
            specsHTML += `
                <div class="flex justify-between py-3 border-b border-slate-800/60 text-sm gap-4">
                    <span class="text-slate-400 font-medium shrink-0">${spec.label}</span>
                    <span class="text-white text-right font-semibold">${spec.value}</span>
                </div>
            `;
        });

        let prosHTML = '';
        data.pros.forEach(pro => {
            prosHTML += `<li class="flex items-start space-x-3 text-sm text-slate-300"><span class="text-emerald-400 font-bold mt-0.5">✓</span><span>${pro}</span></li>`;
        });

        let contrasHTML = '';
        data.contras.forEach(contra => {
            contrasHTML += `<li class="flex items-start space-x-3 text-sm text-slate-300"><span class="text-rose-400 font-bold mt-0.5">✗</span><span>${contra}</span></li>`;
        });

        const template = `
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-3xl p-6 md:p-10 backdrop-blur-md space-y-8 animate-fade-in">
                <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 border-b border-slate-800 pb-6">
                    <div>
                        <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20 mb-2 inline-block">${data.brand} Hardware</span>
                        <h2 class="text-3xl font-extrabold text-white tracking-tight sm:text-4xl">${data.title}</h2>
                    </div>
                    <div class="flex gap-4 md:gap-8 bg-slate-950/60 p-4 rounded-xl border border-slate-800/80 w-full lg:w-auto justify-between lg:justify-start">
                        <div>
                            <span class="text-[10px] text-slate-500 block font-bold uppercase tracking-wider">🇺🇸 Mercado América</span>
                            <span class="text-lg font-black text-emerald-400">${data.priceUS}</span>
                        </div>
                        <div class="border-l border-slate-800 pl-4">
                            <span class="text-[10px] text-slate-500 block font-bold uppercase tracking-wider">🇪🇺 Mercado Europa</span>
                            <span class="text-lg font-black text-cyan-400">${data.priceEU}</span>
                        </div>
                    </div>
                </div>
                <div class="space-y-3">
                    <h4 class="text-sm font-bold tracking-wider uppercase text-slate-400">Análisis Técnico y Contexto</h4>
                    <p class="text-slate-300 leading-relaxed text-base">${data.desc}</p>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 pt-4">
                    <div class="space-y-6">
                        <div class="bg-emerald-500/5 border border-emerald-500/20 rounded-2xl p-6 space-y-4">
                            <h4 class="text-sm font-bold tracking-wider uppercase text-emerald-400">👍 Pros / Puntos Fuertes</h4>
                            <ul class="space-y-3">${prosHTML}</ul>
                        </div>
                        <div class="bg-rose-500/5 border border-rose-500/20 rounded-2xl p-6 space-y-4">
                            <h4 class="text-sm font-bold tracking-wider uppercase text-rose-400">👎 Contras / Desventajas</h4>
                            <ul class="space-y-3">${contrasHTML}</ul>
                        </div>
                    </div>
                    <div class="bg-slate-950/40 border border-slate-800/60 rounded-2xl p-6 h-fit">
                        <h4 class="text-sm font-bold tracking-wider uppercase text-cyan-400 mb-4">🛠️ Especificaciones de la Plataforma</h4>
                        <div class="divide-y divide-slate-800/40">${specsHTML}</div>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('details-content').innerHTML = template;
        document.getElementById('catalog-view').classList.add('hidden');
        document.getElementById('details-view').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Código auxiliar para limpiar strings en la generación dinámica
    function generateTime() { return new Date().getTime(); }

    function hideDetails() {
        document.getElementById('details-view').classList.add('hidden');
        document.getElementById('catalog-view').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = inicializarCatalogoAutomatizado;
</script>
