<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadgets & Hardware | KazokuGaming</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">
    <div id="header-container"></div>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center mb-12">
            <span class="text-xs font-bold tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Componentes</span>
            <h1 class="text-4xl font-extrabold text-white sm:text-5xl mt-4 mb-3">Enciclopedia de Hardware</h1>
            <p class="text-slate-400 max-w-xl mx-auto">Espacio de debate abierto e informes técnicos detallados sobre componentes de PC de última generación.</p>
        </div>
        
        <div id="grid-hardware" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        
        <div id="modal-opiniones" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl relative">
                <div class="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-900">
                    <div>
                        <h2 class="text-xl font-extrabold text-white">Foro del Componente</h2>
                        <p class="text-[10px] text-cyan-400 font-bold uppercase tracking-wider mt-0.5">Base de Datos en Vivo ⚡</p>
                    </div>
                    <button onclick="cerrarModal()" class="w-8 h-8 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full flex items-center justify-center transition">&times;</button>
                </div>
                
                <div class="p-5 overflow-y-auto flex-grow space-y-4 bg-slate-900/40" id="lista-opiniones"></div>
                
                <div class="p-5 bg-slate-950/60 border-t border-slate-800">
                    <form id="form-opinion" class="space-y-3">
                        <div class="flex space-x-3">
                            <input type="text" id="forum-name" placeholder="Tu Nickname" required class="w-1/2 bg-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none border border-slate-700">
                            <select id="forum-rating" class="w-1/2 bg-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none border border-slate-700">
                                <option value="5">⭐⭐⭐⭐造型 Excelente</option>
                                <option value="4">⭐⭐⭐⭐ Destacado</option>
                                <option value="3">⭐⭐⭐ Promedio</option>
                                <option value="2">⭐⭐ Malo</option>
                                <option value="1">⭐ Basura</option>
                            </select>
                        </div>
                        <textarea id="forum-comment" rows="2" placeholder="Escribe tu veredicto técnico aquí..." required class="w-full bg-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none border border-slate-700 resize-none"></textarea>
                        <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-black py-2.5 rounded-xl transition text-xs uppercase tracking-wider">Enviar Reseña</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="header.js"></script>
    <script>
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_KEY = 'TU_SUPABASE_ANON_KEY';
        let supabaseClient = null;
        try { if(SUPABASE_URL !== 'TU_SUPABASE_URL') supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){}

        let idActualAbierto = null;

        fetch('hardware.json')
            .then(res => res.json())
            .then(data => {
                const equipos = Array.isArray(data) ? data : (data.hardware || []);
                document.getElementById('grid-hardware').innerHTML = equipos.map(hw => `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-cyan-500/20 transition flex flex-col h-full">
                        <div class="w-full aspect-video overflow-hidden">
                            <img src="${hw.imagen || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400'}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <span class="text-[9px] font-black text-cyan-400 uppercase tracking-widest mb-1 block">${hw.categoria || 'Hardware'}</span>
                            <h3 class="text-lg font-extrabold text-white mb-4 leading-tight">${hw.nombre}</h3>
                            <div class="flex-grow"></div>
                            <button onclick="abrirModal('${hw.id}')" class="w-full bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-2.5 rounded-xl transition text-xs border border-slate-700">Comentarios de la Comunidad →</button>
                        </div>
                    </div>`).join('');
            });

        function abrirModal(id) {
            idActualAbierto = id;
            document.getElementById('modal-opiniones').classList.remove('hidden');
            cargarOpinionesSupabase(id);
        }

        function cerrarModal() { document.getElementById('modal-opiniones').classList.add('hidden'); }

        async function cargarOpinionesSupabase(hardware_id) {
            const container = document.getElementById('lista-opiniones');
            if(!supabaseClient) {
                container.innerHTML = `<div class="p-4 bg-amber-500/10 border border-amber-500/20 rounded-xl text-xs text-amber-400 text-center">⚠️ Vincula tus credenciales de Supabase en hardware.html para habilitar la persistencia global del foro.</div>`;
                return;
            }
            container.innerHTML = '<p class="text-center text-slate-500 text-xs animate-pulse py-6">Leyendo base de datos...</p>';
            try {
                const { data, error } = await supabaseClient.from('opiniones_hardware').select('*').eq('hardware_id', hardware_id).order('created_at', { ascending: false });
                if(error) throw error;
                if(!data || data.length === 0) { container.innerHTML = '<p class="text-center text-slate-600 text-xs py-6">No hay comentarios sobre este componente. ¡Sé el primero!</p>'; return; }
                
                container.innerHTML = data.map(op => `
                    <div class="bg-slate-800/40 border border-slate-800/80 rounded-xl p-4">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-white text-xs">${op.autor}</span>
                            <span class="text-yellow-500 text-[10px]">${"⭐".repeat(op.rating)}</span>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed">${op.comentario}</p>
                    </div>`).join('');
            } catch(e) { container.innerHTML = '<p class="text-center text-red-400 text-xs py-6">Error de lectura en Supabase.</p>'; }
        }

        document.getElementById('form-opinion').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!supabaseClient) return alert("Configura Supabase primero.");
            
            const autor = document.getElementById('forum-name').value;
            const rating = parseInt(document.getElementById('forum-rating').value);
            const comentario = document.getElementById('forum-comment').value;

            try {
                const { error } = await supabaseClient.from('opiniones_hardware').insert([{ hardware_id: idActualAbierto, autor, rating, comentario }]);
                if(error) throw error;
                document.getElementById('forum-comment').value = '';
                cargarOpinionesSupabase(idActualAbierto);
            } catch(err) { alert("Error al registrar opinión."); }
        });
    </script>
</body>
</html>
