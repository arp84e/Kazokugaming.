<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadgets & Hardware | KazokuGaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PASO 4: INTEGRACIÓN CON SUPABASE JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">
    <div id="header-container"></div>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center mb-12">
            <span class="text-xs font-bold tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-3 py-1 rounded-full border border-cyan-500/20">Tech & Gears</span>
            <h1 class="text-4xl font-extrabold text-white sm:text-5xl mt-4 mb-4">Enciclopedia de Hardware</h1>
            <p class="text-slate-400 max-w-2xl mx-auto">Análisis técnicos generados por la IA y reseñas reales (conectadas a Supabase) de la comunidad de KazokuGaming.</p>
        </div>
        
        <div id="grid-hardware" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        
        <!-- Modal Supabase Opiniones -->
        <div id="modal-opiniones" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden z-50 flex items-center justify-center p-4 transition-opacity">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.5)] relative">
                <div class="p-6 border-b border-slate-800/80 flex justify-between items-center bg-slate-900/80 sticky top-0 z-10">
                    <div>
                        <h2 class="text-2xl font-extrabold text-white">Foro del Componente</h2>
                        <p class="text-xs text-cyan-400 font-bold uppercase mt-1">Conectado a Supabase ⚡</p>
                    </div>
                    <button onclick="cerrarModal()" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full flex items-center justify-center transition">&times;</button>
                </div>
                
                <div class="p-6 overflow-y-auto flex-grow bg-slate-900/50 space-y-4" id="lista-opiniones">
                    <p class="text-center text-slate-500 py-10">Sincronizando base de datos...</p>
                </div>
                
                <div class="p-6 bg-slate-950/80 border-t border-slate-800/80">
                    <form id="form-opinion" class="space-y-4">
                        <div class="flex space-x-4">
                            <input type="text" id="forum-name" placeholder="Tu apodo pro" required class="w-1/2 bg-slate-800/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 border border-slate-700 transition placeholder-slate-500">
                            <select id="forum-rating" class="w-1/2 bg-slate-800/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 border border-slate-700 transition">
                                <option value="5">⭐⭐⭐⭐⭐ ¡Imprescindible!</option>
                                <option value="4">⭐⭐⭐⭐ Muy Bueno</option>
                                <option value="3">⭐⭐⭐ Cumple</option>
                                <option value="2">⭐⭐ Regular</option>
                                <option value="1">⭐ Dinero a la basura</option>
                            </select>
                        </div>
                        <textarea id="forum-comment" rows="3" placeholder="Escribe tu opinión técnica, ¿lo recomiendas para gaming?" required class="w-full bg-slate-800/50 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 border border-slate-700 transition placeholder-slate-500 resize-none"></textarea>
                        <button type="submit" class="w-full bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-slate-950 font-extrabold py-3 rounded-xl transition shadow-[0_0_15px_rgba(6,182,212,0.3)]">Publicar Análisis en el Foro</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="header.js"></script>
    <script>
        // CONFIGURACIÓN DE SUPABASE (PASO 4)
        // Sustituye con tus credenciales reales en tu entorno local.
        const SUPABASE_URL = 'TU_SUPABASE_URL';
        const SUPABASE_KEY = 'TU_SUPABASE_ANON_KEY';
        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) { console.log('Supabase no inicializado, modo mock activado.'); }

        let idActualAbierto = null;

        fetch('hardware.json')
            .then(res => res.json())
            .then(data => {
                const equipos = Array.isArray(data) ? data : (data.hardware || []);
                const html = equipos.map(hw => `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-cyan-500/40 transition-all duration-300 shadow-lg hover:shadow-[0_0_20px_rgba(6,182,212,0.1)] flex flex-col h-full">
                        <div class="relative w-full aspect-video overflow-hidden">
                            <img src="${hw.imagen || 'https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=400'}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <span class="text-[10px] font-black text-cyan-500 tracking-widest uppercase mb-2">${hw.categoria || 'Hardware'}</span>
                            <h3 class="text-xl font-extrabold text-white mb-2 leading-tight">${hw.nombre}</h3>
                            <div class="flex-grow"></div>
                            <button onclick="abrirModal('${hw.id}')" class="mt-6 w-full bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-2.5 rounded-xl transition border border-slate-700">Ver Foro del Componente →</button>
                        </div>
                    </div>`).join('');
                document.getElementById('grid-hardware').innerHTML = html;
            })
            .catch(() => {
                document.getElementById('grid-hardware').innerHTML = '<p class="text-center col-span-full text-slate-500">Aún no hay hardware analizado.</p>';
            });

        function abrirModal(id) {
            idActualAbierto = id;
            document.getElementById('modal-opiniones').classList.remove('hidden');
            cargarOpinionesSupabase(id);
        }

        function cerrarModal() {
            document.getElementById('modal-opiniones').classList.add('hidden');
        }

        async function cargarOpinionesSupabase(hardware_id) {
            const contenedor = document.getElementById('lista-opiniones');
            contenedor.innerHTML = '<div class="text-center text-cyan-500 py-10 animate-pulse">Consultando Supabase...</div>';
            
            if (!supabaseClient || SUPABASE_URL === 'TU_SUPABASE_URL') {
                // MODO DEMO CUANDO NO HAY KEYS CONFIGURADAS
                setTimeout(() => {
                    contenedor.innerHTML = `
                        <div class="p-4 bg-amber-500/10 border border-amber-500/20 rounded-xl mb-6 text-xs text-amber-400 font-medium text-center">
                            ⚠️ Modo Local: Inserta tus credenciales de Supabase en el código para ver y guardar datos reales.
                        </div>
                        <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-5 relative">
                            <div class="flex justify-between items-start mb-3">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-full bg-cyan-900/50 text-cyan-400 flex items-center justify-center font-bold">K</div>
                                    <span class="font-bold text-white">KazokuDev</span>
                                </div>
                                <span class="text-yellow-500 text-sm tracking-widest drop-shadow-md">⭐⭐⭐⭐⭐</span>
                            </div>
                            <p class="text-sm text-slate-300 leading-relaxed">Excelente componente, rinde espectacular. El paso 4 de la migración a Supabase le da un toque muy profesional a la web.</p>
                        </div>`;
                }, 800);
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('opiniones_hardware')
                    .select('*')
                    .eq('hardware_id', hardware_id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    contenedor.innerHTML = '<p class="text-center text-slate-500 py-10">Sé el primero en opinar sobre este componente.</p>';
                    return;
                }

                contenedor.innerHTML = data.map(op => `
                    <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-5">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-full bg-slate-700 text-white flex items-center justify-center font-bold">${op.autor.charAt(0).toUpperCase()}</div>
                                <span class="font-bold text-white">${op.autor}</span>
                            </div>
                            <span class="text-yellow-500 text-sm tracking-widest drop-shadow-md">${"⭐".repeat(op.rating)}</span>
                        </div>
                        <p class="text-sm text-slate-300 leading-relaxed">${op.comentario}</p>
                    </div>`).join('');
            } catch (err) {
                contenedor.innerHTML = '<p class="text-center text-red-400 py-10">Error al conectar con Supabase.</p>';
            }
        }

        document.getElementById('form-opinion').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!supabaseClient || SUPABASE_URL === 'TU_SUPABASE_URL') {
                alert("Debes configurar tus credenciales reales de Supabase en el archivo hardware.html");
                return;
            }

            const autor = document.getElementById('forum-name').value;
            const rating = parseInt(document.getElementById('forum-rating').value);
            const comentario = document.getElementById('forum-comment').value;

            try {
                const { error } = await supabaseClient.from('opiniones_hardware').insert([
                    { hardware_id: idActualAbierto, autor, rating, comentario }
                ]);
                if (error) throw error;
            } catch (err) {
                console.error(err);
            }

            document.getElementById('forum-comment').value = '';
            cargarOpinionesSupabase(idActualAbierto);
        });
    </script>
</body>
</html>
