<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenimiento & Modding | KazokuGaming</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">
    
    <div id="header-container"></div>
    
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center mb-16">
            <span class="text-xs font-bold tracking-widest text-sky-400 uppercase bg-sky-500/10 px-4 py-1.5 rounded-full border border-sky-500/20">Centro de Servicio Técnico</span>
            <h1 class="text-4xl font-extrabold text-white sm:text-6xl mt-4 mb-4 tracking-tight">Mantenimiento, Mods & Reparación</h1>
            <p class="text-slate-400 max-w-2xl mx-auto">Guías paso a paso detalladas para consolas, PCs, mandos y fuentes de poder. Aprende a reparar y personalizar tu hardware sin complicaciones.</p>
        </div>

        <div id="grid-guias" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="text-slate-500 text-center col-span-full animate-pulse">Accediendo al catálogo de manuales técnicos...</p>
        </div>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-10 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-500 text-sm">
            <p>&copy; 2026 KAZOKUGAMING - TALLER DE HARDWARE.</p>
        </div>
    </footer>

    <script src="header.js"></script>
    <script>
        fetch('guias.json')
            .then(res => {
                if (!res.ok) throw new Error('Error al cargar datos');
                return res.json();
            })
            .then(data => {
                const guias = data.guias || [];
                const grid = document.getElementById('grid-guias');
                
                if (guias.length === 0) {
                    grid.innerHTML = '<p class="text-slate-400 text-center col-span-full">Aún no hay manuales de mantenimiento registrados.</p>';
                    return;
                }
                
                grid.innerHTML = guias.map(g => {
                    const tituloCard = g.titulo || g.juego || 'Manual Técnico';
                    const descripcionCard = g.meta_descripcion || 'Guía técnica paso a paso para reparación de hardware...';
                    const tiempoLectura = g.tiempo_lectura || '15 min';
                    
                    return `
                    <a href="guia.html?id=${g.id}" class="group bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-sky-500/40 transition-all duration-300 hover:-translate-y-1 flex flex-col h-full shadow-lg">
                        <div class="relative w-full aspect-video overflow-hidden">
                          <img src="${g.imagen}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                          <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                          <div class="absolute bottom-3 left-3 bg-sky-500 text-slate-950 text-[10px] font-black uppercase px-2 py-1 rounded">HARDWARE</div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <h3 class="font-extrabold text-xl text-white group-hover:text-sky-400 transition-colors mb-2">${tituloCard}</h3>
                            <p class="text-sm text-slate-400 line-clamp-3 mb-4 flex-grow">${descripcionCard}</p>
                            <span class="text-xs font-bold text-slate-500">${g.fecha} • ⏱️ ${tiempoLectura}</span>
                        </div>
                    </a>`
                }).join('');
            })
            .catch(err => {
                const grid = document.getElementById('grid-guias');
                grid.innerHTML = '<p class="text-red-400 text-center col-span-full">⚠️ Error al cargar la base de datos de guías.</p>';
            });
    </script>
</body>
</html>
