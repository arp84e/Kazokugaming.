<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review de Hardware | KazokuGaming</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #03040b; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <div id="header-container"></div>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full" id="pantalla-producto">
        <div class="text-center py-20 text-amber-500 animate-pulse font-bold tracking-widest uppercase text-xl">
            Cargando expediente tecnológico...
        </div>
    </main>

    <footer class="border-t border-slate-900 bg-[#010205] py-8 text-center text-slate-600 text-sm">&copy; 2026 KAZOKUGAMING.</footer>

    <script src="header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const idActual = new URLSearchParams(window.location.search).get('id');
            const pantalla = document.getElementById('pantalla-producto');

            if(!idActual) return pantalla.innerHTML = `<div class="text-center py-12 text-red-400 font-bold">⚠️ Producto no especificado.</div>`;

            try {
                const response = await fetch('tecnologia.json');
                const data = await response.json();
                const prod = data.productos?.find(p => p.id === idActual);
                
                if(!prod) return pantalla.innerHTML = `<div class="text-center py-12 text-amber-500 font-bold">⚠️ La review de este producto no existe.</div>`;

                document.title = `${prod.titulo} | Review KazokuGaming`;
                
                const htmlPros = prod.pros.map(p => `<li class="flex items-start"><span class="text-emerald-500 mr-2 mt-1">✔️</span><span class="text-slate-300 text-sm">${p}</span></li>`).join('');
                const htmlContras = prod.contras.map(c => `<li class="flex items-start"><span class="text-rose-500 mr-2 mt-1">❌</span><span class="text-slate-300 text-sm">${c}</span></li>`).join('');
                const htmlSpecs = prod.caracteristicas.map(s => `<li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span><span class="text-slate-300 text-sm">${s}</span></li>`).join('');
                const analisisLimpio = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(prod.analisis_profesional) : prod.analisis_profesional;

                pantalla.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
                        <div class="lg:col-span-5 space-y-6">
                            <div class="w-full aspect-square rounded-3xl overflow-hidden border border-slate-800 shadow-2xl relative bg-slate-900">
                                <div class="absolute top-4 left-4 bg-slate-950/90 text-amber-400 font-black text-lg px-4 py-2 rounded-xl border border-slate-700/80 z-10 backdrop-blur-md">Puntuación: ${prod.calificacion}</div>
                                <img src="${prod.imagen}" class="w-full h-full object-cover">
                            </div>

                            <a href="${prod.link_compra}" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-slate-950 font-black text-lg py-4 rounded-2xl transition shadow-[0_0_20px_rgba(245,158,11,0.3)] hover:shadow-[0_0_35px_rgba(245,158,11,0.5)] hover:-translate-y-1">
                                VER OFERTA EN TIENDA →
                            </a>

                            <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-6">
                                <h3 class="text-lg font-bold text-amber-400 border-b border-slate-800 pb-3 mb-4 font-mono uppercase tracking-widest text-xs">Especificaciones Clave</h3>
                                <ul class="space-y-3">${htmlSpecs}</ul>
                            </div>
                        </div>

                        <div class="lg:col-span-7 space-y-8">
                            <div>
                                <span class="text-xs font-black tracking-widest text-slate-500 uppercase">${prod.categoria}</span>
                                <h1 class="text-4xl md:text-5xl font-extrabold text-white mt-2 mb-4 tracking-tight leading-tight">${prod.titulo}</h1>
                                <p class="text-lg text-slate-400">${prod.descripcion_corta}</p>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                <div class="bg-emerald-950/10 border border-emerald-900/30 rounded-3xl p-6">
                                    <h3 class="text-lg font-bold text-emerald-400 mb-4 flex items-center gap-2">Lo Mejor</h3>
                                    <ul class="space-y-3">${htmlPros}</ul>
                                </div>
                                <div class="bg-rose-950/10 border border-rose-900/30 rounded-3xl p-6">
                                    <h3 class="text-lg font-bold text-rose-400 mb-4 flex items-center gap-2">Lo Peor</h3>
                                    <ul class="space-y-3">${htmlContras}</ul>
                                </div>
                            </div>

                            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-xl">
                                <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2"><span class="text-amber-500">🔬</span> Análisis Forense</h3>
                                <div class="prose prose-invert prose-amber max-w-none text-slate-300 leading-relaxed text-[15px]">${analisisLimpio}</div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                pantalla.innerHTML = `<div class="text-center py-12 text-red-500 font-bold">⚠️ Error al procesar datos.</div>`;
            }
        });
    </script>
</body>
</html>
