<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnología y Hardware | KazokuGaming</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #03040b; overflow-x: hidden; scroll-behavior: smooth; } 
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(13, 17, 30, 0.6); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(245, 158, 11, 0.2); }
        .grid-bg { background-image: linear-gradient(rgba(245, 158, 11, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(245, 158, 11, 0.05) 1px, transparent 1px); background-size: 30px 30px; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col selection:bg-amber-500/30 selection:text-amber-200">

    <div id="header-container"></div>

    <main class="flex-grow relative">
        <div class="absolute inset-0 z-0 grid-bg opacity-30 pointer-events-none"></div>
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-amber-600/10 rounded-full blur-[150px] pointer-events-none z-0"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 relative z-10">
            
            <div class="mb-12 text-center md:text-left">
                <span class="inline-flex items-center gap-2 py-1 px-3 rounded text-amber-400 text-[10px] font-mono tracking-widest uppercase mb-4 bg-amber-500/10 border border-amber-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                    Arsenal Técnico
                </span>
                <h1 class="text-4xl md:text-5xl font-black text-white tracking-tight mb-4">Hardware & Tecnología</h1>
                <p class="text-slate-400 max-w-2xl">Análisis forenses y reviews del equipo necesario para dominar. Tarjetas gráficas, periféricos y gadgets analizados por nuestra IA.</p>
            </div>

            <div id="pantalla-carga" class="text-center py-20 text-amber-500 animate-pulse font-mono tracking-widest uppercase text-sm">
                Escaneando inventario...
            </div>

            <div id="contenedor-tecnologia" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden"></div>
            
            <div id="mensaje-error" class="hidden text-center py-20 text-slate-500 font-mono text-sm border border-slate-800 rounded-2xl bg-slate-900/50">
                Aún no hay expedientes de hardware registrados.
            </div>

        </div>
    </main>

    <footer class="border-t border-slate-900 bg-[#010205] py-10 text-center text-slate-600 text-sm font-mono mt-auto relative z-10">&copy; 2026 KAZOKUGAMING.</footer>

    <script src="header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const pantalla = document.getElementById('pantalla-carga');
            const contenedor = document.getElementById('contenedor-tecnologia');
            const error = document.getElementById('mensaje-error');

            try {
                const response = await fetch('tecnologia.json');
                if (!response.ok) throw new Error('No JSON');
                const data = await response.json();
                const productos = data.productos || [];

                pantalla.classList.add('hidden');
                if (productos.length === 0) return error.classList.remove('hidden');

                contenedor.classList.remove('hidden');
                contenedor.innerHTML = productos.map(prod => `
                    <a href="producto.html?id=${prod.id}" class="group glass-panel rounded-2xl overflow-hidden hover:border-amber-500/50 transition-all duration-300 hover:-translate-y-2 flex flex-col h-full shadow-lg">
                        <div class="relative w-full h-48 bg-[#03040b] overflow-hidden border-b border-slate-800/80">
                            <img src="${prod.imagen}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500 opacity-80 group-hover:opacity-100">
                            <div class="absolute top-3 left-3 bg-slate-950/90 text-amber-400 font-black text-xs px-2.5 py-1 rounded-lg border border-slate-700/80 z-10">★ ${prod.calificacion}</div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <h3 class="font-bold text-lg text-white mb-1 line-clamp-1 group-hover:text-amber-400 transition-colors">${prod.titulo}</h3>
                            <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">${prod.categoria}</span>
                            <p class="text-sm text-slate-400 line-clamp-3 mb-4 flex-grow">${prod.descripcion_corta}</p>
                            <div class="mt-auto pt-4 border-t border-slate-800 flex items-center justify-between text-xs font-bold text-amber-400">
                                Leer Review <span class="group-hover:translate-x-1 transition-transform">→</span>
                            </div>
                        </div>
                    </a>
                `).join('');
            } catch (err) {
                pantalla.classList.add('hidden');
                error.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
