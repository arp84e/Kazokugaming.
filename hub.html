<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil del Jugador | Kazoku Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col relative overflow-x-hidden">

    <div class="fixed top-0 right-0 w-[600px] h-[600px] bg-indigo-500/10 rounded-full blur-[150px] pointer-events-none z-0"></div>
    <div id="header-container" class="relative z-50"></div>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full relative z-10">
        
        <div class="mb-10 max-w-xl">
            <div class="relative flex items-center bg-slate-900 border border-slate-800 rounded-xl p-1.5 shadow-lg">
                <input type="text" id="inputJugadorHub" placeholder="Buscar otro jugador..." class="flex-grow bg-transparent text-white px-4 py-2 focus:outline-none text-sm">
                <button id="btnBuscarHub" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-sm py-2 px-6 rounded-lg transition">Buscar</button>
            </div>
        </div>

        <div class="bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-3xl p-6 sm:p-10 mb-8 flex flex-col sm:flex-row items-center sm:items-start gap-6 shadow-xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-cyan-400 to-indigo-500"></div>

            <div class="w-24 h-24 sm:w-32 sm:h-32 rounded-full overflow-hidden border-4 border-slate-800 shrink-0 shadow-lg shadow-cyan-500/20">
                <img src="https://images.unsplash.com/photo-1566577739112-5180d4bf9390?q=80&w=200" alt="Avatar" class="w-full h-full object-cover">
            </div>

            <div class="text-center sm:text-left flex-grow">
                <div class="flex flex-col sm:flex-row sm:items-center gap-3 mb-2">
                    <h1 id="playerName" class="text-3xl sm:text-4xl font-black text-white tracking-tight">Jugador Desconocido</h1>
                    <span class="bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-widest inline-block w-max mx-auto sm:mx-0">
                        Nivel PRO
                    </span>
                </div>
                <p class="text-slate-400 text-sm mb-4">Jugando desde 2021 • Vinculado a PC y PlayStation</p>
                
                <div class="flex flex-wrap justify-center sm:justify-start gap-4">
                    <div class="bg-slate-950/50 border border-slate-800/80 rounded-xl px-4 py-2 flex flex-col">
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">K/D Global</span>
                        <span id="kdGlobal" class="text-lg font-black text-white">0.00</span>
                    </div>
                    <div class="bg-slate-950/50 border border-slate-800/80 rounded-xl px-4 py-2 flex flex-col">
                        <span class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Horas Jugadas</span>
                        <span id="horasJugadas" class="text-lg font-black text-white">0h</span>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="text-xl font-extrabold text-white mb-6 flex items-center gap-2">
            <span class="w-2 h-6 rounded bg-cyan-400 block"></span> Rendimiento por Título
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 hover:border-red-500/50 transition group relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-red-500/10 rounded-full blur-2xl group-hover:bg-red-500/20 transition"></div>
                <div class="flex justify-between items-start mb-6 relative z-10">
                    <div>
                        <span class="text-xs font-bold tracking-widest text-red-500 uppercase">Riot Games</span>
                        <h3 class="text-2xl font-black text-white">Valorant</h3>
                    </div>
                    <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center font-bold text-xs border border-slate-700">DIA</div>
                </div>
                <div class="space-y-4 relative z-10">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="text-sm text-slate-400">Win Rate</span>
                        <span id="winRateVal" class="text-sm font-bold text-white text-right">0%</span>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 hover:border-cyan-400/50 transition group relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-cyan-400/10 rounded-full blur-2xl group-hover:bg-cyan-400/20 transition"></div>
                <div class="flex justify-between items-start mb-6 relative z-10">
                    <div>
                        <span class="text-xs font-bold tracking-widest text-cyan-400 uppercase">Epic Games</span>
                        <h3 class="text-2xl font-black text-white">Fortnite</h3>
                    </div>
                    <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center font-bold text-xs border border-slate-700">BP</div>
                </div>
                <div class="space-y-4 relative z-10">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="text-sm text-slate-400">Victorias</span>
                        <span id="victoriasFortnite" class="text-sm font-bold text-yellow-400 text-right">0</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="header.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Revisamos si en la URL viene el parámetro "?jugador=Nombre"
            const parametros = new URLSearchParams(window.location.search);
            const jugadorRecibido = parametros.get('jugador');

            // Función principal que simula conectar a la base de datos
            function buscarEstadisticas(nombre) {
                if(!nombre) return;

                const nombreEl = document.getElementById('playerName');
                
                // Efecto de "Cargando..."
                nombreEl.innerText = "Conectando con servidores...";
                nombreEl.classList.add('animate-pulse', 'text-cyan-400');

                // Simulamos que la API tarda 1.5 segundos en responder
                setTimeout(() => {
                    // Quitamos la animación
                    nombreEl.classList.remove('animate-pulse', 'text-cyan-400');
                    // Ponemos el nombre en mayúsculas
                    nombreEl.innerText = nombre.toUpperCase();

                    // Generamos estadísticas falsas/aleatorias para la demostración
                    document.getElementById('kdGlobal').innerText = (Math.random() * (2.8 - 0.7) + 0.7).toFixed(2);
                    document.getElementById('horasJugadas').innerText = Math.floor(Math.random() * 4000 + 100) + "h";
                    document.getElementById('winRateVal').innerText = Math.floor(Math.random() * (70 - 40) + 40) + "%";
                    document.getElementById('victoriasFortnite').innerText = Math.floor(Math.random() * 500);

                }, 1500);
            }

            // Si llegamos desde index.html con un nombre, ejecutamos la búsqueda
            if(jugadorRecibido) {
                buscarEstadisticas(jugadorRecibido);
            }

            // Si el usuario usa la barra de búsqueda pequeñita que está dentro del mismo hub
            document.getElementById('btnBuscarHub').addEventListener('click', () => {
                const nuevoNombre = document.getElementById('inputJugadorHub').value.trim();
                if(nuevoNombre) {
                    // Actualiza la URL arriba sin recargar la página (Magia de Single Page Application)
                    window.history.pushState({}, '', '?jugador=' + encodeURIComponent(nuevoNombre));
                    buscarEstadisticas(nuevoNombre);
                    document.getElementById('inputJugadorHub').value = ''; // Limpiar la barra
                }
            });
        });
    </script>
</body>
</html>
