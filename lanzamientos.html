<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario de Lanzamientos | KazokuGaming</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
                KAZOKU<span class="text-slate-100">GAMING</span>
            </a>
            <nav class="flex space-x-6 text-sm font-medium">
                <a href="index.html" class="text-slate-400 hover:text-cyan-400 transition">Noticias</a>
                <a href="lanzamientos.html" class="text-cyan-400 border-b-2 border-cyan-400 px-1 pb-1">Lanzamientos</a>
                <a href="radar.html" class="text-slate-400 hover:text-cyan-400 transition">Radar de Ofertas</a>
                <a href="hardware.html" class="text-slate-400 hover:text-cyan-400 transition">Hardware</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        
        <div class="text-center max-w-3xl mx-auto mb-12">
            <span class="text-xs font-bold tracking-widest text-indigo-400 uppercase bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20">
                Calendario de Lanzamientos
            </span>
            <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl mt-4 mb-4">
                🚀 Próximos Juegos
            </h1>
            <p class="text-lg text-slate-400">
                Explora de forma cronológica los lanzamientos más esperados de la industria en un radar de 3 meses.
            </p>
        </div>

        <div class="flex justify-center mb-10">
            <div class="inline-flex p-1 bg-slate-900/80 border border-slate-800 rounded-xl space-x-1">
                <button onclick="cambiarMes('anterior')" id="btn-anterior" class="px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white cursor-pointer">
                    Mes Anterior
                </button>
                <button onclick="cambiarMes('actual')" id="btn-actual" class="px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-cyan-500 text-white shadow-md shadow-cyan-900/20 cursor-pointer">
                    Mes Actual
                </button>
                <button onclick="cambiarMes('siguiente')" id="btn-siguiente" class="px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white cursor-pointer">
                    Mes Siguiente
                </button>
            </div>
        </div>

        <div id="loading" class="flex flex-col items-center justify-center py-16 space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-400"></div>
        </div>

        <div id="lanzamientos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-900 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-slate-500">
            &copy; 2026 KazokuGaming. Datos de lanzamiento actualizados dinámicamente.
        </div>
    </footer>

    <script>
        let datosLanzamientos = {};
        let mesSeleccionado = 'actual';

        async function inicializarLanzamientos() {
            const grid = document.getElementById('lanzamientos-grid');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('lanzamientos.json?v=' + Date.now());
                datosLanzamientos = await response.json();
                
                renderizarJuegos();
                
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
            } catch (error) {
                console.error("Error al cargar lanzamientos:", error);
                loading.innerHTML = `<p class="text-red-400 font-medium">⚠️ Error al sincronizar el calendario de lanzamientos.</p>`;
            }
        }

        function cambiarMes(mes) {
            mesSeleccionado = mes;
            
            ['anterior', 'actual', 'siguiente'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mes) {
                    btn.className = "px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 bg-cyan-500 text-white shadow-md shadow-cyan-900/20 cursor-pointer";
                } else {
                    btn.className = "px-5 py-2.5 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white cursor-pointer";
                }
            });

            renderizarJuegos();
        }

        function renderizarJuegos() {
            const grid = document.getElementById('lanzamientos-grid');
            const juegos = datosLanzamientos[mesSeleccionado] || [];

            if (juegos.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-slate-900/20 border border-dashed border-slate-800 rounded-2xl">
                        <p class="text-slate-500 text-sm">No se encontraron lanzamientos registrados para este periodo.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = juegos.map(juego => `
                <div class="group bg-slate-900/40 border border-slate-800/80 rounded-2xl overflow-hidden backdrop-blur-sm hover:border-slate-700 hover:bg-slate-900/60 transition-all duration-300 flex flex-col justify-between hover:-translate-y-0.5">
                    <div class="p-6 space-y-4">
                        <div class="flex justify-between items-start gap-4">
                            <h3 class="text-lg font-bold text-white group-hover:text-cyan-400 transition-colors leading-snug">
                                ${juego.titulo}
                            </h3>
                            <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg font-bold whitespace-nowrap border border-slate-700/60 shadow-inner">
                                ${juego.fecha_especifica || 'Por confirmar'}
                            </span>
                        </div>
                        <p class="text-sm text-slate-400 leading-relaxed line-clamp-3">
                            ${juego.descripcion || 'Sin descripción disponible actualmente.'}
                        </p>
                    </div>
                    
                    <div class="p-6 bg-slate-950/40 border-t border-slate-800/50 flex flex-wrap gap-1.5">
                        ${(juego.plataformas || []).map(p => `
                            <span class="text-[10px] uppercase font-bold tracking-wider bg-slate-800/80 text-slate-400 px-2 py-0.5 rounded border border-slate-700/40">
                                ${p}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', inicializarLanzamientos);
    </script>
</body>
</html>
