<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetría | KazokuGaming</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
                KAZOKU<span class="text-slate-100">GAMING</span>
            </a>
            <nav class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html" class="text-slate-400 hover:text-slate-200 transition-colors">Noticias</a>
                <a href="lanzamientos.html" class="text-cyan-400 transition-colors">Telemetría</a>
                <a href="hardware.html" class="text-slate-400 hover:text-slate-200 transition-colors">Hardware</a>
                <a href="radar.html" class="text-slate-400 hover:text-slate-200 transition-colors">Radar de Ofertas</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="mb-10">
            <h1 class="text-3xl font-extrabold text-white tracking-tight sm:text-4xl">Telemetría de Videojuegos</h1>
            <p class="text-sm text-slate-400 mt-2">Expedientes técnicos y análisis de requisitos de los títulos más esperados.</p>
        </div>

        <div id="grid-juegos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <p class="text-slate-500 text-sm animate-pulse">Cargando base de datos de Telemetría...</p>
        </div>
    </main>

    <footer class="border-t border-slate-950 bg-slate-950/60 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 KazokuGaming. Todos los derechos reservados.</p>
    </footer>

    <script>
        function cargarTelemetria() {
            fetch('lanzamientos.json')
                .then(response => response.json())
                .then(data => {
                    const contenedor = document.getElementById('grid-juegos');
                    if (!data.juegos || data.juegos.length === 0) {
                        contenedor.innerHTML = `<p class="text-slate-500 text-sm">No hay registros en Telemetría actualmente.</p>`;
                        return;
                    }

                    let html = '';
                    data.juegos.forEach(juego => {
                        html += `
                        <a href="juego.html?id=${juego.id}" class="group bg-slate-900/40 border border-slate-800/80 rounded-2xl overflow-hidden hover:border-cyan-500/40 transition-all duration-300 hover:scale-[1.02] flex flex-col justify-between">
                            <div>
                                <div class="aspect-[16/10] overflow-hidden bg-slate-950 relative">
                                    <img src="${juego.imagen || 'https://via.placeholder.com/600x400'}" alt="${juego.titulo}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                    <span class="absolute top-3 right-3 text-[10px] font-bold uppercase tracking-wider bg-slate-950/80 backdrop-blur px-2.5 py-1 rounded-md border border-slate-800 text-slate-300">
                                        ${juego.fecha}
                                    </span>
                                </div>
                                <div class="p-5 space-y-2">
                                    <h3 class="font-bold text-base text-white tracking-wide group-hover:text-cyan-400 transition-colors line-clamp-1">
                                        ${juego.titulo}
                                    </h3>
                                    <p class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider line-clamp-1">
                                        ${juego.plataformas}
                                    </p>
                                    <p class="text-xs text-slate-400 leading-relaxed line-clamp-3 pt-1">
                                        ${juego.sinopsis}
                                    </p>
                                </div>
                            </div>
                            <div class="px-5 pb-5 pt-2 text-right">
                                <span class="text-[11px] font-bold text-cyan-400 group-hover:translate-x-1 inline-block transition-transform">Ver Expediente Técnico →</span>
                            </div>
                        </a>`;
                    });
                    contenedor.innerHTML = html;
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('grid-juegos').innerHTML = `<p class="text-red-400 text-sm">⚠️ Error vinculando la base de datos de Telemetría.</p>`;
                });
        }
        document.addEventListener('DOMContentLoaded', cargarTelemetria);
    </script>
</body>
</html>
