<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanzamientos | KazokuGaming</title>
    <!-- Cargamos Tailwind CSS para mantener la uniformidad visual del ecosistema -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes oficiales: Orbitron para títulos e Inter para descripciones -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; }
        .gamer-font { font-family: 'Orbitron', sans-serif; }
        .neon-border-cyan { box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); border: 1px solid rgba(0, 240, 255, 0.4); }
        .neon-glow-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.6); }

        /* Barra Superior Oficial Unificada */
        .header-kz { background-color: rgba(20, 20, 25, 0.85); backdrop-filter: blur(12px); padding: 10px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00f0ff; position: sticky; top: 0; z-index: 100; }
        .logo-img { max-height: 50px; transition: transform 0.3s ease; }
        .logo-img:hover { transform: scale(1.05); }
        .nav-menu { display: flex; list-style: none; gap: 20px; margin: 0; padding: 0; }
        .nav-menu a { color: #a1a1aa; text-decoration: none; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; padding: 8px 16px; border-radius: 6px; border: 1px solid transparent; }
        .nav-menu a:hover { color: #ffffff; text-shadow: 0 0 8px #00f0ff; }
        
        @media (max-width: 768px) { .header-kz { flex-direction: column; gap: 15px; padding: 15px; } .nav-menu { flex-wrap: wrap; justify-content: center; gap: 10px; } }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header Oficial Unificado -->
    <header class="header-kz">
        <a href="index.html" class="logo-container">
            <img src="1779650326105.png" alt="KazokuGaming Logo" class="logo-img">
        </a>
        <nav>
            <ul class="nav-menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="lanzamientos.html" style="color: #ffffff; border: 1px solid #00f0ff; background-color: rgba(0, 240, 255, 0.1);">Lanzamientos</a></li>
                <li><a href="radar.html">Radar de Ofertas</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-6xl mx-auto px-4 mt-8">
        
        <!-- Encabezado de Sección -->
        <div class="border-b border-slate-800 pb-4 mb-8">
            <h1 class="gamer-font text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">
                📅 CALENDARIO DE LANZAMIENTOS
            </h1>
            <p class="text-xs text-gray-400 mt-1">Explora la línea del tiempo: el mes pasado, novedades en curso y lo que viene el próximo mes</p>
        </div>
        
        <!-- Selector de Meses Interactivo (Pestañas móviles) -->
        <div id="tabsMenu" class="flex flex-wrap gap-3 mb-8"></div>

        <!-- Estado de Sincronización Inicial -->
        <div id="loadingLanzamientos" class="text-center py-12">
            <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-cyan-400 mx-auto mb-4"></div>
            <p class="gamer-font text-cyan-400 text-xs tracking-widest animate-pulse">REVISANDO EFEMÉRIDES CON EL BOT...</p>
        </div>

        <!-- Rejilla de Visualización de Videojuegos -->
        <section id="lista-juegos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 hidden"></section>
    </main>

    <!-- Lógica de Control y Despliegue de Datos -->
    <script>
        let datosCatalogo = null;

        // Conecta con la base de datos local generada por tu bot en Python
        async function iniciarCalendario() {
            const loading = document.getElementById('loadingLanzamientos');
            const grid = document.getElementById('lista-juegos');

            try {
                // Forzamos al navegador a leer datos nuevos de Vercel usando la marca de tiempo actual
                const respuesta = await fetch('lanzamientos.json?v=' + Date.now());
                if (!respuesta.ok) throw new Error('Base de datos de lanzamientos no disponible');
                
                datosCatalogo = await respuesta.json();
                
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
                
                // Genera las pestañas dinámicas con los nombres de meses calculados por el bot
                generarBotonesMeses(datosCatalogo.meses_disponibles);
                
                // Por defecto, muestra el índice [1], que corresponde exactamente al mes actual
                mostrarMes(datosCatalogo.meses_disponibles[1]);

            } catch (error) {
                console.error(error);
                loading.innerHTML = `
                    <p class="text-xs text-gray-400 max-w-md mx-auto p-4 border border-dashed border-rose-500 rounded-xl bg-rose-950/20">
                        ⚠️ El catálogo de 3 meses se está estructurando. Si es la primera vez que cargas esta versión, recuerda activar manualmente tu bot en la sección "Actions" de GitHub para sincronizar el archivo.
                    </p>`;
            }
        }

        // Dibuja los botones en la interfaz y resalta el mes activo
        function generarBotonesMeses(meses) {
            const menu = document.getElementById('tabsMenu');
            menu.innerHTML = '';
            meses.forEach((mes, index) => {
                // Si es el mes en curso (índice 1), se le asignan los estilos neón por defecto
                const estilosActivos = index === 1 
                    ? 'border-cyan-400 bg-cyan-950/40 text-cyan-400 shadow-[0_0_10px_rgba(0,240,255,0.15)]' 
                    : 'border-slate-800 bg-slate-900/60 text-gray-400 hover:border-slate-700 hover:text-white';
                
                menu.innerHTML += `
                    <button class="tab-btn px-5 py-2.5 rounded-lg border text-xs font-bold uppercase tracking-wider transition-all duration-200 gamer-font ${estilosActivos}" onclick="cambiarMes(this, '${mes}')">
                        ${mes}
                    </button>
                `;
            });
        }

        // Gestiona el intercambio de pestañas al hacer clic
        function cambiarMes(botonSeleccionado, mes) {
            // Removemos los estilos activos de todos los botones y restauramos su estado apagado
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-5 py-2.5 rounded-lg border text-xs font-bold uppercase tracking-wider transition-all duration-200 gamer-font border-slate-800 bg-slate-900/60 text-gray-400 hover:border-slate-700 hover:text-white";
            });
            // Encendemos el botón presionado
            botonSeleccionado.className = "tab-btn px-5 py-2.5 rounded-lg border text-xs font-bold uppercase tracking-wider transition-all duration-200 gamer-font border-cyan-400 bg-cyan-950/40 text-cyan-400 shadow-[0_0_10px_rgba(0,240,255,0.15)]";
            
            mostrarMes(mes);
        }

        // Construye las tarjetas de juego correspondientes al mes seleccionado
        function mostrarMes(mes) {
            const contenedor = document.getElementById('lista-juegos');
            let html = '';
            
            if (datosCatalogo && datosCatalogo.catalogo[mes]) {
                datosCatalogo.catalogo[mes].forEach(juego => {
                    html += `
                    <div class="bg-slate-950/40 border border-slate-800 rounded-xl overflow-hidden flex flex-col justify-between hover:border-cyan-400/40 transition-all duration-300">
                        <div>
                            <div class="h-48 bg-slate-900 overflow-hidden relative border-b border-slate-800/60">
                                <img src="${juego.imagen}" alt="Portada de ${juego.titulo}" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition-all duration-300">
                                <span class="absolute bottom-3 left-3 bg-rose-600 text-[10px] font-black uppercase tracking-wider px-2 py-1 rounded text-white shadow-md">
                                    📅 ${juego.fecha}
                                </span>
                            </div>
                            <div class="p-5">
                                <h3 class="font-bold text-lg text-white tracking-wide mb-1 truncate" title="${juego.titulo}">${juego.titulo}</h3>
                                <p class="text-xs uppercase font-bold text-cyan-400 tracking-wider gamer-font mb-3">${juego.plataformas}</p>
                                <p class="text-xs text-gray-400 leading-relaxed">${juego.descripcion}</p>
                            </div>
                        </div>
                    </div>`;
                });
                contenedor.innerHTML = html;
            }
        }

        // Inicialización automática de la vista
        iniciarCalendario();
    </script>
</body>
</html>
