<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual de Ingeniería | KazokuGaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #03040b; } 
        /* Estilos especializados para código y notas de ingeniería generados por IA */
        pre { background-color: #0d1117; border: 1px solid #30363d; border-radius: 12px; padding: 1.5rem; overflow-x: auto; margin: 1.5rem 0; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        code { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #a5d6ff; }
        blockquote { border-left: 4px solid #0ea5e9; background: rgba(14, 165, 233, 0.05); padding: 1rem 1.5rem; border-radius: 0 12px 12px 0; font-style: italic; color: #bae6fd; margin: 2rem 0; }
        .prose h2 { color: #fff; font-weight: 800; margin-top: 3rem; margin-bottom: 1.5rem; font-size: 1.8rem; border-bottom: 1px solid rgba(14, 165, 233, 0.2); padding-bottom: 0.5rem; }
        .prose h3 { color: #7dd3fc; font-weight: 700; margin-top: 2rem; margin-bottom: 1rem; font-size: 1.3rem; }
        .prose p { margin-bottom: 1.25rem; color: #cbd5e1; line-height: 1.8; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <div id="header-container"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full" id="pantalla-proyecto">
        <div class="text-center py-32 text-sky-500 animate-pulse font-mono tracking-widest uppercase text-xl">Compilando manual de ingeniería...</div>
    </main>

    <footer class="border-t border-slate-900 bg-[#010205] py-8 text-center text-slate-600 text-sm">
        <p>&copy; 2026 KAZOKUGAMING. Laboratorio Maker.</p>
    </footer>

    <script src="header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const idActual = new URLSearchParams(window.location.search).get('id');
            const pantalla = document.getElementById('pantalla-proyecto');

            if(!idActual) return pantalla.innerHTML = `<div class="text-center py-12 text-red-400 font-bold">⚠️ Proyecto no especificado.</div>`;

            try {
                const response = await fetch('proyectos.json');
                const data = await response.json();
                const proy = data.proyectos?.find(p => p.id === idActual);
                
                if(!proy) return pantalla.innerHTML = `<div class="text-center py-12 text-sky-500 font-bold">⚠️ El proyecto no existe.</div>`;

                document.title = `${proy.titulo} | Manual Maker`;
                
                // Procesamiento de Listas
                const htmlSeguridad = (proy.advertencias_seguridad || []).map(a => `<li class="flex items-start"><span class="text-rose-500 mr-2">⚠️</span><span>${a}</span></li>`).join('');
                const htmlMateriales = (proy.materiales || []).map(m => `<li class="flex items-center gap-2 border-b border-slate-800/50 py-2"><span class="w-1.5 h-1.5 rounded-full bg-sky-500"></span><span class="text-slate-300 text-sm">${m}</span></li>`).join('');
                const htmlHerramientas = (proy.herramientas || []).map(h => `<li class="flex items-center gap-2 border-b border-slate-800/50 py-2"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span><span class="text-slate-300 text-sm">${h}</span></li>`).join('');

                // Bloque de Seguridad Opcional
                const bloqueSeguridad = htmlSeguridad ? `
                    <div class="bg-rose-950/20 border border-rose-900/50 rounded-2xl p-6 mb-8 shadow-[0_0_20px_rgba(225,29,72,0.05)]">
                        <h3 class="text-rose-500 font-black tracking-widest uppercase text-xs mb-3 flex items-center gap-2">Protocolos de Seguridad</h3>
                        <ul class="text-rose-200 text-sm space-y-2 font-medium">${htmlSeguridad}</ul>
                    </div>` : '';
                
                if (typeof DOMPurify === 'undefined') return pantalla.innerHTML = `<div class="text-center text-rose-500 font-bold">⚠️ Error de seguridad.</div>`;
                const htmlLimpio = DOMPurify.sanitize(proy.contenido_html);

                pantalla.innerHTML = `
                    <div class="mb-12 text-center max-w-4xl mx-auto">
                        <span class="text-[10px] font-black tracking-widest text-sky-400 uppercase bg-sky-500/10 px-3 py-1.5 rounded-md border border-sky-500/20">${proy.categoria}</span>
                        <h1 class="text-4xl md:text-5xl lg:text-6xl font-black text-white mt-6 mb-6 tracking-tight leading-tight">${proy.titulo}</h1>
                        <p class="text-lg text-slate-400 font-medium">${proy.descripcion_corta}</p>
                    </div>

                    <div class="w-full aspect-video rounded-[2rem] overflow-hidden border border-slate-800 shadow-2xl relative bg-slate-900 mb-12">
                        <img src="${proy.imagen}" class="w-full h-full object-cover">
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
                        <!-- PANEL LATERAL: Ficha Técnica -->
                        <div class="lg:col-span-4 space-y-6">
                            
                            <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-32 h-32 bg-sky-500/5 rounded-full blur-2xl pointer-events-none"></div>
                                <h3 class="text-white font-black uppercase tracking-widest text-sm mb-6 border-b border-slate-800 pb-3">Especificaciones</h3>
                                <div class="space-y-4 text-sm">
                                    <div class="flex justify-between items-center"><span class="text-slate-500 font-mono">Dificultad</span><span class="font-bold text-white bg-slate-800 px-3 py-1 rounded-md">${proy.dificultad}</span></div>
                                    <div class="flex justify-between items-center"><span class="text-slate-500 font-mono">Inversión Aprox.</span><span class="font-bold text-emerald-400">${proy.costo_estimado}</span></div>
                                    <div class="flex justify-between items-center"><span class="text-slate-500 font-mono">Tiempo de Proyecto</span><span class="font-bold text-sky-400">${proy.tiempo_estimado}</span></div>
                                    <div class="pt-4 mt-4 border-t border-slate-800/50">
                                        <span class="text-slate-500 font-mono block mb-2 text-xs">Conocimientos Previos:</span>
                                        <span class="font-medium text-slate-300 text-xs">${proy.requisitos_conocimiento}</span>
                                    </div>
                                </div>
                            </div>

                            ${bloqueSeguridad}

                            <div class="bg-slate-900/40 border border-sky-900/20 rounded-3xl p-6">
                                <h3 class="text-sky-400 font-black tracking-widest text-sm mb-4 border-b border-sky-900/30 pb-3 flex items-center gap-2">🛠️ Materiales</h3>
                                <ul class="space-y-1">${htmlMateriales}</ul>
                            </div>

                            <div class="bg-slate-900/40 border border-amber-900/20 rounded-3xl p-6">
                                <h3 class="text-amber-500 font-black tracking-widest text-sm mb-4 border-b border-amber-900/30 pb-3 flex items-center gap-2">🧰 Herramientas</h3>
                                <ul class="space-y-1">${htmlHerramientas}</ul>
                            </div>

                        </div>

                        <!-- PANEL PRINCIPAL: Manual de Ingeniería -->
                        <div class="lg:col-span-8">
                            <div class="bg-[#050610] border border-slate-800 rounded-3xl p-8 md:p-12 shadow-2xl relative">
                                <div class="absolute top-4 right-4 bg-slate-900 border border-slate-700 text-slate-500 text-[9px] font-mono tracking-widest px-2 py-1 rounded">DOCUMENTO TÉCNICO CONFIDENCIAL</div>
                                <div class="prose max-w-none w-full">${htmlLimpio}</div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                pantalla.innerHTML = `<div class="text-center py-12 text-rose-500 font-bold">⚠️ Archivo corrupto o no disponible.</div>`;
            }
        });
    </script>
</body>
</html>
