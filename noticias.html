<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias y Guías | KazokuGaming</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; } </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between">
    
    <!-- El menú de navegación -->
    <div id="header-container"></div>
    
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">
        <div class="text-center mb-16">
            <span class="text-xs font-bold tracking-widest text-cyan-400 uppercase bg-cyan-500/10 px-4 py-1.5 rounded-full border border-cyan-500/20">Actualidad</span>
            <h1 class="text-4xl font-extrabold text-white sm:text-6xl mt-4 mb-4 tracking-tight">Últimos Artículos</h1>
            <p class="text-slate-400 max-w-xl mx-auto">Noticias, guías y análisis generados por nuestra inteligencia artificial editorial.</p>
        </div>

        <div id="grid-articulos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="text-slate-500 text-center col-span-full animate-pulse">Sincronizando con la base de datos de artículos...</p>
        </div>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-10 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-500 text-sm">
            <p>&copy; 2026 KAZOKUGAMING.</p>
        </div>
    </footer>

    <script src="header.js"></script>
    <script>
        fetch('articulos.json')
            .then(res => res.json())
            .then(data => {
                const articulos = data.articulos || [];
                const grid = document.getElementById('grid-articulos');
                
                if (articulos.length === 0) {
                    grid.innerHTML = '<p class="text-slate-400 text-center col-span-full">Aún no hay artículos publicados. ¡Ejecuta el bot en GitHub!</p>';
                    return;
                }
                
                grid.innerHTML = articulos.map(a => `
                    <a href="articulo.html?id=${a.id}" class="group bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-cyan-500/40 transition-all duration-300 hover:-translate-y-1 flex flex-col h-full shadow-lg shadow-black/20">
                        <div class="relative w-full aspect-video overflow-hidden">
                          <img src="${a.imagen}" alt="Portada" onerror="this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1200'" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                        </div>
                        <div class="p-6 flex flex-col flex-grow">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="text-[10px] font-black text-cyan-400 uppercase tracking-wider bg-cyan-500/10 border border-cyan-500/20 px-2 py-0.5 rounded">${a.categoria}</span>
                                <span class="text-[10px] text-slate-500 font-bold">${a.fecha}</span>
                            </div>
                            <h3 class="font-extrabold text-xl text-white group-hover:text-cyan-400 transition-colors mb-2 line-clamp-2">${a.titulo}</h3>
                            <p class="text-sm text-slate-400 line-clamp-3 mb-4 flex-grow">${a.meta_descripcion}</p>
                            <span class="text-xs font-bold text-indigo-400 group-hover:text-indigo-300 transition-colors flex items-center gap-1">
                                Leer artículo 
                                <span class="group-hover:translate-x-1 transition-transform">→</span>
                            </span>
                        </div>
                    </a>`).join('');
            })
            .catch(err => {
                console.error(err);
                document.getElementById('grid-articulos').innerHTML = '<p class="text-red-400 text-center col-span-full">⚠️ Error al cargar los artículos.</p>';
            });
    </script>
</body>
</html>
